name: mach live
on:
  push:
    paths: ['.github/workflows/_x.yml']
permissions:
  contents: read
jobs:
  rewrite:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply observed-version rewrite
        shell: cmd
        run: |
          @echo off
          python "%GITHUB_WORKSPACE%\ops\mach-delight-rewrite.py" "C:\Users\AwesomeKai\mach"
          if errorlevel 1 exit /b 11
          echo MACH_LIVE_REWRITE_OK
      - name: Run Mach desktop court
        shell: cmd
        run: |
          @echo off
          python "C:\Users\AwesomeKai\mach\tests\desktop_ui.py" --render "%RUNNER_TEMP%\mach-live-redesign.png"
          if errorlevel 1 exit /b 12
          echo MACH_LIVE_DESKTOP_COURT_OK
