name: mach live
on:
  push:
    paths: ['.github/workflows/_x.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Index Mach architecture
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference='Stop'
          $src='C:\Users\AwesomeKai\mach'
          if (-not (Test-Path $src)) { throw "missing $src" }
          $ext=@('.py','.c','.h','.cpp','.hpp','.rs','.js','.ts','.tsx','.html','.css','.toml','.json','.md','.mach')
          $files=@(Get-ChildItem $src -Recurse -File -Force | Where-Object {
            $rel=$_.FullName.Substring($src.Length).TrimStart('\')
            $parts=$rel -split '\\'
            -not ($parts | Where-Object { $_ -in @('.git','.venv','venv','node_modules','__pycache__','.pytest_cache','build','dist') }) -and
            $_.Length -lt 500000 -and $ext -contains $_.Extension.ToLowerInvariant()
          })
          Write-Host '=== ROOT ==='
          Get-ChildItem $src -Force | Sort-Object PSIsContainer -Descending,Name | ForEach-Object { "{0}`t{1}" -f ($(if($_.PSIsContainer){'DIR'}else{'FILE'}),$_.Name) }
          Write-Host '=== SOURCE PATHS ==='
          $files | ForEach-Object { $_.FullName.Substring($src.Length).TrimStart('\') } | Sort-Object | Select-Object -First 500
          Write-Host '=== ARCHITECTURE SYMBOLS ==='
          $patterns=@('LiveDocument','class Graph','def .*graph','relation','spatial','overlay','decay','tau','pygame','pyglet','glfw','moderngl','tkinter','PyQt','window','renderer','render','editor','interactive','input','event','scheduler','slot','dirty','piece')
          Select-String -Path $files.FullName -Pattern $patterns -CaseSensitive:$false -ErrorAction SilentlyContinue |
            Select-Object -First 800 | ForEach-Object {
              $rel=$_.Path.Substring($src.Length).TrimStart('\')
              "${rel}:$($_.LineNumber): $($_.Line.Trim())"
            }
          Write-Host 'MACH_ARCH_INDEX_OK'
