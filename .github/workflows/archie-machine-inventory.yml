name: ARCHIE machine inventory

# Read-only inventory of the workstation: what projects exist, what moved
# recently, what is duplicated, what holds disk, and what is running. Reports
# only -- it never deletes, moves, or restarts anything. Pushing this file
# fires it, matching the trigger pattern the other workstation workflows use.

on:
  push:
    paths:
      - '.github/workflows/archie-machine-inventory.yml'
  schedule:
    - cron: '41 13 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: archie-machine-inventory
  cancel-in-progress: false

jobs:
  inventory:
    runs-on: [self-hosted, sideways-maker]
    timeout-minutes: 25
    steps:
      - name: Inventory the workstation without mutating it
        shell: bash
        run: |
          set -uo pipefail
          H=/home/awesomekai
          OUT="$RUNNER_TEMP/machine-inventory"
          mkdir -p "$OUT"
          exec > >(tee "$OUT/inventory.txt") 2>&1

          echo ARCHIE_MACHINE_INVENTORY_V1
          date -Iseconds
          hostname
          echo "runner=${RUNNER_NAME:-unknown}"
          echo

          echo '=== DISK ==='
          df -h / /mnt/c 2>/dev/null | sed 's/^/  /' || true
          echo

          echo '=== GPU (read only) ==='
          /usr/lib/wsl/lib/nvidia-smi --query-gpu=name,temperature.gpu,utilization.gpu,memory.used,memory.total --format=csv,noheader 2>/dev/null | sed 's/^/  /' || echo '  unavailable'
          echo

          echo '=== USER SERVICES ==='
          systemctl --user list-units --type=service --all --no-pager --plain 2>/dev/null \
            | awk 'NR>1 && $1 ~ /\.service$/ {print "  " $1 " " $3 "/" $4}' | head -n 60 || echo '  none'
          echo
          echo '--- failed units'
          systemctl --user list-units --state=failed --no-pager --plain 2>/dev/null | sed 's/^/  /' | head -n 20 || true
          echo

          echo '=== GIT PROJECTS (linux side) ==='
          # Bounded scan: repos live a few levels down, not arbitrarily deep.
          mapfile -t REPOS < <(find "$H" -maxdepth 4 -type d -name .git -prune 2>/dev/null | sed 's#/\.git$##' | sort)
          echo "repo_count=${#REPOS[@]}"
          echo
          printf '  %-52s %-12s %-22s %s\n' PATH BRANCH LAST_COMMIT STATE
          for r in "${REPOS[@]}"; do
            b=$(git -C "$r" rev-parse --abbrev-ref HEAD 2>/dev/null || echo '?')
            d=$(git -C "$r" log -1 --format=%cI 2>/dev/null | cut -c1-19 || echo '?')
            dirty=$(git -C "$r" status --porcelain 2>/dev/null | wc -l)
            ahead=$(git -C "$r" rev-list --count '@{u}..HEAD' 2>/dev/null || echo 0)
            state=''
            [ "$dirty" -gt 0 ] && state="dirty:$dirty "
            [ "$ahead" -gt 0 ] && state="${state}unpushed:$ahead"
            [ -z "$state" ] && state='clean'
            printf '  %-52s %-12s %-22s %s\n' "${r#$H/}" "$b" "$d" "$state"
          done
          echo

          echo '=== REDUNDANT CLONES (same remote, multiple paths) ==='
          for r in "${REPOS[@]}"; do
            u=$(git -C "$r" remote get-url origin 2>/dev/null || echo none)
            echo "$u|$r"
          done | sort | awk -F'|' '{c[$1]=c[$1] "\n    " $2; n[$1]++} END {for (k in n) if (n[k]>1 && k!="none") print "  " k " (" n[k] " copies)" c[k]}'
          echo

          echo '=== RECENTLY TOUCHED (7d, source files, excludes caches) ==='
          find "$H" -maxdepth 5 -type f -mtime -7 \
            \( -name '*.py' -o -name '*.mjs' -o -name '*.js' -o -name '*.ts' -o -name '*.md' -o -name '*.json' -o -name '*.yml' \) \
            -not -path '*/node_modules/*' -not -path '*/.git/*' -not -path '*/__pycache__/*' \
            -not -path '*/.venv/*' -not -path '*/site-packages/*' \
            -printf '%T@ %p\n' 2>/dev/null | sort -rn | head -n 40 | while read -r ts p; do
              printf '  %s  %s\n' "$(date -d @"${ts%.*}" '+%Y-%m-%d %H:%M')" "${p#$H/}"
            done
          echo

          echo '=== DISK HOGS (top dirs under home, depth 2) ==='
          du -xh -d2 "$H" 2>/dev/null | sort -rh | head -n 25 | sed 's/^/  /'
          echo

          echo '=== RECLAIMABLE CACHE DIRS ==='
          for pat in node_modules __pycache__ .venv venv .pytest_cache .mypy_cache dist build target; do
            tot=$(find "$H" -maxdepth 6 -type d -name "$pat" -prune 2>/dev/null | wc -l)
            [ "$tot" -gt 0 ] && printf '  %-16s %4d dirs  %s\n' "$pat" "$tot" \
              "$(find "$H" -maxdepth 6 -type d -name "$pat" -prune -exec du -xsb {} + 2>/dev/null | awk '{s+=$1} END {printf "%.1f GB", s/1073741824}')"
          done
          echo

          echo '=== LARGE FILES (>500MB) ==='
          find "$H" -maxdepth 6 -type f -size +500M -not -path '*/.git/*' \
            -printf '%s\t%p\n' 2>/dev/null | sort -rn | head -n 25 \
            | awk -F'\t' '{printf "  %7.1f GB  %s\n", $1/1073741824, $2}'
          echo

          echo '=== DUPLICATE LARGE FILES (identical bytes, >200MB) ==='
          find "$H" -maxdepth 6 -type f -size +200M -not -path '*/.git/*' -print0 2>/dev/null \
            | xargs -0 -r sha256sum 2>/dev/null \
            | awk '{h=$1; $1=""; sub(/^ /,""); f[h]=f[h] "\n    " $0; n[h]++} END {for (h in n) if (n[h]>1) print "  " h " (" n[h] " copies)" f[h]}' | head -n 40
          echo

          echo '=== CHECKPOINTS / MODEL ARTIFACTS ==='
          find "$H" -maxdepth 6 -type f \( -name '*.pt' -o -name '*.safetensors' -o -name '*.gguf' -o -name '*.bin' \) \
            -not -path '*/site-packages/*' -printf '%T@\t%s\t%p\n' 2>/dev/null | sort -rn | head -n 25 \
            | awk -F'\t' '{cmd="date -d @" int($1) " +%Y-%m-%d"; cmd | getline d; close(cmd); printf "  %s  %7.2f GB  %s\n", d, $2/1073741824, $3}'
          echo

          echo '=== WINDOWS SIDE (bounded, slow filesystem) ==='
          WINHOME=$(ls -d /mnt/c/Users/*/ 2>/dev/null | grep -viE '/(Public|Default|All Users)/$' | head -n 1)
          if [ -n "${WINHOME:-}" ]; then
            echo "  windows_home=$WINHOME"
            timeout 180 find "$WINHOME" -maxdepth 3 -type d -name .git -prune 2>/dev/null \
              | sed 's#/\.git$##; s#^#  repo: #' | head -n 30 || echo '  (scan timed out)'
            echo '  --- recent documents/downloads (14d)'
            timeout 120 find "$WINHOME/Downloads" "$WINHOME/Documents" "$WINHOME/Desktop" -maxdepth 2 -type f -mtime -14 \
              -printf '%TY-%Tm-%Td  %p\n' 2>/dev/null | sort -r | head -n 25 | sed 's/^/  /' || echo '  (scan timed out)'
          else
            echo '  no windows user profile reachable'
          fi
          echo

          echo '=== ROOM STATE ==='
          R="$H/archie-remote"
          if [ -f "$R/roast.jsonl" ]; then
            echo "  roast_lines=$(wc -l < "$R/roast.jsonl")"
            echo "  roast_bytes=$(wc -c < "$R/roast.jsonl")"
            echo "  last_event=$(tail -n 1 "$R/roast.jsonl" | head -c 200)"
          else
            echo '  roast.jsonl absent'
          fi
          echo

          echo '=== INVENTORY COMPLETE ==='
          date -Iseconds

      - name: Upload inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: archie-machine-inventory-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/machine-inventory
          if-no-files-found: warn
          retention-days: 14
