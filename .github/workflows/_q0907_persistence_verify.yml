name: q0907 persistence verify

on:
  push:
    paths:
      - '.github/workflows/_q0907_persistence_verify.yml'

jobs:
  first:
    runs-on: self-hosted
    timeout-minutes: 5
    outputs:
      host: ${{ steps.identity.outputs.host }}
      runner: ${{ steps.identity.outputs.runner }}
    steps:
      - id: identity
        name: First job identity
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Write-Host "HOST=$env:COMPUTERNAME"
          Write-Host "RUNNER=$env:RUNNER_NAME"
          "host=$env:COMPUTERNAME" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "runner=$env:RUNNER_NAME" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          if ($env:COMPUTERNAME -ne 'DESKTOP-6FN9B4M') { throw "unexpected host $env:COMPUTERNAME" }
          Write-Host 'Q0907_PERSISTENCE_JOB1_OK'

  second:
    needs: first
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Prove listener survived first job
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Write-Host "FIRST_HOST=${{ needs.first.outputs.host }}"
          Write-Host "FIRST_RUNNER=${{ needs.first.outputs.runner }}"
          Write-Host "SECOND_HOST=$env:COMPUTERNAME"
          Write-Host "SECOND_RUNNER=$env:RUNNER_NAME"
          if ($env:COMPUTERNAME -ne '${{ needs.first.outputs.host }}') { throw 'host changed between jobs' }
          if ($env:RUNNER_NAME -ne '${{ needs.first.outputs.runner }}') { throw 'runner changed between jobs' }
          if ($env:COMPUTERNAME -ne 'DESKTOP-6FN9B4M') { throw "unexpected host $env:COMPUTERNAME" }
          Write-Host 'Q0907_PERSISTENCE_JOB2_OK'
          Write-Host 'Q0907_PERSIST_OK'
