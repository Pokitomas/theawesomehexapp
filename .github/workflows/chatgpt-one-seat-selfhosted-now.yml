name: ChatGPT bounded local one-seat ingress

on:
  push:
    paths:
      - '.github/workflows/chatgpt-one-seat-selfhosted-now.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ingress:
    runs-on: self-hosted
    timeout-minutes: 4
    steps:
      - name: Read existing controller backups and dropins exactly
        shell: pwsh
        run: |
          $ErrorActionPreference='Continue'
          Write-Output 'CHATGPT_CONTROLLER_BACKUP_READ_V2'
          wsl.exe -e bash -lc 'id; echo HOME=$HOME; echo ===BACKUPS===; for f in ~/.config/systemd/user/archie-controller.service.bak-*; do echo ---$f---; cat "$f"; done; echo ===DROPINS===; for f in ~/.config/systemd/user/archie-controller.service.d/*; do echo ---$f---; cat "$f"; done; echo ===TARGETS===; grep -RIlE "8798|seat/head|seat/attach|ARCHIE_CONTROLLER" ~/.local ~/.config ~/archie* ~/mach 2>/dev/null | head -160; echo ===DONE==='
