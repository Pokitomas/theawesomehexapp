name: ChatGPT bounded local one-seat ingress

on:
  push:
    paths:
      - '.github/workflows/chatgpt-one-seat-selfhosted-now.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ingress:
    runs-on: self-hosted
    timeout-minutes: 4
    steps:
      - name: Inspect and repair only the existing local controller unit
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Write-Output 'CHATGPT_CONTROLLER_REPAIR_V1'
          $script = @'
          set -u
          echo '=== ID ==='
          id
          echo HOME=$HOME
          echo '=== UNIT STATUS ==='
          systemctl --user status archie-controller.service --no-pager --full || true
          echo '=== UNIT CAT ==='
          systemctl --user cat archie-controller.service --no-pager || true
          echo '=== FILES ==='
          ls -la ~/.config/systemd/user/archie-controller.service* 2>/dev/null || true
          echo '=== DROPINS ==='
          for f in ~/.config/systemd/user/archie-controller.service.d/*; do [ -f "$f" ] || continue; echo ---$f---; sed -n '1,220p' "$f"; done
          echo '=== BACKUPS ==='
          for f in ~/.config/systemd/user/archie-controller.service.bak-*; do [ -f "$f" ] || continue; echo ---$f---; sed -n '1,220p' "$f"; done
          echo '=== SOURCES ==='
          find ~ -maxdepth 4 -type f \( -iname '*controller*.py' -o -iname '*controller*.service' \) 2>/dev/null | head -120
          echo '=== PROCESS ==='
          ps -eo pid,ppid,etimes,args | grep -Ei '[a]rchie.*controller|[c]ontroller.*8798|[s]eat.*8798' | head -80 || true
          '@
          $tmp = Join-Path $env:RUNNER_TEMP 'inspect-controller.sh'
          [IO.File]::WriteAllText($tmp,$script,(New-Object Text.UTF8Encoding($false)))
          Get-Content -Raw $tmp | wsl.exe -e bash -s
          Write-Output 'CHATGPT_CONTROLLER_REPAIR_INSPECT_DONE'
