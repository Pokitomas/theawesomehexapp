name: ChatGPT bounded local one-seat ingress

on:
  push:
    paths:
      - '.github/workflows/chatgpt-one-seat-selfhosted-now.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ingress:
    runs-on: self-hosted
    timeout-minutes: 3
    steps:
      - name: Diagnose only the local seat controller boundary
        shell: pwsh
        run: |
          $ErrorActionPreference='Continue'
          Write-Output 'CHATGPT_LOCAL_CONTROLLER_DIAG_V1'
          Write-Output ('HOST='+$env:COMPUTERNAME+' RUNNER='+$env:RUNNER_NAME)
          Write-Output '=== PORTS ==='
          Get-NetTCPConnection -State Listen -ErrorAction SilentlyContinue |
            Where-Object { $_.LocalPort -in 8789,8790,8791,8798,8799,8811 } |
            Select-Object LocalAddress,LocalPort,OwningProcess,State | Format-Table -AutoSize
          Write-Output '=== WINDOWS CANDIDATES ==='
          Get-CimInstance Win32_Process -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match 'python|node|pwsh|powershell' -and $_.CommandLine -match 'archie|mach|8798|8799|seat' } |
            Select-Object ProcessId,ParentProcessId,Name,ExecutablePath | Format-Table -AutoSize
          Write-Output '=== MACH SOURCE 8798 REFERENCES ==='
          $root='C:\Users\AwesomeKai\mach'
          $rg=Get-Command rg.exe -ErrorAction SilentlyContinue
          if(-not $rg){$rg=Get-Command rg -ErrorAction SilentlyContinue}
          if($rg -and (Test-Path $root)) {
            & $rg.Source -n -S --hidden --glob '!**/.git/**' --glob '!**/__pycache__/**' --glob '!**/node_modules/**' '8798|/seat/head|/seat/attach' $root 2>$null | Select-Object -First 240
          }
          Write-Output '=== WSL SERVICES / PORTS ==='
          wsl.exe -e bash -lc "echo USER=\$(id -un); echo HOME=\$HOME; systemctl --user --no-pager --full list-units --type=service --all 2>/dev/null | grep -Ei 'archie|mach|seat|controller|resident|sidecar' | head -120 || true; echo ---UNITFILES---; systemctl --user --no-pager --full list-unit-files --type=service 2>/dev/null | grep -Ei 'archie|mach|seat|controller|resident|sidecar' | head -120 || true; echo ---PORTS---; ss -ltnp 2>/dev/null | grep -E ':(8789|8790|8791|8798|8799|8811)( |$)' || true; echo ---USERUNITS---; grep -RIlE '8798|seat/head|seat/attach' ~/.config/systemd/user 2>/dev/null | head -80 || true"
          Write-Output 'CHATGPT_LOCAL_CONTROLLER_DIAG_DONE'
