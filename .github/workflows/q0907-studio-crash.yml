name: Q0907 studio crash

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/q0907-studio-crash.yml'

jobs:
  diagnose:
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - name: Run the actual studio surface once with stderr and print its boot edge
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $root='C:\Users\AwesomeKai\mach'
          $parent='C:\Users\AwesomeKai'
          $py314='C:\Python314\python.exe'
          $py312w='C:\Users\AwesomeKai\AppData\Local\Programs\Python\Python312\pythonw.exe'
          $env:PYTHONPATH=$parent
          $env:RUNNER_TRACKING_ID=''

          $all=@(Get-CimInstance Win32_Process)
          foreach($p in @($all|Where-Object{$_.CommandLine -match 'mach\.core\.keeper'})){Stop-Process -Id $p.ProcessId -Force -ErrorAction SilentlyContinue}
          foreach($p in @($all|Where-Object{$_.CommandLine -match 'studio_run\.py'})){Stop-Process -Id $p.ProcessId -Force -ErrorAction SilentlyContinue}
          Start-Sleep -Seconds 1

          Write-Host '=== STUDIO SOURCE EDGE ==='
          Get-Content (Join-Path $root 'shell\studio_run.py') -TotalCount 260

          Write-Host '=== ONE ACTUAL STUDIO RUN ==='
          @'
          import os,pathlib,subprocess
          root=pathlib.Path(r'C:\Users\AwesomeKai\mach')
          env=os.environ.copy();env['PYTHONPATH']=r'C:\Users\AwesomeKai';env.pop('RUNNER_TRACKING_ID',None)
          p=subprocess.Popen([r'C:\Python314\python.exe',str(root/'shell'/'studio_run.py')],cwd=r'C:\Users\AwesomeKai',env=env,stdout=subprocess.PIPE,stderr=subprocess.PIPE,text=True)
          try:
              out,err=p.communicate(timeout=10)
              print('STUDIO_EXIT='+str(p.returncode))
          except subprocess.TimeoutExpired:
              print('STUDIO_STAYED_UP_10S=1 pid='+str(p.pid));p.terminate()
              try:out,err=p.communicate(timeout=4)
              except subprocess.TimeoutExpired:p.kill();out,err=p.communicate()
          print('STUDIO_STDOUT_BEGIN');print(out[-50000:]);print('STUDIO_STDOUT_END')
          print('STUDIO_STDERR_BEGIN');print(err[-70000:]);print('STUDIO_STDERR_END')
          '@ | & $py314 -

          Write-Host '=== RESTORE KEEPER ==='
          $all=@(Get-CimInstance Win32_Process)
          if(-not ($all|Where-Object{$_.CommandLine -match 'mach\.core\.keeper'})){Start-Process -FilePath $py312w -ArgumentList @('-m','mach.core.keeper') -WorkingDirectory $parent -WindowStyle Hidden}
          Start-Sleep -Seconds 5
          Write-Host 'STUDIO_DIAG_DONE=1'
