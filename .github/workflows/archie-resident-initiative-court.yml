name: ARCHIE resident initiative court

on:
  push:
    branches:
      - gpt56sol/presence-action-core-20260811
      - gpt56sol/resident-initiative-guard-20260811
    paths:
      - 'scripts/archie-resident-initiative.py'
      - 'scripts/archie-local-semantic-broker-v3.py'
      - 'scripts/tests/test_archie_resident_initiative.py'
      - 'scripts/tests/test_archie_local_semantic_broker_v3.py'
      - 'scripts/tests/test_archie_local_semantic_broker_v3_initiative.py'
      - '.github/workflows/archie-resident-initiative-court.yml'
  pull_request:
    paths:
      - 'scripts/archie-resident-initiative.py'
      - 'scripts/archie-local-semantic-broker-v3.py'
      - 'scripts/tests/test_archie_resident_initiative.py'
      - 'scripts/tests/test_archie_local_semantic_broker_v3.py'
      - 'scripts/tests/test_archie_local_semantic_broker_v3_initiative.py'
      - '.github/workflows/archie-resident-initiative-court.yml'

permissions:
  contents: read

jobs:
  court:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax
        run: |
          python3 -m py_compile scripts/archie-resident-initiative.py
          python3 -m py_compile scripts/archie-local-semantic-broker-v3.py
          python3 -m py_compile scripts/tests/test_archie_resident_initiative.py
          python3 -m py_compile scripts/tests/test_archie_local_semantic_broker_v3.py
          python3 -m py_compile scripts/tests/test_archie_local_semantic_broker_v3_initiative.py
      - name: Pure initiative policy court
        run: python3 scripts/tests/test_archie_resident_initiative.py
      - name: Existing broker v3 episodic boundary court
        run: python3 scripts/tests/test_archie_local_semantic_broker_v3.py
      - name: Broker v3 live-delegation regression court
        run: python3 scripts/tests/test_archie_local_semantic_broker_v3_initiative.py
