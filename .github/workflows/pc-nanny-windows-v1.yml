name: PC nanny Windows v1

on:
  push:
    paths:
      - '.github/workflows/pc-nanny-windows-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pc-nanny-windows
  cancel-in-progress: false

jobs:
  windows:
    runs-on: [self-hosted, Windows]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true

      - name: Windows inventory clean and wallpaper
        shell: powershell
        run: |
          $ErrorActionPreference='Continue'
          $User='C:\Users\AwesomeKai'
          $Project=Join-Path $User 'Documents\New project'
          $Nanny=Join-Path $Project 'PC_NANNY_RECEIPT.md'
          $Out=Join-Path $env:RUNNER_TEMP 'pc-nanny-windows-v1.md'
          $Wall=Join-Path $User 'Pictures\2011 Meme Rotation'
          $Src=Join-Path $Wall 'sources'
          New-Item -ItemType Directory -Force $Wall,$Src | Out-Null
          $Before=(Get-PSDrive C).Free

          Start-Transcript -Path $Out -Force | Out-Null
          '# PC NANNY WINDOWS V1'
          "time: $([DateTimeOffset]::Now.ToString('o'))"
          "host: $env:COMPUTERNAME"
          "runner: $env:RUNNER_NAME"
          ''
          '## Guardrails'
          '- Preserve distinct Archie and ACSC model runs.'
          '- Preserve 2.50 GB PWA release ZIP as ready-to-share bundle in this pass.'
          '- V13 Unicode anomaly is audit-only until exact path/hash repair is proven.'
          '- Preserve sidecar/desktop worker/control runners.'
          ''
          '## Existing nanny receipt'
          if(Test-Path $Nanny){Get-Content $Nanny -TotalCount 420}else{'MISSING'}
          ''
          '## GPU'
          & nvidia-smi --query-gpu=name,memory.used,memory.total,utilization.gpu,temperature.gpu,power.draw --format=csv,noheader 2>$null
          'GPU owners:'
          & nvidia-smi --query-compute-apps=pid,process_name,used_memory --format=csv,noheader 2>$null
          ''
          '## Top Windows processes'
          Get-CimInstance Win32_Process | ForEach-Object {
            $p=Get-Process -Id $_.ProcessId -EA SilentlyContinue
            [pscustomobject]@{Id=$_.ProcessId;Name=$_.Name;MB=[math]::Round(($p.WorkingSet64/1MB),1);CommandLine=$_.CommandLine}
          } | Sort-Object MB -Descending | Select-Object -First 100 | Format-Table -Wrap -AutoSize
          ''
          '## Startup'
          Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -EA SilentlyContinue | Format-List
          '## Relevant scheduled tasks'
          Get-ScheduledTask | Where-Object {$_.TaskName -match 'Archie|Claude|Codex|AI|wall|meme|python|node|WSL|Tailscale|Resolve'} | ForEach-Object {
            [pscustomobject]@{Task=$_.TaskName;State=$_.State;Actions=(($_.Actions|ForEach-Object{"$($_.Execute) $($_.Arguments)"}) -join ' | ')}
          } | Format-Table -Wrap -AutoSize
          ''
          '## Wallpaper before'
          Get-ItemProperty 'HKCU:\Control Panel\Desktop' | Select-Object Wallpaper,WallpaperStyle,TileWallpaper | Format-List
          if(Test-Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\Wallpapers'){Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\Wallpapers' | Format-List}
          ''
          '## Windows temp/cache reclaim'
          $cut=(Get-Date).AddDays(-7); $freed=0L; $removed=0
          Get-ChildItem $env:LOCALAPPDATA\Temp -Force -EA SilentlyContinue | Where-Object {$_.LastWriteTime -lt $cut} | ForEach-Object {
            $p=$_.FullName
            $s=0L
            if($_.PSIsContainer){$s=(Get-ChildItem $p -Recurse -File -EA SilentlyContinue | Measure-Object Length -Sum).Sum}else{$s=$_.Length}
            try{Remove-Item $p -Recurse -Force -EA Stop; $freed+=[long]$s; $removed++}catch{}
          }
          foreach($p in @("$env:LOCALAPPDATA\pip\Cache","$env:LOCALAPPDATA\npm-cache\_cacache")){
            if(Test-Path $p){
              $s=(Get-ChildItem $p -Recurse -File -EA SilentlyContinue | Measure-Object Length -Sum).Sum
              Remove-Item "$p\*" -Recurse -Force -EA SilentlyContinue
              $freed+=[long]$s
              "CACHE_CLEANED $p bytes=$s"
            }
          }
          "TEMP_REMOVED count=$removed estimated_bytes=$freed"
          ''
          '## V13 Unicode audit — no mutation'
          if(Test-Path $Nanny){Select-String -Path $Nanny -Pattern 'V13|unicode|filename|delete|replace' -CaseSensitive:$false | Select-Object -First 120 | ForEach-Object {$_.Line}}
          Get-ChildItem $Project -Recurse -File -EA SilentlyContinue | Where-Object {$_.FullName -match 'v13' -and $_.Name -match '[^\x00-\x7F]'} | Select-Object -First 80 FullName,Length,LastWriteTime | Format-Table -Wrap -AutoSize
          ''
          '## Large file candidates — inventory only'
          Get-ChildItem $Project,$User\Downloads -Recurse -File -EA SilentlyContinue | Where-Object {$_.Length -ge 256MB} | Sort-Object Length -Descending | Select-Object -First 160 @{n='GB';e={[math]::Round($_.Length/1GB,3)}},FullName,LastWriteTime | Format-Table -Wrap -AutoSize
          ''
          '## Make web-sourced 2011 meme rotation'
          $urls=@{
            success='https://imgflip.com/s/meme/Success-Kid.jpg';
            scumbag='https://imgflip.com/s/meme/Scumbag-Steve.jpg';
            philo='https://imgflip.com/s/meme/Philosoraptor.jpg';
            troll='https://imgflip.com/s/meme/Troll-Face.jpg';
            badluck='https://imgflip.com/s/meme/Bad-Luck-Brian.jpg';
            fry='https://imgflip.com/s/meme/Futurama-Fry.jpg';
            aliens='https://imgflip.com/s/meme/Ancient-Aliens.jpg';
            boromir='https://imgflip.com/s/meme/One-Does-Not-Simply.jpg';
            nyan='https://i.imgflip.com/atevl.jpg'
          }
          $sourceLines=@('Web-sourced classic meme templates; fetched 2026-08-19.')
          foreach($k in $urls.Keys){
            try{Invoke-WebRequest -UseBasicParsing -Uri $urls[$k] -OutFile (Join-Path $Src "$k.jpg") -TimeoutSec 40; "DOWNLOADED $k"}catch{"DOWNLOAD_FAIL $k $($_.Exception.Message)"}
            $sourceLines += "$k : $($urls[$k])"
          }
          $sourceLines += 'Captions/layout custom for Kai PC spring-clean rotation.'
          Set-Content -Path (Join-Path $Wall 'SOURCES.txt') -Value $sourceLines -Encoding UTF8

          Add-Type -AssemblyName System.Drawing
          $items=@(
            @{s='success.jpg';a='CLEANED TEMP';b='DIDN''T DELETE THE MODEL'},
            @{s='scumbag.jpg';a='SAYS "RELEASE ZIP"';b='CONTAINS THE SAME 2.5 GB'},
            @{s='philo.jpg';a='IF CACHE IS REBUILDABLE';b='WHY IS IT 47 GB'},
            @{s='troll.jpg';a='RUNS ONE MORE SIDECAR';b='47 PORTS LATER'},
            @{s='badluck.jpg';a='DELETES ONE DUPLICATE';b='IT WAS THE CANONICAL COPY'},
            @{s='fry.jpg';a='NOT SURE IF BACKUP';b='OR SECOND PROBLEM'},
            @{s='aliens.jpg';a='DUPLICATE FILES?';b='AGENTS'},
            @{s='boromir.jpg';a='ONE DOES NOT SIMPLY';b='RM -RF ARCHIE'},
            @{s='nyan.jpg';a='GPU AT 0%';b='STILL HEATING THE ROOM'},
            @{s='success.jpg';a='HASHED BOTH RUNS';b='THEY''RE ACTUALLY DIFFERENT'},
            @{s='philo.jpg';a='IS IT A CHECKPOINT';b='IF NOBODY KNOWS WHAT RESUMES IT'},
            @{s='scumbag.jpg';a='MAKES A TEMP DIR';b='CALLS IT PERMANENT'}
          )
          function DrawText([System.Drawing.Graphics]$g,[string]$text,[float]$y,[System.Drawing.Font]$font){
            $fmt=New-Object System.Drawing.StringFormat; $fmt.Alignment='Center'; $fmt.LineAlignment='Center'
            $path=New-Object System.Drawing.Drawing2D.GraphicsPath
            $path.AddString($text,$font.FontFamily,[int]$font.Style,$font.Size,(New-Object System.Drawing.RectangleF(35,$y,1850,145)),$fmt)
            $pen=New-Object System.Drawing.Pen([System.Drawing.Color]::Black,14); $pen.LineJoin='Round'
            $g.DrawPath($pen,$path); $g.FillPath([System.Drawing.Brushes]::White,$path)
            $pen.Dispose();$path.Dispose();$fmt.Dispose()
          }
          $font=New-Object System.Drawing.Font('Impact',78,[System.Drawing.FontStyle]::Regular,[System.Drawing.GraphicsUnit]::Pixel)
          $i=0
          foreach($it in $items){
            $i++;$in=Join-Path $Src $it.s;if(!(Test-Path $in)){continue}
            $bmp=New-Object System.Drawing.Bitmap 1920,1080; $g=[System.Drawing.Graphics]::FromImage($bmp)
            $g.SmoothingMode='HighQuality';$g.InterpolationMode='HighQualityBicubic';$g.TextRenderingHint='AntiAliasGridFit'
            $rect=New-Object System.Drawing.Rectangle 0,0,1920,1080
            $grad=New-Object System.Drawing.Drawing2D.LinearGradientBrush($rect,[System.Drawing.Color]::FromArgb(17,55,105),[System.Drawing.Color]::FromArgb(111,45,119),35)
            $g.FillRectangle($grad,$rect);$grad.Dispose()
            $img=[System.Drawing.Image]::FromFile($in);$scale=[Math]::Min(1180/$img.Width,760/$img.Height);$dw=[int]($img.Width*$scale);$dh=[int]($img.Height*$scale);$x=[int]((1920-$dw)/2);$y=[int]((1080-$dh)/2)
            $g.DrawImage($img,$x,$y,$dw,$dh);$img.Dispose();DrawText $g $it.a 20 $font;DrawText $g $it.b 910 $font;$g.Dispose()
            $out=Join-Path $Wall ('wallpaper-{0:D2}.jpg' -f $i);$bmp.Save($out,[System.Drawing.Imaging.ImageFormat]::Jpeg);$bmp.Dispose()
          }
          $font.Dispose()
          "WALLPAPERS_CREATED=$((Get-ChildItem $Wall -Filter 'wallpaper-*.jpg').Count)"

          $Rotate=Join-Path $Wall 'rotate.ps1'
          @'
          Add-Type @"
          using System;
          using System.Runtime.InteropServices;
          public class KaiWallpaper { [DllImport("user32.dll",CharSet=CharSet.Unicode)] public static extern bool SystemParametersInfo(int a,int b,string c,int d); }
          "@
          $Root='C:\Users\AwesomeKai\Pictures\2011 Meme Rotation'
          $Pics=Get-ChildItem $Root -Filter 'wallpaper-*.jpg'|Sort-Object Name
          if(!$Pics){exit 1}
          $State=Join-Path $Root '.index';$i=0
          if(Test-Path $State){$raw=(Get-Content $State -Raw).Trim();if($raw -match '^\d+$'){$i=[int]$raw}}
          $i=($i+1)%$Pics.Count;Set-Content $State $i -NoNewline
          Set-ItemProperty 'HKCU:\Control Panel\Desktop' WallpaperStyle '10';Set-ItemProperty 'HKCU:\Control Panel\Desktop' TileWallpaper '0'
          [void][KaiWallpaper]::SystemParametersInfo(20,0,$Pics[$i].FullName,3)
          '@ | Set-Content -Path $Rotate -Encoding UTF8

          'Old wallpaper/background tasks (not auto-deleted unless clearly our previous meme task):'
          Get-ScheduledTask | Where-Object {$_.TaskName -match 'wallpaper|background|meme'} | ForEach-Object {[pscustomobject]@{Task=$_.TaskName;State=$_.State;Actions=(($_.Actions|ForEach-Object{"$($_.Execute) $($_.Arguments)"}) -join ' | ')}} | Format-Table -Wrap -AutoSize
          $action=New-ScheduledTaskAction -Execute 'powershell.exe' -Argument ("-NoLogo -NoProfile -WindowStyle Hidden -ExecutionPolicy Bypass -File `"$Rotate`"")
          $trigger=New-ScheduledTaskTrigger -Once -At (Get-Date).AddMinutes(1) -RepetitionInterval (New-TimeSpan -Minutes 15)
          $principal=New-ScheduledTaskPrincipal -UserId $env:USERNAME -LogonType Interactive -RunLevel Limited
          Register-ScheduledTask -TaskName 'Kai 2011 Meme Rotation' -Action $action -Trigger $trigger -Principal $principal -Description 'Classic web meme wallpaper rotation; no AI-subject generator.' -Force | Out-Null
          & $Rotate
          'WALLPAPER_TASK=INSTALLED'
          ''
          '## Disk after'
          $After=(Get-PSDrive C).Free
          "windows_free_before_bytes=$Before"
          "windows_free_after_bytes=$After"
          "windows_delta_free_bytes=$($After-$Before)"
          ''
          '## GPU after'
          & nvidia-smi --query-gpu=name,memory.used,memory.total,utilization.gpu,temperature.gpu,power.draw --format=csv,noheader 2>$null
          & nvidia-smi --query-compute-apps=pid,process_name,used_memory --format=csv,noheader 2>$null
          Stop-Transcript | Out-Null

          Add-Content -Path $Nanny -Value "`r`n`r`n---`r`n`r`n$(Get-Content $Out -Raw)" -EA SilentlyContinue

      - name: Publish Windows receipt
        if: always()
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force machine-receipts | Out-Null
          $src=Join-Path $env:RUNNER_TEMP 'pc-nanny-windows-v1.md'
          if(Test-Path $src){Copy-Item $src machine-receipts\pc-nanny-windows-latest.md -Force}else{Set-Content machine-receipts\pc-nanny-windows-latest.md '# Windows nanny: no receipt produced.'}
          git config user.name 'pc-nanny-windows[bot]'
          git config user.email 'pc-nanny-windows[bot]@users.noreply.github.com'
          git add machine-receipts/pc-nanny-windows-latest.md
          if(-not (git diff --cached --quiet)){git commit -m 'Windows PC nanny receipt [skip ci]'; git pull --rebase; git push}
