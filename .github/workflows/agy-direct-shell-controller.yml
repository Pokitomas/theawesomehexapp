name: AGY direct shell controller

on:
  push:
    paths:
      - '.github/workflows/agy-direct-shell-controller.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  actuate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SHELL_SECRET: ${{ secrets.ARCHIE_SHELL_SECRET }}
    steps:
      - name: Reach authenticated shell and launch AGY court
        shell: python
        run: |
          import json, os, subprocess, time

          receipt=[]
          secret=os.environ.get('SHELL_SECRET','')
          if not secret:
              receipt.append('shell_secret=missing')
              open(os.path.join(os.environ['RUNNER_TEMP'],'agy-direct-receipt.txt'),'w').write('\n'.join(receipt)+'\n')
              raise SystemExit(0)

          raw=secret
          s=secret[1:] if secret.startswith('/') else secret
          base=f'https://desktop-6fn9b4m-1.tail1bf489.ts.net/{s}/shell'

          def redact(x):
              x=x.replace(raw,'[redacted]').replace(s,'[redacted]')
              return x

          def curl(method,url,token=None,obj=None,timeout=25):
              args=['curl','-sS','--max-time',str(timeout),'-w','\n__HTTP__%{http_code}']
              if method=='POST': args += ['-X','POST']
              if token is not None: args += ['-H',f'x-archie-shell-token: {token}']
              if obj is not None:
                  args += ['-H','content-type: application/json','--data-binary',json.dumps(obj)]
              args += [url]
              p=subprocess.run(args,text=True,capture_output=True,timeout=timeout+5)
              return p.returncode, p.stdout+'\n'+p.stderr

          rc,h=curl('GET',base+'/health',timeout=18)
          receipt.append('health='+redact(h)[:1200])
          if '__HTTP__200' not in h:
              open(os.path.join(os.environ['RUNNER_TEMP'],'agy-direct-receipt.txt'),'w').write('\n'.join(receipt)+'\n')
              raise SystemExit(0)

          probe_cmd="printf 'AGY_DIRECT_SHELL_PROBE_OK\\n'; command -v agy || true; agy --version 2>/dev/null || true"
          selected=None
          for route in (base, base+'/exec'):
              for token in (raw,s):
                  rc,r=curl('POST',route,token,{'cmd':probe_cmd},30)
                  receipt.append('probe='+redact(r)[:1800])
                  if 'AGY_DIRECT_SHELL_PROBE_OK' in r and '__HTTP__200' in r:
                      selected=(route,token)
                      break
              if selected: break

          if not selected:
              receipt.append('direct_exec=unavailable')
              open(os.path.join(os.environ['RUNNER_TEMP'],'agy-direct-receipt.txt'),'w').write('\n'.join(receipt)+'\n')
              raise SystemExit(0)

          receipt.append('direct_exec=confirmed')
          route,token=selected
          src='https://raw.githubusercontent.com/Pokitomas/theawesomehexapp/6fc955a12dfafb18f2eb93308f13a7cbdb96a7d8/ops/agy-extension-controller-v3.sh'
          launch=("mkdir -p /home/awesomekai/archie-remote; "
                  "rm -f /home/awesomekai/archie-remote/AGY_EXTENSION_PROOF.txt; "
                  f"nohup bash -lc \"curl -fsSL '{src}' | bash\" "
                  "> /home/awesomekai/archie-remote/AGY_DIRECT_LAUNCH.log 2>&1 </dev/null & "
                  "echo AGY_DIRECT_LAUNCHED:$!")
          rc,r=curl('POST',route,token,{'cmd':launch},35)
          receipt.append('launch='+redact(r)[:2000])
          launched='AGY_DIRECT_LAUNCHED:' in r and '__HTTP__200' in r
          receipt.append('launched='+str(launched).lower())
          if not launched:
              open(os.path.join(os.environ['RUNNER_TEMP'],'agy-direct-receipt.txt'),'w').write('\n'.join(receipt)+'\n')
              raise SystemExit(0)

          poll=("if [ -f /home/awesomekai/archie-remote/AGY_EXTENSION_PROOF.txt ]; then "
                "echo AGY_EXTENSION_PROOF_PRESENT; cat /home/awesomekai/archie-remote/AGY_EXTENSION_PROOF.txt; "
                "echo REPORT_BYTES=$(wc -c </home/awesomekai/archie-remote/AGY_EXTENSION_REPORT.json 2>/dev/null || echo 0); "
                "else echo AGY_EXTENSION_PENDING; tail -n 24 /home/awesomekai/archie-remote/AGY_DIRECT_LAUNCH.log 2>/dev/null || true; fi")
          done=False
          for i in range(18):
              time.sleep(30 if i else 10)
              rc,r=curl('POST',route,token,{'cmd':poll},30)
              clean=redact(r)
              receipt.append(f'poll_{i}='+clean[:3500])
              if 'AGY_EXTENSION_PROOF_PRESENT' in r:
                  done=True
                  break
          receipt.append('proof_seen='+str(done).lower())
          open(os.path.join(os.environ['RUNNER_TEMP'],'agy-direct-receipt.txt'),'w').write('\n'.join(receipt)+'\n')

      - name: Publish sanitized receipt
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs=require('fs');
            const p=process.env.RUNNER_TEMP+'/agy-direct-receipt.txt';
            let text='NO_RECEIPT'; try{text=fs.readFileSync(p,'utf8')}catch(e){text+=` ${e}`}
            if(text.length>50000) text=text.slice(-50000)+'\n...[head truncated]';
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:772,body:`AGY_DIRECT_SHELL_RECEIPT\n\n\`\`\`text\n${text.replace(/```/g,'``\\`')}\n\`\`\``});
