name: ARCHIE control credential probe

on:
  push:
    paths:
      - '.github/workflows/archie-control-secret-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    env:
      S_ARCHIE_RELAY_TOKEN: ${{ secrets.ARCHIE_RELAY_TOKEN }}
      S_RELAY_TOKEN: ${{ secrets.RELAY_TOKEN }}
      S_ARCHIE_SHELL_TOKEN: ${{ secrets.ARCHIE_SHELL_TOKEN }}
      S_REMOTE_ROOT_KEY: ${{ secrets.REMOTE_ROOT_KEY }}
      V_ARCHIE_RELAY_TOKEN: ${{ vars.ARCHIE_RELAY_TOKEN }}
      V_RELAY_TOKEN: ${{ vars.RELAY_TOKEN }}
      V_REMOTE_URL: ${{ vars.REMOTE_URL }}
      V_REMOTE_SESSION: ${{ vars.REMOTE_SESSION }}
    steps:
      - name: Report presence only
        shell: bash
        run: |
          set -euo pipefail
          for k in S_ARCHIE_RELAY_TOKEN S_RELAY_TOKEN S_ARCHIE_SHELL_TOKEN S_REMOTE_ROOT_KEY V_ARCHIE_RELAY_TOKEN V_RELAY_TOKEN V_REMOTE_URL V_REMOTE_SESSION; do
            if [ -n "${!k:-}" ]; then printf '%s=yes\n' "$k"; else printf '%s=no\n' "$k"; fi
          done
