name: ChatGPT direct seat over hosted tailnet

on:
  push:
    paths:
      - '.github/workflows/chatgpt-seat-takeover-tailnet.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  takeover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
      TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
      TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
      TAILSCALE_KEY: ${{ secrets.TAILSCALE_KEY }}
      TSKEY: ${{ secrets.TSKEY }}
    steps:
      - name: Enter tailnet and perform one-seat ingress
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/chatgpt-tailnet-seat.txt"
          exec > >(tee "$OUT") 2>&1
          echo CHATGPT_HOSTED_TAILNET_ONE_SEAT_V2

          auth=''
          for n in TS_AUTHKEY TAILSCALE_AUTHKEY TAILSCALE_AUTH_KEY TAILSCALE_KEY TSKEY; do
            v="${!n:-}"
            if [ -n "$v" ]; then auth="$v"; echo "auth_source=$n"; break; fi
          done
          [ -n "$auth" ] || { echo NO_TAILNET_AUTH; exit 31; }

          curl -fsSL https://tailscale.com/install.sh | sh >/dev/null 2>&1
          sudo tailscale up --auth-key="$auth" --hostname="gpt56-direct-$GITHUB_RUN_ID" --accept-routes=false --timeout=30s >/dev/null

          host=''
          for h in desktop-6fn9b4m-1 desktop-6fn9b4m kai; do
            if tailscale ping --timeout=3s "$h" >/dev/null 2>&1; then host="$h"; break; fi
          done
          [ -n "$host" ] || { echo WORKSTATION_NOT_REACHABLE; tailscale status || true; exit 32; }
          echo "workstation=$host"

          cat > "$RUNNER_TEMP/chatgpt-direct-seat.ps1" <<'POWERSHELL'
          $ErrorActionPreference='Stop'
          $base='http://127.0.0.1:8798'
          $occ='gpt56sol-chatgpt-live'
          function GetJ([string]$p) {
            Invoke-RestMethod -UseBasicParsing -Uri ($base+$p) -TimeoutSec 4
          }
          function PostJ([string]$p,$o) {
            Invoke-RestMethod -UseBasicParsing -Method Post -Uri ($base+$p) -ContentType 'application/json' -Body ($o|ConvertTo-Json -Depth 8 -Compress) -TimeoutSec 4
          }
          function Seat($x) {
            if($null -ne $x.seat) { return $x.seat }
            return $x
          }

          Write-Output 'DIRECT_WINDOWS_LOOPBACK_ONE_SEAT_V2'
          $raw0=GetJ '/seat/head'
          $before=Seat $raw0
          Write-Output ('BEFORE='+($raw0|ConvertTo-Json -Depth 10 -Compress))
          $old=[string]$before.active_occupant
          if($old -match '(?i)claude|anthropic') {
            try {
              $det=PostJ '/seat/detach' @{occupant=$old}
              Write-Output ('DETACH='+($det|ConvertTo-Json -Depth 8 -Compress))
            } catch {
              Write-Output ('DETACH_ERROR='+$_.Exception.Message)
            }
          }

          $attach=PostJ '/seat/attach' @{
            occupant=$occ
            capabilities=@{
              source='chatgpt'
              model='gpt-5.6-sol'
              transport='hosted-tailnet-owner-direct'
              direct_developer=$true
              provider_neutral_seat=$true
            }
          }
          Write-Output ('ATTACH='+($attach|ConvertTo-Json -Depth 8 -Compress))
          $touch=PostJ '/seat/touch' @{occupant=$occ}
          Write-Output ('TOUCH='+($touch|ConvertTo-Json -Depth 8 -Compress))

          $raw1=GetJ '/seat/head'
          $h1=Seat $raw1
          $input0=[int64]($h1.input_seq)
          $output0=[int64]($h1.output_seq)
          $inp=PostJ '/seat/input' @{
            text='go'
            source='chatgpt'
            kind='text'
            metadata=@{ingress='hosted-tailnet-one-seat-v2'}
          }
          Write-Output ('INPUT='+($inp|ConvertTo-Json -Depth 8 -Compress))

          Start-Sleep -Milliseconds 700
          $accepted=$false
          $last=$null
          for($i=0; $i -lt 20; $i++) {
            $raw=GetJ '/seat/head'
            $last=Seat $raw
            $a=[string]$last.active_occupant
            $iq=[int64]($last.input_seq)
            $oq=[int64]($last.output_seq)
            Write-Output ("POLL[$i] occupant=$a input_seq=$iq output_seq=$oq")
            if($a -eq $occ -and $iq -gt $input0) { $accepted=$true; break }
            Start-Sleep -Milliseconds 500
          }
          if(-not $accepted) { throw 'seat/input not observed on active ChatGPT occupant' }

          $heartbeat=Join-Path $env:TEMP 'archie_chatgpt_direct_seat_heartbeat.ps1'
          @'
          $ErrorActionPreference='SilentlyContinue'
          $base='http://127.0.0.1:8798'
          $occ='gpt56sol-chatgpt-live'
          for($i=0; $i -lt 90; $i++) {
            try {
              $h=Invoke-RestMethod -UseBasicParsing -Uri ($base+'/seat/head') -TimeoutSec 3
              if($null -ne $h.seat){$h=$h.seat}
              if([string]$h.active_occupant -ne $occ){break}
              $r=Invoke-RestMethod -UseBasicParsing -Method Post -Uri ($base+'/seat/touch') -ContentType 'application/json' -Body ('{"occupant":"'+$occ+'"}') -TimeoutSec 3
              if(-not $r.ok -and -not $r.touched){break}
            } catch { break }
            Start-Sleep -Seconds 20
          }
          '@ | Set-Content -LiteralPath $heartbeat -Encoding UTF8
          $env:RUNNER_TRACKING_ID=''
          Start-Process powershell.exe -WindowStyle Hidden -ArgumentList @('-NoLogo','-NoProfile','-NonInteractive','-ExecutionPolicy','Bypass','-File',$heartbeat)

          $finalRaw=GetJ '/seat/head'
          $final=Seat $finalRaw
          Write-Output ('FINAL='+($finalRaw|ConvertTo-Json -Depth 10 -Compress))
          Write-Output ("CHATGPT_ONE_SEAT_READY active_occupant=$($final.active_occupant) input_seq=$($final.input_seq) output_seq=$($final.output_seq) baseline_output_seq=$output0")
          POWERSHELL

          remote='/mnt/c/Users/AwesomeKai/AppData/Local/Temp/chatgpt-direct-seat.ps1'
          tailscale ssh "awesomekai@$host" "cat > '$remote'" < "$RUNNER_TEMP/chatgpt-direct-seat.ps1"
          tailscale ssh "awesomekai@$host" "powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File 'C:\\Users\\AwesomeKai\\AppData\\Local\\Temp\\chatgpt-direct-seat.ps1'"

      - name: Publish direct-seat proof
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs=require('fs');
            const p=process.env.RUNNER_TEMP+'/chatgpt-tailnet-seat.txt';
            let text='NO_RECEIPT'; try{text=fs.readFileSync(p,'utf8')}catch(e){text+=' '+String(e)}
            if(text.length>45000) text=text.slice(-45000);
            await github.rest.issues.createComment({
              owner:context.repo.owner,
              repo:context.repo.repo,
              issue_number:771,
              body:`CHATGPT_HOSTED_TAILNET_SEAT_RECEIPT\nrun_id=${context.runId}\n\n\`\`\`text\n${text.replace(/```/g,'``\\`')}\n\`\`\``
            });
