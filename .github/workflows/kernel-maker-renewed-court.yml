name: kernel-maker-renewed-court
on:
  push:
    branches: [main, kernel-maker-renewed-20260826]
    paths:
      - 'renewed_kernel_maker/**'
      - '.github/workflows/kernel-maker-renewed-court.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  court:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax court
        run: python -m compileall -q renewed_kernel_maker
      - name: Unified promotion court
        env:
          PYTHONPATH: renewed_kernel_maker
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p renewed_kernel_maker/evidence
          python renewed_kernel_maker/court.py | tee renewed_kernel_maker/evidence/promotion-court.json
      - name: Verify fullstack app family
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          required = [
              'FULLSTACK.md','voxel_game.py','corpus_foundry.py','model_sourcing.py',
              'render_ffmpeg.py','preference_train.py','video_editor_app/index.html'
          ]
          for rel in required:
              p = Path('renewed_kernel_maker') / rel
              assert p.is_file(), rel
          s=(Path('renewed_kernel_maker')/'video_editor_app/index.html').read_text(encoding='utf-8')
          assert 'ARCHIE CUT' in s and 'archie-video-editor/v1' in s
          print('FULLSTACK_STATIC_COURT_OK')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kernel-maker-renewed-evidence
          path: renewed_kernel_maker/evidence/
          if-no-files-found: warn
