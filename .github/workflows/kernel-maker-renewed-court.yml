name: kernel-maker-renewed-court
on:
  push:
    branches: [main, kernel-maker-renewed-20260826]
    paths:
      - 'renewed_kernel_maker/**'
      - '.github/workflows/kernel-maker-renewed-court.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  court:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax court
        run: python -m compileall -q renewed_kernel_maker
      - name: Unified promotion court
        env:
          PYTHONPATH: renewed_kernel_maker
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p renewed_kernel_maker/evidence
          python renewed_kernel_maker/court.py | tee renewed_kernel_maker/evidence/promotion-court.json
      - name: Verify editor/runtime contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          app=Path('renewed_kernel_maker/video_editor_app/index.html')
          s=app.read_text(encoding='utf-8')
          assert '<video' in s and 'ARCHIE CUT' in s
          assert 'http://' not in s and 'https://' not in s
          assert 'archie-video-editor/v1' in s
          assert 'V1' in s and 'A1' in s and 'trim-range' in s
          assert Path('renewed_kernel_maker/render_ffmpeg.py').is_file()
          assert Path('renewed_kernel_maker/preference_train.py').is_file()
          print('EDITOR_RUNTIME_STATIC_COURT_OK', app.stat().st_size)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kernel-maker-renewed-evidence
          path: renewed_kernel_maker/evidence/
          if-no-files-found: warn

  vercel_live_pipe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: POST owner timebox to live Vercel relay
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, urllib.request
          text='''OWNER-AUTHORIZED LIVE CONTINUATION. Enter the existing local controller now and execute a 15-minute maximal bare-metal project timebox as a continuous pipe. Read and verify localhost:8798 seat/head; if stale/disposable attach+touch gpt56sol-chatgpt-live, yield on later replacement, preserve controller/worker/Edge/Roblox/unrelated processes. Pull Pokitomas/theawesomehexapp main and continue renewed_kernel_maker/state.json without waiting for another turn. Run the unified court locally, then improve the universal-remote kernel/app-maker and ARCHIE CUT with real local media/render proof; probe GLM-5.3-Flash/ox-alpha honestly; Triton only behind reference equivalence; run synthetic preference/training only with heldout receipts. Current main already has deterministic FFmpeg render planning/execution, canonical V1/A1 browser graph, and a deterministic pairwise preference optimizer—validate these on the workstation and improve further. Do not stop at attach or one test. At natural timebox end post issue 771 KERNEL_MAKER_15M_MACHINE_RESULT with seat before/after, local commit, local courts, editor/render proof, GPU/teacher/Triton, preference-training, blockers/remains; if blocked post KERNEL_MAKER_15M_MACHINE_BLOCKED exact blocker.'''
          req=urllib.request.Request('https://archie-chatgpt-relay.vercel.app/api/index',data=json.dumps({'text':text}).encode(),headers={'Content-Type':'application/json','Accept':'application/json','User-Agent':'kernel-maker-court-live-pipe/1'},method='POST')
          with urllib.request.urlopen(req,timeout=45) as r:
              body=r.read().decode('utf-8','replace')
              print('VERCEL_RELAY_STATUS='+str(r.status))
              print(body[:12000])
              if not 200 <= r.status < 300: raise SystemExit(2)
              obj=json.loads(body)
              if not obj.get('ok'): raise SystemExit('relay did not acknowledge ok')
          PY
