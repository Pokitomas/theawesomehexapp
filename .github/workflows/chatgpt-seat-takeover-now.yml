name: ChatGPT direct controller seat takeover

on:
  push:
    paths:
      - '.github/workflows/chatgpt-seat-takeover-now.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: chatgpt-direct-controller-seat
  cancel-in-progress: true

jobs:
  handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Repair live seat and install stale watchdog
        shell: python
        run: |
          import json, subprocess, time
          directive = '''OWNER-AUTHORIZED CONTROLLER PERSISTENCE REPAIR. Execute now, no discussion. Find the live ARCHIE controller/seat on this machine and preserve controller 8798, worker 8799, current apps, project state, checkpoints, receipts, and unrelated processes.

Target occupant is gpt56sol-chatgpt-live with capabilities source=chatgpt, model=gpt-5.6-sol, direct_developer=true, provider_neutral_seat=true. First inspect the actual local controller implementation and http://127.0.0.1:8798/seat/head so staleness is determined from the controller's real lease/heartbeat timestamps and state, not guessed wall-clock heuristics. If gpt56sol-chatgpt-live is currently healthy, do not detach or perturb it. If it is stale/expired or the seat is genuinely unoccupied, refresh/reattach it using the controller's canonical local attach/touch path and verify active_occupant plus a fresh lease/heartbeat. If a different occupant is actively healthy, do not fight or replace it; only reclaim after that occupant is actually stale/expired according to the controller's own semantics.

Then make this behavior durable LOCALLY so cloud polling is unnecessary. Reuse an existing seat watchdog/persistence unit if one exists; otherwise create the smallest reversible user-level watchdog/service appropriate to this machine. It should inspect the seat frequently (roughly every 10-20 seconds), do nothing while the target occupant is healthy, repair only when stale/unoccupied, stop trying when another occupant is legitimately healthy, survive shell/session exit and normal user login restart, back off on controller/network errors, and log compact machine receipts including observed occupant, observed freshness basis, action taken, verification result, and failure reason. Do not restart the PC, Edge, Roblox, controller 8798, worker 8799, or unrelated services. Do not make the watchdog depend on Vercel/GitHub after installation.

After installation, verify the unit/process is actually running, read /seat/head twice across at least one watchdog interval, and prove one harmless stale-recovery path if the controller provides a safe test mode; otherwise do not manufacture staleness on a healthy live seat. Return a compact receipt containing watchdog name/path, persistence mechanism, polling interval, current occupant, freshness evidence, and verification result.''' 
          p = subprocess.run([
              'curl','-sS','--max-time','45','-X','POST',
              '-H','content-type: application/json','-H','accept: application/json',
              '--data-binary',json.dumps({'text':directive}),
              'https://archie-chatgpt-relay.vercel.app/api/index'
          ],text=True,capture_output=True,timeout=52)
          print('relay_rc='+str(p.returncode))
          print((p.stdout+p.stderr)[:12000])
          time.sleep(10)
          if p.returncode != 0:
              raise SystemExit(p.returncode)
      - name: Publish delivery receipt
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:771,body:`CHATGPT_STALE_WATCHDOG_DELIVERED\nrun_id=${context.runId}`});

