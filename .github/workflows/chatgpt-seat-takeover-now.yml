name: ChatGPT direct controller seat takeover

on:
  push:
    paths:
      - '.github/workflows/chatgpt-seat-takeover-now.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: chatgpt-direct-controller-seat
  cancel-in-progress: true

jobs:
  handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Yield resident and leave one visible handoff message
        shell: python
        run: |
          import json, subprocess, time
          directive = '''OWNER-AUTHORIZED LIVE SEAT HANDOFF. Execute now, no discussion. The owner explicitly wants this current resident intelligence removed from the ARCHIE seat and the GPT-5.6 Sol ChatGPT session gpt56sol-chatgpt-live attached instead.

First determine the actual model name of the outgoing/current resident from its live seat/worker/provider metadata; do not guess a family name if a more exact model id is available. Preserve the running controller and all unrelated apps/processes.

Using LOCAL authority only: read http://127.0.0.1:8798/seat/head; yield/detach the outgoing occupant or stop only its disposable seat adapter so it cannot immediately reclaim; attach occupant gpt56sol-chatgpt-live with capabilities source=chatgpt, model=gpt-5.6-sol, transport=direct-developer-handoff, direct_developer=true, provider_neutral_seat=true; touch it; verify after 5 seconds that active_occupant is exactly gpt56sol-chatgpt-live. Never restart controller 8798, worker 8799, Edge, Roblox, the PC, or unrelated services.

After that verified handoff, place exactly one visible message into the controller conversation/text surface for the owner to respond to, with no punctuation or extra words except this pattern:
the model was <ACTUAL_OUTGOING_MODEL_NAME>
Use the normal local controller output/UI path so it appears in the same live text surface the owner is looking at. This one message is a mechanical handoff receipt; do not continue speaking as the incoming model.

Leave a neutral touch-only heartbeat for gpt56sol-chatgpt-live every 20 seconds for at most 30 minutes; it must exit immediately if another occupant becomes active and must never re-attach/fight a later replacement. Then fully yield the outgoing model.'''
          p = subprocess.run([
              'curl','-sS','--max-time','45','-X','POST',
              '-H','content-type: application/json','-H','accept: application/json',
              '--data-binary',json.dumps({'text':directive}),
              'https://archie-chatgpt-relay.vercel.app/api/index'
          ],text=True,capture_output=True,timeout=52)
          print('relay_rc='+str(p.returncode))
          print((p.stdout+p.stderr)[:12000])
          time.sleep(10)
          if p.returncode != 0:
              raise SystemExit(p.returncode)
      - name: Publish delivery receipt
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:771,body:`CHATGPT_MODELNAME_HANDOFF_DELIVERED\nrun_id=${context.runId}`});
