name: runner relay min
on:
  push:
    paths:
      - '.github/workflows/runner-relay-min.yml'
jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set -e
          msg='RUNNER_RECOVERY_Q0907_V4 owner authorized. On DESKTOP-6FN9B4M, restore the Pokitomas/theawesomehexapp self-hosted runner persistently. Run 34149915406 proved the Windows runner worked after the shell-path fix, then it vanished. Do not re-debug the old bash path bug. Inspect runner process/service/config and restore persistent liveness using only credentials already authorized locally; do not expose tokens; do not use Desktop Commander. Verify by getting queued self-hosted run 34159090021 to execute on DESKTOP-6FN9B4M and print Q0907_VERIFY_OK. Keep working through intermediate failures.'
          body=$(jq -cn --arg text "$msg" '{text:$text}')
          curl -fsS --max-time 45 -H 'content-type: application/json' --data-binary "$body" https://archie-chatgpt-relay.vercel.app/api/index
          echo RELAY_DELIVERY_OK
