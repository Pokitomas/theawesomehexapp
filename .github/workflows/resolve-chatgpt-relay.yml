name: Resolve direct ChatGPT relay

on:
  push:
    paths:
      - '.github/workflows/resolve-chatgpt-relay.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Deliver native phone-live bootstrap
        shell: python
        run: |
          import json,subprocess,time
          directive=r'''PHONE_LIVE_NATIVE_BOOTSTRAP_V2 — owner-authorized live-controller execution. ACT NOW from the resident Windows controller. Vercel is one-shot bootstrap transport only and MUST NOT remain in the resulting phone runtime path.

ENTER the default-ChatGPT 15-minute externally measured timebox now. It is awareness/pace only, never a completion/liveness/provider boundary.

Produce a REAL public HTTPS URL the owner can tap from an iPhone on ordinary cellular with Tailscale/VPN off. Build/refactor only the narrow native phone live-field surface needed around the already-running controller. Prefer the smallest reversible non-Vercel reverse ingress available on this Windows PC, e.g. Cloudflare Quick Tunnel; if absent, install/use a portable user-local equivalent. Do NOT restart the main controller or lose its memory-only absorbed context. Disposable phone/tunnel/helpers may restart.

UX: one sparse live field, not dashboard. Owner speech/text is accepted and marked HEARD immediately as a SIDEBAND ingress; it must NEVER cancel, supersede, pause, steal, or falsely complete the currently executing controller task merely because new speech arrived. The intelligence chooses when/what to answer. Stream action/effect/VERIFIED receipts continuously. Stream a bounded current-PC visual preview/diff sufficient to see what the controller acts on. Playback/reply may duck for new speech without cancelling controller work. Preserve plaintext_persisted=false; save no raw mic media.

PUBLIC ALLOWLIST ONLY: phone input + seat/event/visual read + health/session. Explicitly refuse/not-route 8789 shell, filesystem, secrets, workspace_patch, generic /action, controller admin, arbitrary command execution. Controller mutation stays local and occupant-authorized.

TEST BEFORE READY: (1) public URL 200 through non-tail/non-Vercel path; (2) hostname/runtime path contains no .ts.net or .vercel.app hop; (3) shell/workspace_patch/generic action/admin probes refused/not routed; (4) start/observe unresolved controller work then inject phone input and prove same work remains live while HEARD updates; (5) events/effect/VERIFIED stream works; (6) bounded PC visual preview works and changes with action; (7) helper/tunnel survives normal request and health remains live. Only change implementation when the next test is already defined. Do not close Roblox/windows until this phone milestone is proven.

When ALL pass, publish exactly one issue-771 comment line using local authenticated gh/git if available:
PHONE_LIVE_READY url=<public_https_url> transport=<non-vercel transport> test=<short receipt/digest>
If publication is unavailable, emit that exact line into controller/relay output and keep the public surface running. Continue controller work after publication; this is not overall completion.'''
          url='https://archie-chatgpt-relay.vercel.app/api/index'
          p=subprocess.run(['curl','-sS','--max-time','45','-X','POST','-H','content-type: application/json','-H','accept: application/json','--data-binary',json.dumps({'text':directive}),'-w','\n__HTTP__%{http_code}',url],text=True,capture_output=True,timeout=52)
          lines=['PHONE_LIVE_BOOTSTRAP_V2','rc='+str(p.returncode),'delivery='+(p.stdout+p.stderr)[:10000]]
          time.sleep(3)
          open('/tmp/resolve-direct-relay.txt','w',encoding='utf-8').write('\n'.join(lines)+'\n')
          if p.returncode != 0: raise SystemExit(p.returncode)
      - name: Publish delivery receipt
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs=require('fs');let text='NO_RECEIPT';try{text=fs.readFileSync('/tmp/resolve-direct-relay.txt','utf8')}catch(e){text+=' '+e}
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:771,body:`PHONE_LIVE_BOOTSTRAP_DELIVERY\nrun_id=${context.runId}\n\n\`\`\`text\n${text.replace(/```/g,'``\\`')}\n\`\`\``});
