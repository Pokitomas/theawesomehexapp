name: Resolve direct ChatGPT relay

on:
  push:
    paths:
      - '.github/workflows/resolve-chatgpt-relay.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Deliver exact live Resolve objective
        shell: python
        run: |
          import json,os,subprocess,time
          directive=r'''RESOLVE_STORY_CUT_VISIBLE_TAKEOVER_V3 owner-authorized execution directive. ACT NOW on the live Windows desktop; do not summarize or design infrastructure. DaVinci Resolve is the target. Project: lonee ryan - ARCHIE LOVING EDIT. HARD LOCK: never mutate ARCHIE CUT or ARCHIE // PERFECT SYNC. Current good working timeline is already present and visible as ARCHIE STORY CUT LIVE (2), prior proof 21/17 clip structure. Do not rebuild it, import another XML, or retreat to FRONTIER CUT.

Every EDITING MUTATION must be visibly performed through Resolve mouse/keyboard/UI. Hidden read-only sensing is fine. FIRST: use Resolve's visible subtitle import UI to import C:\Users\AwesomeKai\Downloads\ARCHIE_LOVING_EDIT_WORK\ARCHIE_STORY_CUT_LIVE.srt and get its prepared 172 captions onto the CURRENT STORY CUT LIVE (2) timeline by timecode. If captions are already present, prove them rather than duplicate. Visibly prove subtitle text in the viewer/timeline.

THEN play/watch the opening and multiple joins and immediately fix taste: dead seconds, repeated setup, technical faff, weak pauses, ugly joins. Preserve funny/awkward/revealing/emotional beats. iPhone/main is home base; Samsung/second only for reactions, emphasis, awkward silence, visual reset, or clearly better comedy/clarity. Preserve sync and save checkpoints.

AUDIO: crispy close natural dialogue; materially reduce Swingers crowd/background; keep human room tone; no metallic/watery denoise, no smashed compressor, no level jumps at joins. Structure first, polish after.

Use existing resident full-computer/Hotwire/controller abilities. DROP any slow helper. If Claude Cowork is useful, actively supervise it; updated visible-only bootstrap is https://raw.githubusercontent.com/Pokitomas/theawesomehexapp/main/tools/finish_video_now.py . Do not stop at explanation or first GUI failure. Make the smallest reversible visible Resolve move, verify work-surface delta/playback, save, and continue. Emit concrete receipts/state into the resident field.'''
          url='https://archie-chatgpt-relay.vercel.app/api/index'
          p=subprocess.run(['curl','-sS','--max-time','30','-X','POST','-H','content-type: application/json','-H','accept: application/json','--data-binary',json.dumps({'text':directive}),'-w','\n__HTTP__%{http_code}',url],text=True,capture_output=True,timeout=38)
          lines=['RESOLVE_DIRECT_RELAY_V3','rc='+str(p.returncode),'delivery='+(p.stdout+p.stderr)[:8000]]
          time.sleep(4)
          open('/tmp/resolve-direct-relay.txt','w',encoding='utf-8').write('\n'.join(lines)+'\n')
      - name: Publish delivery receipt
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs=require('fs');let text='NO_RECEIPT';try{text=fs.readFileSync('/tmp/resolve-direct-relay.txt','utf8')}catch(e){text+=' '+e}
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:771,body:`RESOLVE_DIRECT_RELAY_RECEIPT\nrun_id=${context.runId}\n\n\`\`\`text\n${text.replace(/```/g,'``\\`')}\n\`\`\``});
