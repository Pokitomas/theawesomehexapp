name: Q0907 surface boot fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/q0907-surface-boot-fix.yml'

jobs:
  fix:
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - name: Fix Path-before-import and prove one stable native surface
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $root='C:\Users\AwesomeKai\mach'
          $parent='C:\Users\AwesomeKai'
          $py314='C:\Python314\python.exe'
          $py312w='C:\Users\AwesomeKai\AppData\Local\Programs\Python\Python312\pythonw.exe'
          $env:PYTHONPATH=$parent
          $env:RUNNER_TRACKING_ID=''
          Set-Location $root

          Write-Host '=== PATCH RUN.PY IMPORT ORDER ==='
          @'
          from pathlib import Path
          root=Path(r'C:\Users\AwesomeKai\mach')
          for p in (root/'shell'/'run.py', root/'mach'/'shell'/'run.py'):
              if not p.is_file():
                  print('ABSENT',p); continue
              s=p.read_text(encoding='utf-8')
              lines=s.splitlines()
              use=next((i for i,x in enumerate(lines) if 'Path(__file__)' in x),-1)
              imp=next((i for i,x in enumerate(lines) if x.strip()=='from pathlib import Path'),-1)
              if use<0 or imp<0:
                  raise SystemExit('Path boot shape changed: '+str(p))
              if imp<use:
                  print('ALREADY_FIXED',p); continue
              line=lines.pop(imp)
              use=next(i for i,x in enumerate(lines) if 'Path(__file__)' in x)
              lines.insert(use,line)
              p.write_text('\n'.join(lines)+'\n',encoding='utf-8')
              print('PATCHED',p,'old_import_line',imp+1,'new_import_line',use+1)
          '@ | & $py314 -
          if($LASTEXITCODE-ne0){throw 'surface source patch failed'}

          Write-Host '=== SYNTAX / IMPORT PROBE ==='
          & $py314 -m py_compile (Join-Path $root 'shell\run.py')
          if($LASTEXITCODE-ne0){throw 'live run.py compile failed'}
          & $py314 -m py_compile (Join-Path $root 'mach\shell\run.py')
          if($LASTEXITCODE-ne0){throw 'staged run.py compile failed'}

          Write-Host '=== RESET ONLY THE SURFACE SUPERVISION STATE ==='
          $all=@(Get-CimInstance Win32_Process)
          foreach($p in @($all|Where-Object{$_.CommandLine -match 'mach\.core\.keeper'})){Stop-Process -Id $p.ProcessId -Force -ErrorAction SilentlyContinue}
          foreach($p in @($all|Where-Object{$_.CommandLine -match '[\\/]shell[\\/]run\.py'})){Stop-Process -Id $p.ProcessId -Force -ErrorAction SilentlyContinue}
          Start-Sleep -Seconds 1
          Start-Process -FilePath $py312w -ArgumentList @('-m','mach.core.keeper') -WorkingDirectory $parent -WindowStyle Hidden

          Write-Host '=== SURFACE HOLD TEST ==='
          Start-Sleep -Seconds 8
          $s1=@(Get-CimInstance Win32_Process | Where-Object {$_.CommandLine -match '[\\/]shell[\\/]run\.py'})
          if($s1.Count-ne1){
            if(Test-Path (Join-Path $root 'state\warden.log')){Get-Content (Join-Path $root 'state\warden.log') -Tail 70}
            throw "surface count after 8s = $($s1.Count)"
          }
          $pid1=$s1[0].ProcessId
          Write-Host "SURFACE_PID_8S=$pid1 CMD=$($s1[0].CommandLine)"
          Start-Sleep -Seconds 18
          $s2=@(Get-CimInstance Win32_Process | Where-Object {$_.CommandLine -match '[\\/]shell[\\/]run\.py'})
          if($s2.Count-ne1){throw "surface count after 26s = $($s2.Count)"}
          $pid2=$s2[0].ProcessId
          Write-Host "SURFACE_PID_26S=$pid2"
          if($pid1-ne$pid2){throw "surface restarted during hold test: $pid1 -> $pid2"}

          $r=@(Get-CimInstance Win32_Process | Where-Object {$_.CommandLine -match 'mach\.core\.antigravity_seat'})
          Write-Host "RESIDENT_COUNT=$($r.Count)"
          if($r.Count-ne1){throw 'resident regressed while fixing surface'}

          @'
          import os,sys
          os.chdir(r'C:\Users\AwesomeKai');sys.path.insert(0,r'C:\Users\AwesomeKai')
          import mach.core.computer as M
          c=M.connect(start=False,timeout=5); cat=c.do('catalog')
          print('CATALOG_OK='+str(cat.get('ok'))+' N='+str(len(cat.get('transitions',[]))))
          assert cat.get('ok') and len(cat.get('transitions',[]))>=13
          '@ | & $py314 -
          if($LASTEXITCODE-ne0){throw 'machine probe failed'}

          Write-Host '=== WARDEN TAIL ==='
          if(Test-Path (Join-Path $root 'state\warden.log')){Get-Content (Join-Path $root 'state\warden.log') -Tail 30}
          Write-Host 'SURFACE_BOOT_FIX_OK=1'
