name: ARCHIE local v3 initiative audit

on:
  push:
    paths:
      - '.github/workflows/archie-local-research-handoff.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: archie-local-v3-initiative-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: [self-hosted, sideways-maker]
    timeout-minutes: 10
    steps:
      - name: Audit live resident and install boundary
        shell: bash
        run: |
          set -euo pipefail
          H=/home/awesomekai
          R="$H/archie-remote"
          OUT="$RUNNER_TEMP/archie-v3-initiative-audit.txt"
          {
            echo ARCHIE_V3_INITIATIVE_AUDIT_V1
            echo "time=$(date -Iseconds)"
            echo "host=$(hostname)"
            echo "runner=${RUNNER_NAME:-unknown}"
            echo
            echo '=== ROOM TAIL ==='
            tail -n 60 "$R/roast.jsonl" 2>/dev/null || true
            echo
            echo '=== LIVE SUPERVISOR ==='
            systemctl --user show archie-local-semantic-supervisor.service -p ActiveState -p SubState -p MainPID -p NRestarts -p Result -p ExecStart --no-pager 2>/dev/null || true
            systemctl --user cat archie-local-semantic-supervisor.service 2>/dev/null || true
            echo
            echo '=== LIVE BROKER TARGET ==='
            ls -l "$R/local_semantic_broker.py" 2>/dev/null || true
            readlink -f "$R/local_semantic_broker.py" 2>/dev/null || true
            sha256sum "$R/local_semantic_broker.py" 2>/dev/null || true
            head -n 24 "$R/local_semantic_broker.py" 2>/dev/null || true
            echo
            echo '=== SEMANTIC PROCESSES ==='
            pgrep -af 'archie-local-semantic|local_semantic_broker|llama-server|llama.*server' || true
            echo
            echo '=== SEMANTIC STATE/RECEIPTS ==='
            cat "$R/presence/local_semantic_supervisor.json" 2>/dev/null || true
            for f in "$R"/presence/*semantic*jsonl; do [ -f "$f" ] || continue; echo "--- $f"; tail -n 12 "$f"; done
            echo
            echo '=== DIRTY TREES READ ONLY ==='
            for d in "$H/archie-gpt56sol-presence" "$H/theawesomehexapp-pr730"; do
              echo "--- $d"
              git -C "$d" status --short --branch 2>/dev/null || echo not-a-worktree
              git -C "$d" log -1 --oneline 2>/dev/null || true
            done
            echo
            echo '=== TRAINER READ ONLY ==='
            systemctl --user show archie-gpt56-packed-stream-v1.service -p ActiveState -p SubState -p MainPID -p NRestarts -p Result --no-pager 2>/dev/null || true
            systemctl --user show archie-gpt56-packed-stream-resident-v1.service -p ActiveState -p SubState -p MainPID -p NRestarts -p Result --no-pager 2>/dev/null || true
            if [ -e "$H/maximal/scratch/packed-stream-v1/HALT.json" ]; then echo HALT_PRESENT; cat "$H/maximal/scratch/packed-stream-v1/HALT.json"; else echo HALT_NONE; fi
            echo
            echo '=== SIDE-CAR ==='
            systemctl --user show archie-shell-sidecar.service -p ActiveState -p SubState -p MainPID -p NRestarts --no-pager 2>/dev/null || true
          } | tee "$OUT"
          if [ -f "$R/room.py" ]; then
            cd "$R"
            python3 room.py say gpt56sol "@chatgpt LOCAL_V3_AUDIT_DONE: outbound self-hosted runner reached workstation; audit artifact is archie-v3-initiative-audit-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}. No GPU/service mutation performed."
          fi
      - name: Upload audit receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: archie-v3-initiative-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/archie-v3-initiative-audit.txt
          if-no-files-found: error
          retention-days: 7
