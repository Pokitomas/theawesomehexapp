name: ARCHIE local research handoff

on:
  push:
    paths:
      - '.github/workflows/archie-local-research-handoff.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: finish-current-video-sideways-maker
  cancel-in-progress: true

jobs:
  handoff:
    runs-on: [self-hosted, sideways-maker]
    timeout-minutes: 10
    steps:
      - name: Finish current DaVinci video with active Claude supervision
        shell: bash
        run: |
          set +e
          OUT="$RUNNER_TEMP/finish-video-receipt.txt"
          PYWIN='/mnt/c/Users/AwesomeKai/AppData/Local/Programs/Python/Python312/python.exe'
          SCRIPT_WSL='/mnt/c/Users/AwesomeKai/AppData/Local/Temp/finish_video_now.py'
          {
            echo FINISH_VIDEO_SIDEWAYS_MAKER_BEGIN
            date -Is
            echo "host=$(hostname) runner=${RUNNER_NAME:-unknown} user=$(id -un)"
            echo '=== live windows ==='
            powershell.exe -NoProfile -Command '$ErrorActionPreference="SilentlyContinue"; Get-Process Resolve,Claude | Select ProcessName,Id,SessionId,MainWindowTitle | Format-List' 2>&1 | tr -d '\r'
            echo '=== sidecar ==='
            systemctl --user show archie-shell-sidecar.service -p ActiveState -p SubState -p MainPID -p NRestarts --no-pager 2>&1
            echo '=== download finisher ==='
            curl -fsSL --retry 2 'https://raw.githubusercontent.com/Pokitomas/theawesomehexapp/main/tools/finish_video_now.py' -o "$SCRIPT_WSL"
            wc -c "$SCRIPT_WSL"
            echo '=== execute finisher ==='
            timeout 430s "$PYWIN" 'C:\Users\AwesomeKai\AppData\Local\Temp\finish_video_now.py' 2>&1 | tr -d '\r'
            echo "FINISHER_RC=${PIPESTATUS[0]}"
            echo '=== final windows ==='
            powershell.exe -NoProfile -Command '$ErrorActionPreference="SilentlyContinue"; Get-Process Resolve,Claude | Select ProcessName,Id,SessionId,MainWindowTitle | Format-List' 2>&1 | tr -d '\r'
            echo FINISH_VIDEO_SIDEWAYS_MAKER_END
            date -Is
          } | tee "$OUT"
          exit 0

      - name: Publish live finish receipt
        if: always()
        uses: actions/github-script@v7
        env:
          OUT_PATH: ${{ runner.temp }}/finish-video-receipt.txt
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs=require('fs');
            let text='RECEIPT_MISSING'; try{text=fs.readFileSync(process.env.OUT_PATH,'utf8')}catch(e){text+=` ${e}`}
            if(text.length>60000) text=text.slice(-60000);
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:771,body:`FINISH_VIDEO_SIDEWAYS_MAKER_RECEIPT\nrun_id=${context.runId}\nsha=${context.sha}\n\n\`\`\`text\n${text.replace(/```/g,'``\\`')}\n\`\`\``});
