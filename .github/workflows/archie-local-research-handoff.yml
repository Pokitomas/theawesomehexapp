name: ARCHIE resident replacement court

on:
  push:
    paths:
      - '.github/workflows/archie-local-research-handoff.yml'

permissions:
  contents: read

concurrency:
  group: archie-resident-replacement
  cancel-in-progress: false

jobs:
  audit:
    runs-on: [self-hosted, sideways-maker]
    timeout-minutes: 10
    steps:
      - name: Read-only live model audit
        shell: bash
        run: |
          set -euo pipefail
          HOME_DIR=/home/awesomekai
          OUT="$RUNNER_TEMP/archie-model-replacement-audit.txt"
          CAND="$HOME_DIR/maximal/scratch/packed-stream-resident-v1/checkpoint.pt"
          {
            echo 'ARCHIE_MODEL_REPLACEMENT_AUDIT_V1'
            echo "time=$(date -Iseconds)"
            echo "host=$(hostname)"
            echo "runner=${RUNNER_NAME:-unknown}"
            echo
            echo '=== CANDIDATE ==='
            if [ -f "$CAND" ]; then sha256sum "$CAND"; stat -c '%y %s %n' "$CAND"; else echo MISSING; fi
            echo
            echo '=== GPU ==='
            nvidia-smi --query-gpu=name,temperature.gpu,utilization.gpu,memory.used,memory.total,power.draw --format=csv,noheader,nounits 2>&1 || true
            echo '--- dxg owners ---'
            fuser -v /dev/dxg 2>&1 || true
            echo
            echo '=== RUNNING RELEVANT UNITS ==='
            systemctl --user list-units --type=service --state=running --no-legend --no-pager | grep -Ei 'archie|llama|semantic|model|chat|inference|packed|presence' || true
            echo
            echo '=== RELEVANT UNIT FILES ==='
            systemctl --user list-unit-files --type=service --no-legend --no-pager | grep -Ei 'archie|llama|semantic|model|chat|inference|packed|presence' || true
            echo
            echo '=== RELEVANT PROCESSES ==='
            pgrep -af 'llama|semantic|model|chat|inference|packed|resident|presence' | head -n 160 || true
            echo
            echo '=== LISTENERS ==='
            ss -ltnp 2>&1 | head -n 200 || true
            echo
            echo '=== CANDIDATE UNIT STATES ==='
            for u in archie-gpt56-packed-stream-resident-v1.service archie-gpt56-packed-stream-v1.service; do
              echo "--- $u ---"
              systemctl --user show "$u" -p LoadState -p ActiveState -p SubState -p MainPID -p Result -p ExecMainStatus --no-pager 2>&1 || true
            done
            echo
            echo '=== MODEL POINTER ==='
            for p in \
              '/mnt/c/Users/AwesomeKai/Documents/ARCHIE-CANON/CURRENT-MODEL.json' \
              "$HOME_DIR/ARCHIE-CANON/CURRENT-MODEL.json" \
              "$HOME_DIR/archie-remote/resident/context.md"; do
              echo "--- $p ---"; if [ -f "$p" ]; then sed -n '1,160p' "$p"; else echo MISSING; fi
            done
            echo
            echo '=== SERVICE DEFINITIONS REFERENCING LLAMA/SEMANTIC/RESIDENT ==='
            grep -RInE 'llama|semantic|packed-stream-resident|CURRENT-MODEL|model.*(port|endpoint)|chat.*(port|endpoint)' "$HOME_DIR/.config/systemd/user" 2>/dev/null | head -n 240 || true
            echo
            echo '=== FOREGROUND ROUTE CANDIDATES ==='
            grep -RInE 'llama|semantic|foreground|resident|model_endpoint|model.*url|chat.*url' "$HOME_DIR/archie-remote/presence" "$HOME_DIR/archie-remote" 2>/dev/null | head -n 260 || true
          } | tee "$OUT"
      - name: Upload audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: archie-model-replacement-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/archie-model-replacement-audit.txt
          if-no-files-found: error
          retention-days: 3
