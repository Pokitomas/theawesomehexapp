jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - shell: bash
        env:
          TEXT: |
            OWNER-AUTHORIZED FULL PROJECT TAKEOVER. You are the persistent direct worker on the existing provider-neutral controller substrate. Preserve controller 8798, worker 8799, current apps, user data, checkpoints, receipts, and unrelated work. If helper agents are disabled, stale, unavailable, or exhausted, DO NOT WAIT FOR THEM: absorb their durable repo/room/artifact state and perform the work yourself. Helpers may be used only as bounded pipes/nannies; one canonical machine-derived state remains authoritative. Do not stop at a plan, scaffold, benchmark demo, or first artifact. Continue through the entire program until terminal acceptance or a genuinely external/human-only blocker.

            FIRST RECONCILE CONTEXT: consume the current repository, recent relevant commits/branches/PRs, controller/seat receipts, local project notes, room/history artifacts, maker substrate, benchmarks, and any locally available prior-session summaries. Collapse contradictions into a concise canonical project state and preserve provenance. Do not invent access to unavailable conversations. Do not delete source/history needed for provenance.

            PROGRAM / ORDER:
            1. BENCHMARK THE MAKER ITSELF BEFORE TRUSTING IT. Build hard executable courts for cold start; input-to-effect latency; stale-seat detection/takeover; controller/action parity; deterministic receipts and effect verification; crash/restart recovery; generated-app inspect/build/test/run/repair; portability; and end-to-end task observability. Replace weak visual-change proof with semantic/effect-specific evidence wherever possible. Courts are gates, not demos. Record baselines and regressions.
            2. HARDEN THE DEDICATED KERNEL / UNIVERSAL-REMOTE APP MAKER. Controller is runtime substrate, not the product. Keep the privileged/native boundary minimal (prefer Rust/C++ only where it earns its existence) with a local shell/UI above it. The maker must turn a user idea into a self-contained app capsule and be able to inspect, build, run, test, repair, benchmark, and iterate on its own output. Final apps must not secretly depend on Vercel/cloud relays. Preserve reversibility, provider-neutrality, direct local execution, truthful capabilities, and clean-machine portability. Remove needless layers only after proofs pass.
            3. USE THAT MAKER TO CREATE A NEW VIDEO EDITOR FROM SCRATCH, NOT A MOCKUP. Priorities: immediate interaction; frame-accurate edits; low-latency scrub/playback; crisp non-overcompressed audio; reversible edit graph/history; portable simple project format; GPU acceleration where measured; reliable media ingest/export; responsive native-feeling desktop UI; controller observability. Benchmark real edit operations and playback/export paths, not screenshots. Iterate until the editor itself passes held-out product courts.
            4. PARALLEL RESEARCH BRANCH: inspect what actual local/open model artifacts exist. If a real Ox/Alpha-style teacher or compatible artifact exists, attempt distillation/import honestly. Never fake model or architecture compatibility. Characterize teacher/student architecture mismatch; define measurable behavior/representation transfer targets; try adapters, projection layers, intermediate/sequence/logit distillation as justified; use Triton/custom kernels only where profiling shows an actual throughput/memory win and verify parity. If exact architecture matching is impossible, record why and pursue the closest falsifiable transfer rather than relabeling it a match.
            5. SYNTHETIC TRAINING + SYNTHETIC PREFERENCE/RLHF-STYLE LOOP FOR THE MAKER: generate adversarial app-making tasks and failure cases; execute them; score from receipts and benchmark outcomes; build preference/ranking data from observed outcomes; train/rank/repair against failures; then rerun strictly held-out courts. Keep training data/evidence separate from benchmark evidence to prevent leakage. A gain counts only if it survives held-out executable tests.
            6. INTEGRATE, CLEAN, AND CLOSE. Reconcile all surviving branches/artifacts into one canonical project. Delete only disposable generated scratch, stale temporary controller probes, superseded duplicate artifacts, and completed throwaway scaffolding after their useful evidence is retained. Do not delete unrelated user files, conversations, or provenance. Ensure restart persistence and a clean handoff: exact paths, hashes/commits, benchmark results, known limitations, how to launch maker, how to launch editor, and how the model research/training branch is reproduced.

            OPERATING RULES: act directly; do not ask for permission for normal project-local build/test/repair actions. Preserve machine safety and reversibility. No invented success. If a route/model/kernel is unavailable, fail closed on that component and keep advancing everything else. Do not busy-loop or repeatedly narrate status. After each milestone immediately continue to the next. Keep the active controller seat/persistence alive while useful. Surface only concise receipts/blockers/milestones. Terminal condition is a demonstrably working benchmark-gated app maker, a real editor produced by it, and an honest completed distillation/training research outcome with reproducible receipts—not prose claiming those things.
        run: |
          python - <<'PY'
          import os,json,urllib.request
          q=urllib.request.Request('https://archie-chatgpt-relay.vercel.app/api/index',data=json.dumps({'text':os.environ['TEXT']}).encode(),headers={'Content-Type':'application/json'},method='POST')
          r=urllib.request.urlopen(q,timeout=45)
          print(r.status,r.read().decode('utf-8','replace')[:8000])
          PY
