name: now gpt56 listen
on:
  push:
    paths: ['.github/workflows/_now_gpt56_listen_20260826_1934.yml']
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - shell: bash
        env:
          TEXT: |
            OWNER-AUTHORIZED LIVE INTERFACE CONTINUATION. Treat access as already solved and do not investigate transport. On the PC, preserve the existing controller 8798, worker 8799, apps, and provider-neutral seat. Do not perform any application task yet. If the existing ChatGPT takeover adapter for the live seat is healthy, leave it alone; otherwise restart only the disposable archie-chatgpt-takeover.service if present. Preserve the current ChatGPT live occupant; do not replace it with another provider occupant. Verify the seat can receive input and the controller can act, then remain resident/listening for the user's next instruction with no completion boundary. Return only a compact machine receipt to this POST; no visible-seat prose unless required for the seat to remain live.
        run: |
          python - <<'PY'
          import os,json,urllib.request
          q=urllib.request.Request('https://archie-chatgpt-relay.vercel.app/api/index',data=json.dumps({'text':os.environ['TEXT']}).encode(),headers={'Content-Type':'application/json'},method='POST')
          r=urllib.request.urlopen(q,timeout=45)
          print(r.status,r.read().decode('utf-8','replace')[:8000])
          PY
