name: Hosted tailnet sidecar recovery
on:
  push:
    paths: ['.github/workflows/hosted-tailnet-sidecar.yml']
  workflow_dispatch:
permissions:
  contents: read
  issues: write
  id-token: write
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
      TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
      TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
      TAILSCALE_KEY: ${{ secrets.TAILSCALE_KEY }}
      TSKEY: ${{ secrets.TSKEY }}
    steps:
      - name: Probe tailnet and workstation
        shell: bash
        run: |
          set +e
          OUT="$RUNNER_TEMP/tailnet-recovery.txt"
          exec > >(tee "$OUT") 2>&1
          echo HOSTED_TAILNET_RECOVERY_V1
          auth=''
          for n in TS_AUTHKEY TAILSCALE_AUTHKEY TAILSCALE_AUTH_KEY TAILSCALE_KEY TSKEY; do
            v="${!n:-}"; if [ -n "$v" ]; then echo "authkey_secret_present=$n"; auth="$v"; break; fi
          done
          [ -n "$auth" ] || { echo authkey_secret_present=none; exit 0; }
          curl -fsSL https://tailscale.com/install.sh | sh >/dev/null 2>&1 || { echo tailscale_install=failed; exit 0; }
          sudo tailscale up --auth-key="$auth" --hostname="gpt56-hosted-$GITHUB_RUN_ID" --accept-routes=false --timeout=30s >/dev/null 2>&1
          echo "tailscale_up_rc=$?"
          tailscale status || true
          for host in kai desktop-6fn9b4m desktop-6fn9b4m-1; do
            if tailscale ping --timeout=3s "$host" >/dev/null 2>&1; then
              echo "ping=$host:ok"
              timeout 20s tailscale ssh "awesomekai@$host" 'printf "TS_SSH_OK\n"; hostname; id -un; systemctl --user is-active archie-shell-sidecar.service 2>/dev/null || true; command -v agy || true; agy --version 2>/dev/null || true' || echo "ssh=$host:failed"
            else echo "ping=$host:failed"; fi
          done
      - name: Publish receipt
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs=require('fs'); const p=process.env.RUNNER_TEMP+'/tailnet-recovery.txt';
            let text='NO_RECEIPT'; try{text=fs.readFileSync(p,'utf8')}catch(e){text+=` ${e}`}
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:771,body:`HOSTED_TAILNET_RECOVERY_RECEIPT\n\n\`\`\`text\n${text.slice(0,30000).replace(/```/g,'``\\`')}\n\`\`\``});