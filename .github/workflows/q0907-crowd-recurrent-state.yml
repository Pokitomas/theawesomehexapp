name: Q0907 crowd recurrent state

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/q0907-crowd-recurrent-state.yml'

jobs:
  mutate:
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - name: Address the live resident by its own capability identities and mutate the recurrent tree
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $root='C:\Users\AwesomeKai\mach'
          Set-Location -LiteralPath $root
          $python=(Get-Command python.exe -ErrorAction Stop).Source
          $node=(Get-Command node.exe -ErrorAction Stop).Source
          $env:PYTHONPATH=$root

          @'
          import hashlib,json,pathlib,sys
          sys.path.insert(0,r'C:\Users\AwesomeKai\mach')
          import mach.core.computer as M
          from mach.core.computer import connect
          from mach.core import home
          c=connect(start=False,timeout=5)
          cat=c.do('catalog')
          if cat.get('ok') is False: raise SystemExit('catalog unavailable '+repr(cat))
          server={row['edge']:row['cap'] for row in cat['transitions']}
          client={k:v.hex() for k,v in M._CAPS.items()}
          print('CLIENT_HOME='+str(home.ROOT))
          for k in ('catalog','file','splice','tree','query','stop','launch'):
              print('CAP',k,'client='+client.get(k,''),'resident='+server.get(k,''),'same='+str(client.get(k)==server.get(k)))

          # Ask the resident which source tree its own file capability actually sees.
          sf=c.invoke(server['file'],path='core/computer.py',at=0,limit=12000)
          print('RESIDENT_FILE='+json.dumps({k:sf.get(k) for k in ('ok','path','etag','bytes','at','more','note')},default=str))
          if sf.get('ok') is False: raise SystemExit('resident file cap failed '+repr(sf))
          local=pathlib.Path(r'C:\Users\AwesomeKai\mach\mach\core\computer.py')
          raw=local.read_bytes(); letag=hashlib.blake2b(raw,digest_size=16).hexdigest()
          print('LOCAL_FILE path='+str(local)+' etag='+letag+' bytes='+str(len(raw)))
          print('RESIDENT_TREE_IS_LOCAL_TREE='+str(pathlib.Path(sf['path']).resolve()==local.resolve() and sf['etag']==letag))

          # Mutate keeper using the resident's capability IDs, not a possibly stale client label->id map.
          kpath='core/keeper.py'
          kq=c.invoke(server['query'],path=kpath,find='p = subprocess.Popen(o.argv',limit=8)
          print('KEEPER_QUERY='+json.dumps(kq,default=str)[:8000])
          rows=kq.get('hits') or []
          if len(rows)!=1: raise SystemExit('keeper spawn site not unique '+repr(kq))
          ko=c.invoke(server['file'],path=kpath,at=max(0,int(rows[0]['at'])-600),limit=2600)
          text=ko['text']
          old='p = subprocess.Popen(o.argv, creationflags=flags,   # no window, own group'
          new='p = subprocess.Popen(o.argv, cwd=os.path.dirname(ROOT), creationflags=flags,   # no window, own group'
          if new not in text:
              if old not in text: raise SystemExit('keeper start source moved')
              i=text.index(old); base=int(ko['at']); pos=base+len(text[:i].encode())
              ks=c.invoke(server['splice'],path=kpath,expect=ko['etag'],splices=[[pos,pos+len(old.encode()),new]])
              print('KEEPER_SPLICE='+json.dumps(ks,default=str))
              if not ks.get('committed'): raise SystemExit('keeper splice failed')
          print('KEEPER_CWD_BOUND=1')

          # The crowd itself becomes a named graph claim, while keeping the exact k=8 renderer payload.
          path='web/shore.html'
          q=c.invoke(server['query'],path=path,find='(rule oasis/parts',limit=8)
          print('OASIS_QUERY='+json.dumps(q,default=str)[:8000])
          rows=q.get('hits') or []
          if len(rows)!=1: raise SystemExit('oasis/parts not unique '+repr(q))
          obs=c.invoke(server['file'],path=path,at=max(0,int(rows[0]['at'])-1400),limit=11000)
          text=obs['text']
          if '(rule oasis/crowd' not in text:
              marker='(rule oasis/parts '
              old='''  (map "k" 8 "x" 0 "y" 0 "z" 0 "hx" oasis/cell "hy" 0.44 "hz" oasis/seed "r" 2.6\n       "g" 0 "s" 0.05 "df" shore/clock "ry" oasis/runa "rx" oasis/run\n       "cr" 0.235 "cg" 0.170 "cb" 0.128 "ro" 0.88 "ss" 0.14)'''
              crowd='''(rule oasis/crowd\n  ; this several-million-body primitive is part of the graph it moves through.\n  (map "k" 8 "x" 0 "y" 0 "z" 0 "hx" oasis/cell "hy" 0.44 "hz" oasis/seed "r" 2.6\n       "g" 0 "s" 0.05 "df" shore/clock "ry" oasis/runa "rx" oasis/run\n       "cr" 0.235 "cg" 0.170 "cb" 0.128 "ro" 0.88 "ss" 0.14))\n'''
              if marker not in text or old not in text: raise SystemExit('crowd target moved')
              a=text.index(marker); b=text.index(old); base=int(obs['at'])
              def pos(i):return base+len(text[:i].encode())
              cs=c.invoke(server['splice'],path=path,expect=obs['etag'],splices=[
                  [pos(a),pos(a),crowd],
                  [pos(b),pos(b)+len(old.encode()),'  oasis/crowd']])
              print('CROWD_SPLICE='+json.dumps(cs,default=str))
              if not cs.get('committed'): raise SystemExit('crowd splice failed')
          cq=c.invoke(server['query'],path=path,find='oasis/crowd',limit=20)
          print('CROWD_QUERY='+json.dumps(cq,default=str)[:12000])
          if len(cq.get('hits') or [])<2: raise SystemExit('crowd not definition+consumer')
          print('CROWD_NAMED_IN_RESIDENT_TREE=1')
          '@ | & $python -
          if($LASTEXITCODE-ne0){throw 'resident-cap mutation failed'}

          Write-Host '=== VERIFY THE MUTATED LIVE PROGRAM ==='
          @'
          import pathlib,re
          p=pathlib.Path(r'C:\Users\AwesomeKai\mach\mach\web\shore.html')
          s=p.read_text(encoding='utf-8')
          if s.count('oasis/crowd')<2:raise SystemExit('crowd absent on disk')
          blocks=re.findall(r'<script[^>]*type=["\']text/mach["\'][^>]*>(.*?)</script>',s,flags=re.S|re.I)
          d=pathlib.Path(r'C:\Users\AwesomeKai\mach\.live_shore_check');d.mkdir(exist_ok=True)
          for x in d.glob('*.mach'):x.unlink()
          for i,b in enumerate(blocks):(d/f'{i:02d}.mach').write_text(b,encoding='utf-8')
          print('BLOCKS='+str(len(blocks)))
          '@ | & $python -
          if($LASTEXITCODE-ne0){throw 'extract failed'}
          $blocks=Get-ChildItem (Join-Path $root '.live_shore_check') -Filter '*.mach'|Sort-Object Name|ForEach-Object{$_.FullName}
          & $node (Join-Path $root 'mach\web\check.js') @blocks --frames 8 --states --watch oasis/crowd
          if($LASTEXITCODE-ne0){throw 'crowd state check failed'}
          Write-Host 'CROWD_13_STATES_GREEN=1'
