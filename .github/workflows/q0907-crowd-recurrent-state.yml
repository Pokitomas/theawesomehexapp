name: Q0907 crowd recurrent state

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/q0907-crowd-recurrent-state.yml'

jobs:
  mutate:
    runs-on: self-hosted
    timeout-minutes: 35
    steps:
      - name: Mutate crowd through Mach and isolate every remaining live court
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'C:\Users\AwesomeKai\mach'
          Set-Location -LiteralPath $root
          $python = (Get-Command python.exe -ErrorAction Stop).Source
          $node = (Get-Command node.exe -ErrorAction Stop).Source

          Write-Host '=== MACH ROOT / LIVE BRIDGE ==='
          @'
          import json, sys
          sys.path.insert(0, r'C:\Users\AwesomeKai\mach')
          from mach.core import home
          from mach.core.computer import connect
          print('MACH_HOME_ROOT=' + str(home.ROOT))
          c = connect(start=False, timeout=5)
          cat = c.do('catalog')
          print('BRIDGE_EDGES=' + ','.join(sorted(x['edge'] for x in cat.get('transitions', []))))
          for op,args in [('tree',dict(path='.',limit=4000)),('query',dict(path='web/shore.html',find='(rule oasis/parts',limit=8)),('file',dict(path='core/computer.py',at=0,limit=1200))]:
              out=c.do(op,**args)
              print(op.upper()+'='+json.dumps(out,default=str)[:12000])
          '@ | & $python -
          if ($LASTEXITCODE -ne 0) { throw 'live bridge/root probe failed' }

          Write-Host '=== CAS-SPLICE CROWD THROUGH THE LIVE COMPUTER PRIMITIVE ==='
          @'
          import json, sys
          sys.path.insert(0, r'C:\Users\AwesomeKai\mach')
          from mach.core.computer import connect
          c = connect(start=False, timeout=5)
          path = 'web/shore.html'
          q = c.do('query', path=path, find='(rule oasis/parts', limit=8)
          rows = q.get('hits') or []
          if len(rows) != 1:
              raise SystemExit('expected exactly one oasis/parts in live Mach root, got '+repr(q))
          at0 = max(0, int(rows[0]['at']) - 1200)
          obs = c.do('file', path=path, at=at0, limit=9000)
          if not obs.get('etag') or 'text' not in obs:
              raise SystemExit('live file observation failed: '+repr(obs))
          text = obs['text']
          if '(rule oasis/crowd' in text:
              print('CROWD_ALREADY_TRACKED=1')
          else:
              marker = '(rule oasis/parts '
              old = '''  (map "k" 8 "x" 0 "y" 0 "z" 0 "hx" oasis/cell "hy" 0.44 "hz" oasis/seed "r" 2.6\n       "g" 0 "s" 0.05 "df" shore/clock "ry" oasis/runa "rx" oasis/run\n       "cr" 0.235 "cg" 0.170 "cb" 0.128 "ro" 0.88 "ss" 0.14)'''
              if marker not in text or old not in text:
                  raise SystemExit('observed source no longer matches crowd insertion target')
              crowd = '''(rule oasis/crowd\n  ; several million bodies are one live claim, not an anonymous renderer literal.\n  ; its drivers are ordinary Mach state, so the crowd itself is now addressable in the\n  ; same graph that moves it, renders it, persists it, and attributes its consequences.\n  (map "k" 8 "x" 0 "y" 0 "z" 0 "hx" oasis/cell "hy" 0.44 "hz" oasis/seed "r" 2.6\n       "g" 0 "s" 0.05 "df" shore/clock "ry" oasis/runa "rx" oasis/run\n       "cr" 0.235 "cg" 0.170 "cb" 0.128 "ro" 0.88 "ss" 0.14))\n'''
              base = int(obs['at'])
              ins = text.index(marker)
              rep = text.index(old)
              def boff(i): return base + len(text[:i].encode('utf-8'))
              out = c.do('splice', path=path, expect=obs['etag'], splices=[
                  [boff(ins), boff(ins), crowd],
                  [boff(rep), boff(rep)+len(old.encode('utf-8')), '  oasis/crowd'],
              ])
              print('SPLICE='+json.dumps(out,default=str))
              if not out.get('committed'):
                  raise SystemExit('crowd splice did not commit')
          q2 = c.do('query', path=path, find='oasis/crowd', limit=20)
          print('CROWD_QUERY='+json.dumps(q2,default=str)[:12000])
          if len(q2.get('hits') or []) < 2:
              raise SystemExit('crowd is not both a named claim and a consumer in the live tree')
          print('CROWD_NAMED_IN_LIVE_TREE=1')
          '@ | & $python -
          if ($LASTEXITCODE -ne 0) { throw 'crowd live-tree mutation failed' }

          Write-Host '=== BUILD CURRENT NATIVE CORE ==='
          $cargo = Get-Command cargo.exe -ErrorAction SilentlyContinue
          if (-not $cargo) { $cargo = Get-Command cargo -ErrorAction SilentlyContinue }
          if (-not $cargo) { throw 'cargo missing' }
          & $cargo.Source build --manifest-path (Join-Path $root 'mach\native\resident_core\Cargo.toml') --release
          if ($LASTEXITCODE -ne 0) { throw 'native resident build failed' }
          Write-Host 'NATIVE_RESIDENT_CORE_BUILT=1'

          Write-Host '=== ACTUAL SHORE: CROWD + ALL THIRTEEN STATES + GLSL ==='
          @'
          import pathlib, re
          src=pathlib.Path(r'C:\Users\AwesomeKai\mach\mach\web\shore.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script[^>]*type=["\']text/mach["\'][^>]*>(.*?)</script>',src,flags=re.S|re.I)
          out=pathlib.Path(r'C:\Users\AwesomeKai\mach\.live_shore_check'); out.mkdir(exist_ok=True)
          for old in out.glob('*.mach'): old.unlink()
          for i,b in enumerate(blocks): (out/f'{i:02d}.mach').write_text(b,encoding='utf-8')
          print('LIVE_MACH_BLOCKS='+str(len(blocks)))
          if len(blocks)<2: raise SystemExit(2)
          '@ | & $python -
          if ($LASTEXITCODE -ne 0) { throw 'shore extraction failed' }
          $blocks = Get-ChildItem -LiteralPath (Join-Path $root '.live_shore_check') -Filter '*.mach' | Sort-Object Name | ForEach-Object { $_.FullName }
          & $node (Join-Path $root 'mach\web\check.js') @blocks --frames 8 --states --watch oasis/crowd
          if ($LASTEXITCODE -ne 0) { throw 'shore crowd/13-state check failed' }
          Write-Host 'LIVE_SHORE_13_STATES_AND_CROWD_OK=1'

          Write-Host '=== MACHINE CHECK FRESH, BEFORE OTHER COURTS ==='
          & $python (Join-Path $root 'mach\tests\machine_check.py')
          Write-Host "MACHINE_CHECK_FRESH_EXIT=$LASTEXITCODE"

          Write-Host '=== CAPABILITY COURT ==='
          & $python (Join-Path $root 'mach\tests\capabilities.py')
          Write-Host "CAPABILITIES_EXIT=$LASTEXITCODE"

          Write-Host '=== MACHINE CHECK AFTER CAPABILITY COURT ==='
          & $python (Join-Path $root 'mach\tests\machine_check.py')
          Write-Host "MACHINE_CHECK_AFTER_CAP_EXIT=$LASTEXITCODE"

          Write-Host '=== SURFACE SAVE COURT x2 ==='
          & $python (Join-Path $root 'mach\tests\surface_load.py')
          Write-Host "SURFACE_LOAD_1_EXIT=$LASTEXITCODE"
          & $python (Join-Path $root 'mach\tests\surface_load.py')
          Write-Host "SURFACE_LOAD_2_EXIT=$LASTEXITCODE"

          Write-Host '=== KEEPER FLAP COURT ==='
          & $python (Join-Path $root 'mach\tests\keeper_flap.py')
          Write-Host "KEEPER_FLAP_EXIT=$LASTEXITCODE"

          Write-Host '=== ROOT COURTS ==='
          $env:PYTHONPATH = $root
          if (-not (Test-Path -LiteralPath (Join-Path $root 'tests'))) { throw 'root tests directory absent' }
          & $python -m pytest -q (Join-Path $root 'tests')
          Write-Host "ROOT_COURTS_EXIT=$LASTEXITCODE"

          Write-Host 'ISOLATION_RUN_DONE=1'
