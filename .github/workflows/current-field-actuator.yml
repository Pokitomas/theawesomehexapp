name: Current field actuator

on:
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  actuate:
    if: >-
      github.event.issue.pull_request == null &&
      github.event.issue.number == 771 &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.body == '/finish-current-video-field'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Send current story-cut objective into resident machine field
        shell: python
        run: |
          import html, json, os, re, time, urllib.parse, urllib.request, urllib.error
          tramp='https://archie-link-trampoline.vercel.app/'
          page=urllib.request.urlopen(urllib.request.Request(tramp,headers={'user-agent':'archie-current-actuator'}),timeout=15).read().decode('utf-8','replace')
          m=re.search(r'href=["\']([^"\']+)["\']',page,re.I)
          if not m: raise SystemExit('no live trampoline target')
          live=html.unescape(m.group(1)); u=urllib.parse.urlsplit(live); q=urllib.parse.parse_qs(u.query)
          cap=(q.get('k') or [''])[0]
          if not cap: raise SystemExit('live target missing capability')
          base=f'{u.scheme}://{u.netloc}'; common_q=urllib.parse.urlencode({'k':cap})
          headers={'content-type':'application/json','accept':'application/json','user-agent':'gpt56-current-controller','x-archie-shell-token':cap}
          text=r'''RESOLVE_STORY_CUT_VISIBLE_TAKEOVER_V4. EXECUTE, do not summarize. Operate the live Windows DaVinci Resolve desktop now. Project is "lonee ryan - ARCHIE LOVING EDIT". HARD LOCK: NEVER mutate "ARCHIE CUT" or "ARCHIE // PERFECT SYNC". The good current timeline already exists as "ARCHIE STORY CUT LIVE (2)" with prior visible proof of the full 21/17 clip story assembly. Do not replace/rebuild/import another XML and do not use FRONTIER CUT.

VISIBLE-ONLY EDIT MUTATIONS. Hidden read-only sensing is allowed; all actual Resolve editing changes must be visible mouse/keyboard/UI moves. FIRST get C:\Users\AwesomeKai\Downloads\ARCHIE_LOVING_EDIT_WORK\ARCHIE_STORY_CUT_LIVE.srt onto the CURRENT STORY CUT LIVE (2) through Resolve's visible subtitle import workflow. It is the prepared 172-caption SRT. If already present, do not duplicate; visibly prove subtitle text. Prove captions on the work surface/viewer/timeline.

THEN PLAY/WATCH opening plus multiple joins and immediately fix taste: dead seconds, repeated setup, technical faff, weak pauses, ugly joins. Preserve funny/awkward/revealing/emotional beats. iPhone/main is home base. Samsung/second only for motivated reaction/emphasis/awkward silence/visual reset/comedy/clarity. Preserve sync and Ctrl+S checkpoints.

AUDIO: crispy close natural dialogue; Swingers crowd/background materially reduced; preserve human room tone; no metallic/watery denoise; no smashed compressor; no join level jumps. Structure before polish.

Use resident computer-control aggressively. DROP slow helpers. If Claude Cowork is useful, supervise it rather than trusting narration. The current visible-only bootstrap is https://raw.githubusercontent.com/Pokitomas/theawesomehexapp/main/tools/finish_video_now.py . Do not stop at explanation or first GUI failure. Make small reversible visible moves, verify by screen delta/playback/scrub, save, and keep editing.'''
          lines=['CURRENT_FIELD_STORY_CUT_V4']
          def call(path,method='GET',body=None,timeout=30):
            url=base+path+'?'+common_q
            req=urllib.request.Request(url,data=(json.dumps(body).encode() if body is not None else None),method=method,headers=headers)
            try:
              with urllib.request.urlopen(req,timeout=timeout) as r: return r.status,r.read(16000).decode('utf-8','replace')
            except urllib.error.HTTPError as e: return e.code,e.read(16000).decode('utf-8','replace')
            except Exception as e: return 0,f'{type(e).__name__}:{e}'
          st,body=call('/agent/field','POST',{'text':text}); lines += [f'field_post_status={st}','field_post_body='+body[:7000].replace(cap,'[redacted-cap]')]
          time.sleep(10)
          s,b=call('/agent/field','GET'); lines += [f'field_get_status={s}','field_get_body='+b[:10000].replace(cap,'[redacted-cap]')]
          sh,sb=call('/health','GET'); lines += [f'health_status={sh}','health_body='+sb[:3000].replace(cap,'[redacted-cap]')]
          out=os.path.join(os.environ['RUNNER_TEMP'],'current-field-actuator.txt'); open(out,'w',encoding='utf-8').write('\n'.join(lines)+'\n')
          print('\n'.join(x for x in lines if 'body=' not in x))

      - name: Publish sanitized actuator receipt
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs=require('fs'); const p=process.env.RUNNER_TEMP+'/current-field-actuator.txt';
            let text='NO_RECEIPT'; try{text=fs.readFileSync(p,'utf8')}catch(e){text+=` ${e}`}
            if(text.length>50000) text=text.slice(-50000);
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:771,body:`CURRENT_FIELD_FINISH_VIDEO_RECEIPT\nrun_id=${context.runId}\n\n\`\`\`text\n${text.replace(/```/g,'``\\`')}\n\`\`\``});
