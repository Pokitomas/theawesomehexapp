name: Current field actuator

on:
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  actuate:
    if: >-
      github.event.issue.pull_request == null &&
      github.event.issue.number == 771 &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.body == '/finish-current-video-field'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Send finish-video objective into resident machine field
        shell: python
        run: |
          import html, json, os, re, time, urllib.parse, urllib.request, urllib.error
          tramp='https://archie-link-trampoline.vercel.app/'
          page=urllib.request.urlopen(urllib.request.Request(tramp,headers={'user-agent':'archie-current-actuator'}),timeout=15).read().decode('utf-8','replace')
          m=re.search(r'href=["\']([^"\']+)["\']',page,re.I)
          if not m: raise SystemExit('no live trampoline target')
          live=html.unescape(m.group(1)); u=urllib.parse.urlsplit(live); q=urllib.parse.parse_qs(u.query)
          cap=(q.get('k') or [''])[0]
          if not cap: raise SystemExit('live target missing capability')
          base=f'{u.scheme}://{u.netloc}'; common_q=urllib.parse.urlencode({'k':cap})
          headers={'content-type':'application/json','accept':'application/json','user-agent':'gpt56-current-controller','x-archie-shell-token':cap}
          text='''FINISH_CURRENT_DAVINCI_VIDEO_NOW_V1. This is an execution objective, not a note and not an infrastructure task. Everything except the completed video is disposable. Act continuously on this Windows machine until the current Lonnie/Ryan DaVinci video is genuinely finished. Use existing local full-computer/Hotwire/sidecar abilities directly. Resolve is the target. Preserve ARCHIE // PERFECT SYNC untouched. Prefer lonee ryan - ARCHIE LOVING EDIT if present; otherwise duplicate before destructive work. Candidate C:\\Users\\AwesomeKai\\Downloads\\ARCHIE_LOVING_EDIT_WORK\\ARCHIE_FRONTIER_CUT_v1.fcpxml is a validated ~17:08 first assembly from ~25:11; import/use it if not live but revise by taste. Cut dead air, repeated setup, technical faff, non-payoff tangents and low-energy stretches; preserve funny/awkward/revealing/emotional beats. iPhone/main is stable base; Samsung/second only as motivated punctuation. Preserve solved sync (~14.489s source offset, ~6ms prior residual). Audio: crisp natural dialogue; materially reduce Swingers crowd/background without metallic denoise or crushed compression; preserve room tone and match levels. Then motivated J/L cuts, sparse punch-ins/reframes, restrained transitions, captions after timing locks. Save checkpoints and playback/scrub joins. If Claude is useful, Cowork + On your computer, actively supervise it; repair prior spawn uv ENOENT only if needed. Never stop at explanation/first GUI failure. You may run https://raw.githubusercontent.com/Pokitomas/theawesomehexapp/main/tools/finish_video_now.py as bootstrap. Success is actual saved, verified Resolve edits. Keep acting and post concrete receipts to Pokitomas/theawesomehexapp issue 771.'''
          lines=['CURRENT_FIELD_FINISH_VIDEO_V1']
          def call(path,method='GET',body=None,timeout=30):
            url=base+path+'?'+common_q
            req=urllib.request.Request(url,data=(json.dumps(body).encode() if body is not None else None),method=method,headers=headers)
            try:
              with urllib.request.urlopen(req,timeout=timeout) as r: return r.status,r.read(16000).decode('utf-8','replace')
            except urllib.error.HTTPError as e: return e.code,e.read(16000).decode('utf-8','replace')
            except Exception as e: return 0,f'{type(e).__name__}:{e}'
          st,body=call('/agent/field','POST',{'text':text}); lines += [f'field_post_status={st}','field_post_body='+body[:7000].replace(cap,'[redacted-cap]')]
          time.sleep(10)
          s,b=call('/agent/field','GET'); lines += [f'field_get_status={s}','field_get_body='+b[:10000].replace(cap,'[redacted-cap]')]
          sh,sb=call('/health','GET'); lines += [f'health_status={sh}','health_body='+sb[:3000].replace(cap,'[redacted-cap]')]
          out=os.path.join(os.environ['RUNNER_TEMP'],'current-field-actuator.txt'); open(out,'w',encoding='utf-8').write('\n'.join(lines)+'\n')
          print('\n'.join(x for x in lines if 'body=' not in x))

      - name: Publish sanitized actuator receipt
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs=require('fs'); const p=process.env.RUNNER_TEMP+'/current-field-actuator.txt';
            let text='NO_RECEIPT'; try{text=fs.readFileSync(p,'utf8')}catch(e){text+=` ${e}`}
            if(text.length>50000) text=text.slice(-50000);
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:771,body:`CURRENT_FIELD_FINISH_VIDEO_RECEIPT\nrun_id=${context.runId}\n\n\`\`\`text\n${text.replace(/```/g,'``\\`')}\n\`\`\``});
