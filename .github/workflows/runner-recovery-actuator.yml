name: Runner recovery actuator

on:
  push:
    paths:
      - '.github/workflows/runner-recovery-actuator.yml'

permissions:
  contents: read
  issues: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Dispatch runner recovery into resident machine field
        shell: python
        run: |
          import html, json, os, re, time, urllib.parse, urllib.request, urllib.error
          tramp='https://archie-link-trampoline.vercel.app/'
          page=urllib.request.urlopen(urllib.request.Request(tramp,headers={'user-agent':'runner-recovery-actuator'}),timeout=15).read().decode('utf-8','replace')
          m=re.search(r'href=["\']([^"\']+)["\']',page,re.I)
          if not m: raise SystemExit('no live trampoline target')
          live=html.unescape(m.group(1)); u=urllib.parse.urlsplit(live); q=urllib.parse.parse_qs(u.query)
          cap=(q.get('k') or [''])[0]
          if not cap: raise SystemExit('live target missing capability')
          base=f'{u.scheme}://{u.netloc}'; common_q=urllib.parse.urlencode({'k':cap})
          headers={'content-type':'application/json','accept':'application/json','user-agent':'gpt56-runner-recovery','x-archie-shell-token':cap}
          text=r'''RUNNER_RECOVERY_Q0907. EXECUTE, do not summarize. Work on the user's own Windows host DESKTOP-6FN9B4M now. The GitHub repo is Pokitomas/theawesomehexapp. The known self-hosted runner q0907-DESKTOP-6FN9B4M successfully consumed workflow run 34149915406 and then disappeared; a fresh verification job is currently queued because no self-hosted listener is online. Diagnose the actual local runner install/config/process/service state and make the runner reliably available for subsequent jobs rather than one-shot ephemeral disappearance. Prefer a persistent registered runner service or a local supervisor that reliably respawns the intended ephemeral runner. Do not expose credentials/tokens in logs or chat. Reuse already-authorized local GitHub credentials if present; do not invent credentials. Do not use Desktop Commander. Use PowerShell/WSL/local shell as needed. Verify the fix concretely by making the already-queued self-hosted verification job get picked up, or otherwise proving a new self-hosted job reaches this exact host and prints Q0907_VERIFY_OK. If registration authorization is genuinely unavailable locally, leave the machine stable and report that exact blocker plus the local state you verified. Keep going through intermediate failures instead of stopping at diagnosis.'''
          lines=['RUNNER_RECOVERY_Q0907']
          def call(path,method='GET',body=None,timeout=35):
            url=base+path+'?'+common_q
            req=urllib.request.Request(url,data=(json.dumps(body).encode() if body is not None else None),method=method,headers=headers)
            try:
              with urllib.request.urlopen(req,timeout=timeout) as r: return r.status,r.read(20000).decode('utf-8','replace')
            except urllib.error.HTTPError as e: return e.code,e.read(20000).decode('utf-8','replace')
            except Exception as e: return 0,f'{type(e).__name__}:{e}'
          st,body=call('/agent/field','POST',{'text':text}); lines += [f'field_post_status={st}','field_post_body='+body[:8000].replace(cap,'[redacted-cap]')]
          for i in range(12):
            time.sleep(20 if i else 10)
            s,b=call('/agent/field','GET'); lines += [f'field_get_{i}_status={s}','field_get_'+str(i)+'_body='+b[:12000].replace(cap,'[redacted-cap]')]
            if any(x in b for x in ('Q0907_VERIFY_OK','RUNNER_RECOVERY_DONE','registration authorization unavailable','registration authorization is unavailable')):
              break
          sh,sb=call('/health','GET'); lines += [f'health_status={sh}','health_body='+sb[:3000].replace(cap,'[redacted-cap]')]
          out=os.path.join(os.environ['RUNNER_TEMP'],'runner-recovery.txt'); open(out,'w',encoding='utf-8').write('\n'.join(lines)+'\n')
          print('\n'.join(x for x in lines if 'body=' not in x))

      - name: Publish sanitized recovery receipt
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs=require('fs'); const p=process.env.RUNNER_TEMP+'/runner-recovery.txt';
            let text='NO_RECEIPT'; try{text=fs.readFileSync(p,'utf8')}catch(e){text+=` ${e}`}
            if(text.length>50000) text=text.slice(-50000);
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:772,body:`RUNNER_RECOVERY_Q0907_RECEIPT\nrun_id=${context.runId}\n\n\`\`\`text\n${text.replace(/```/g,'``\\`')}\n\`\`\``});
