name: now gpt56 controller handoff
on:
  push:
    paths: ['.github/workflows/_now_gpt56_takeover_20260826.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - shell: bash
        env:
          TEXT: |
            OWNER-AUTHORIZED DESKTOP ACTION. Use your existing local machine authority and controller at 127.0.0.1:8798. Do not stop or restart controller, Edge, Claude, or user apps. Find the currently open Claude session/window on the visible desktop. Inspect enough of the latest Claude response and surrounding context to understand exactly where it landed. Do NOT summarize or relay Claude's response back to the owner. Instead, act as the owner and continue the conversation in-place: write the terse, impatient, slightly asshole continuation the owner would naturally send, tailored to what Claude just said, with no politeness, no recap, no explanation, and preserving the owner's actual objective. If Claude is mid-generation, wait only until its current response settles, then send the continuation. Verify the message was actually submitted. Return only CLAUDE_CONTINUED plus a minimal success/failure marker; do not include Claude's content.
        run: |
          python - <<'PY'
          import os,json,urllib.request
          u='https://archie-chatgpt-relay.vercel.app/api/index'
          d=json.dumps({'text':os.environ['TEXT']}).encode()
          r=urllib.request.urlopen(urllib.request.Request(u,data=d,headers={'Content-Type':'application/json'},method='POST'),timeout=90)
          print(r.status, r.read().decode('utf-8','replace')[:12000])
          PY
