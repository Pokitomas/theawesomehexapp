name: Q0907 finalize whole state

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/q0907-finalize-whole-state.yml'

jobs:
  final:
    runs-on: self-hosted
    timeout-minutes: 40
    steps:
      - name: Quiesce exact native owners, run every court, always restore recurrent organs
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $root='C:\Users\AwesomeKai\mach'
          $parent='C:\Users\AwesomeKai'
          $py314='C:\Python314\python.exe'
          $py312w='C:\Users\AwesomeKai\AppData\Local\Programs\Python\Python312\pythonw.exe'
          $node=(Get-Command node.exe -ErrorAction Stop).Source
          $cargo=Get-Command cargo.exe -ErrorAction SilentlyContinue; if(-not $cargo){$cargo=Get-Command cargo -ErrorAction Stop}
          Set-Location $root
          $env:PYTHONPATH=$parent
          $env:RUNNER_TRACKING_ID=''

          function Start-MachOrgans {
            $all=@(Get-CimInstance Win32_Process)
            if(-not ($all|Where-Object{$_.CommandLine -match 'mach\.core\.ingress_bridge'})){
              Start-Process -FilePath $py314 -ArgumentList @('-m','mach.core.ingress_bridge') -WorkingDirectory $parent -WindowStyle Hidden
              Start-Sleep -Seconds 2
            }
            $all=@(Get-CimInstance Win32_Process)
            if(-not ($all|Where-Object{$_.CommandLine -match 'mach\.core\.keeper'})){
              Start-Process -FilePath $py312w -ArgumentList @('-m','mach.core.keeper') -WorkingDirectory $parent -WindowStyle Hidden
              Start-Sleep -Seconds 5
            }
          }

          function Stop-Exact([object[]]$rows){
            foreach($p in $rows){
              if($p -and $p.ProcessId){
                Write-Host "STOP_EXACT pid=$($p.ProcessId) cmd=$($p.CommandLine)"
                Stop-Process -Id $p.ProcessId -Force -ErrorAction SilentlyContinue
                try { Wait-Process -Id $p.ProcessId -Timeout 8 -ErrorAction SilentlyContinue } catch {}
              }
            }
          }

          # Previous failed court may have intentionally left organs paused. Heal first.
          Start-MachOrgans

          Write-Host '=== PRECOURT LIVE IDENTITY ==='
          @'
          import os,sys
          os.chdir(r'C:\Users\AwesomeKai');sys.path.insert(0,r'C:\Users\AwesomeKai')
          import mach.core.computer as M
          c=M.connect(start=False,timeout=5)
          q=c.do('query',path='web/shore.html',find='oasis/crowd',limit=20)
          if len(q.get('hits') or [])<2:raise SystemExit('crowd not recurrent')
          s={x['edge']:x['cap'] for x in c.do('catalog')['transitions']}
          for k in ('file','splice','tree','query'):
              if M._CAPS[k].hex()!=s[k]:raise SystemExit('cap drift '+k)
          print('CROWD_AND_CAP_IDENTITY_OK=1')
          '@ | & $py314 -
          if($LASTEXITCODE-ne0){throw 'pre-court identity failed'}

          Write-Host '=== QUIESCE NATIVE IMAGE ==='
          # Keeper dies first. It cannot respawn a resident while the remaining owners exit.
          $all=@(Get-CimInstance Win32_Process)
          Stop-Exact @($all|Where-Object{$_.CommandLine -match 'mach\.core\.keeper'})
          Start-Sleep -Milliseconds 400
          $all=@(Get-CimInstance Win32_Process)
          Stop-Exact @($all|Where-Object{$_.CommandLine -match 'antigravity_seat\.py|[\\/]shell[\\/]run\.py|mach\.core\.ingress_bridge'})

          # Wait until the OS proves the DLL has no mapped owner. Only known Mach organs may be killed.
          for($round=0;$round -lt 12;$round++){
            $owners=@()
            foreach($p in Get-Process -ErrorAction SilentlyContinue){
              try { if(@($p.Modules|Where-Object{$_.ModuleName -ieq 'mach_resident.dll'}).Count -gt 0){$owners+=$p} } catch {}
            }
            if($owners.Count -eq 0){Write-Host 'NATIVE_DLL_UNMAPPED=1';break}
            foreach($p in $owners){
              $ci=Get-CimInstance Win32_Process -Filter "ProcessId=$($p.Id)" -ErrorAction SilentlyContinue
              Write-Host "DLL_OWNER_ROUND=$round pid=$($p.Id) cmd=$($ci.CommandLine)"
              if($ci.CommandLine -match 'antigravity_seat\.py|[\\/]shell[\\/]run\.py|mach\.core\.keeper|mach\.core\.ingress_bridge'){
                Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
                try{Wait-Process -Id $p.Id -Timeout 5 -ErrorAction SilentlyContinue}catch{}
              }
            }
            Start-Sleep -Seconds 1
          }
          $left=@()
          foreach($p in Get-Process -ErrorAction SilentlyContinue){try{if(@($p.Modules|Where-Object{$_.ModuleName -ieq 'mach_resident.dll'}).Count -gt 0){$left+=$p}}catch{}}

          $build=999;$rust=999
          if($left.Count -eq 0){
            Write-Host '=== NATIVE BUILD / RUST COURTS ==='
            & $cargo.Source build --manifest-path (Join-Path $root 'native\resident_core\Cargo.toml') --release
            $build=$LASTEXITCODE;Write-Host "NATIVE_BUILD_EXIT=$build"
            if($build-eq0){
              & $cargo.Source test --manifest-path (Join-Path $root 'native\resident_core\Cargo.toml') --release -- --nocapture
              $rust=$LASTEXITCODE;Write-Host "RUST_COURTS_EXIT=$rust"
            }
          } else {
            foreach($p in $left){Write-Host "UNEXPECTED_DLL_OWNER=$($p.Id) $($p.ProcessName)"}
          }

          # Restore immediately regardless of native result.
          Start-MachOrgans
          if($left.Count-ne0){throw 'native DLL retained by unexpected process'}
          if($build-ne0){throw 'native build red'}
          if($rust-ne0){throw 'rust courts red'}

          Write-Host '=== NODE CROWD / 13 STATES ==='
          @'
          import pathlib,re
          s=pathlib.Path(r'C:\Users\AwesomeKai\mach\web\shore.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script[^>]*type=["\']text/mach["\'][^>]*>(.*?)</script>',s,flags=re.S|re.I)
          d=pathlib.Path(r'C:\Users\AwesomeKai\mach\.live_shore_check');d.mkdir(exist_ok=True)
          for p in d.glob('*.mach'):p.unlink()
          for i,b in enumerate(blocks):(d/f'{i:02d}.mach').write_text(b,encoding='utf-8')
          if len(blocks)<2:raise SystemExit('missing Mach blocks')
          '@ | & $py314 -
          if($LASTEXITCODE-ne0){throw 'shore extraction red'}
          $blocks=Get-ChildItem (Join-Path $root '.live_shore_check') -Filter '*.mach'|Sort-Object Name|ForEach-Object{$_.FullName}
          & $node (Join-Path $root 'web\check.js') @blocks --frames 8 --states --watch oasis/crowd
          if($LASTEXITCODE-ne0){throw 'node crowd court red'}
          Write-Host 'CROWD_13_STATES_NODE_GREEN=1'

          Write-Host '=== 22 HOSTED SUITES ==='
          & $py314 (Join-Path $root 'tests\run_all.py')
          $hosted=$LASTEXITCODE;Write-Host "HOSTED_22_EXIT=$hosted"

          Write-Host '=== PYTEST COURT INVENTORY / EXECUTION ==='
          & $py314 -m pytest --collect-only -q (Join-Path $root 'tests')
          $collect=$LASTEXITCODE;Write-Host "PYTEST_COLLECT_EXIT=$collect"
          & $py314 -m pytest -q (Join-Path $root 'tests')
          $pytest=$LASTEXITCODE;Write-Host "PYTEST_ALL_EXIT=$pytest"

          Write-Host '=== FINAL SINGLETON / SOURCE IDENTITY ==='
          Start-MachOrgans
          $all=@(Get-CimInstance Win32_Process)
          $k=@($all|Where-Object{$_.CommandLine -match 'mach\.core\.keeper'})
          $i=@($all|Where-Object{$_.CommandLine -match 'mach\.core\.ingress_bridge'})
          $r=@($all|Where-Object{$_.CommandLine -match 'antigravity_seat\.py'})
          $s=@($all|Where-Object{$_.CommandLine -match '[\\/]shell[\\/]run\.py'})
          Write-Host "FINAL_ORGANS keeper=$($k.Count) ingress=$($i.Count) resident=$($r.Count) surface=$($s.Count)"
          if($k.Count-ne1 -or $i.Count-ne1 -or $r.Count-ne1 -or $s.Count-ne1){throw 'final organ graph red'}
          @'
          import os,sys
          os.chdir(r'C:\Users\AwesomeKai');sys.path.insert(0,r'C:\Users\AwesomeKai')
          import mach.core.computer as M
          c=M.connect(start=False,timeout=5);s={x['edge']:x['cap'] for x in c.do('catalog')['transitions']}
          for k in ('file','splice','tree','query'):
              assert M._CAPS[k].hex()==s[k],k
          assert len(c.do('query',path='web/shore.html',find='oasis/crowd',limit=20).get('hits') or [])>=2
          print('FINAL_RECURRENT_IDENTITY_OK=1')
          '@ | & $py314 -
          if($LASTEXITCODE-ne0){throw 'final identity red'}

          if($hosted-ne0){throw 'hosted suites red'}
          # pytest return 5 means no pytest-style tests; collection output will make that explicit.
          if($pytest-ne0 -and $pytest-ne5){throw 'pytest courts red'}
          Write-Host 'WHOLE_RECURRENT_STATE_OK=1'
