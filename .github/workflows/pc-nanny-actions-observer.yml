name: PC nanny actions observer

on:
  push:
    paths:
      - '.github/workflows/pc-nanny-actions-observer.yml'

permissions:
  actions: read
  contents: write

jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Observe local nanny jobs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          sleep 8
          mkdir -p machine-receipts
          python3 - <<'PY' > machine-receipts/actions-status.json
          import json, os, urllib.request
          repo=os.environ['GITHUB_REPOSITORY']
          token=os.environ['GH_TOKEN']
          req=urllib.request.Request(f'https://api.github.com/repos/{repo}/actions/runs?per_page=50',headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
          with urllib.request.urlopen(req,timeout=20) as r: data=json.load(r)
          wanted={'PC nanny spring clean v1','PC nanny Windows v1'}
          rows=[]
          for x in data.get('workflow_runs',[]):
            if x.get('name') in wanted:
              rows.append({k:x.get(k) for k in ('id','name','status','conclusion','event','head_sha','created_at','run_started_at','updated_at','html_url')})
          print(json.dumps({'observed_at':__import__('datetime').datetime.now(__import__('datetime').timezone.utc).isoformat(),'runs':rows},indent=2))
          PY
          cat machine-receipts/actions-status.json
          git config user.name 'pc-nanny-observer[bot]'
          git config user.email 'pc-nanny-observer[bot]@users.noreply.github.com'
          git add machine-receipts/actions-status.json
          git diff --cached --quiet && exit 0
          git commit -m 'PC nanny actions status [skip ci]'
          git pull --rebase
          git push
