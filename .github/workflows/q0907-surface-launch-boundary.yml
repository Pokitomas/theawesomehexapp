name: Q0907 surface launch boundary

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/q0907-surface-launch-boundary.yml'

jobs:
  diagnose:
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - name: Test exact keeper surface launch and matching independently
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $root='C:\Users\AwesomeKai\mach'
          $parent='C:\Users\AwesomeKai'
          $py314='C:\Python314\python.exe'
          $py312='C:\Users\AwesomeKai\AppData\Local\Programs\Python\Python312\python.exe'
          $py312w='C:\Users\AwesomeKai\AppData\Local\Programs\Python\Python312\pythonw.exe'
          $env:PYTHONPATH=$parent
          $env:RUNNER_TRACKING_ID=''

          $all=@(Get-CimInstance Win32_Process)
          foreach($p in @($all|Where-Object{$_.CommandLine -match 'mach\.core\.keeper'})){Stop-Process -Id $p.ProcessId -Force -ErrorAction SilentlyContinue}
          foreach($p in @($all|Where-Object{$_.CommandLine -match '[\\/]shell[\\/]run\.py'})){Stop-Process -Id $p.ProcessId -Force -ErrorAction SilentlyContinue}
          Start-Sleep -Seconds 1

          Write-Host '=== EXACT KEEPER FLAGS ==='
          @'
          import os,pathlib,subprocess,time,sys
          root=pathlib.Path(r'C:\Users\AwesomeKai\mach')
          parent=r'C:\Users\AwesomeKai'
          pyw=r'C:\Users\AwesomeKai\AppData\Local\Programs\Python\Python312\pythonw.exe'
          env=os.environ.copy();env['PYTHONPATH']=parent;env.pop('RUNNER_TRACKING_ID',None)
          log=root/'state'/'surface-flag-probe.log'
          with log.open('w',encoding='utf-8') as fh:
              p=subprocess.Popen([pyw,str(root/'shell'/'run.py')],cwd=parent,env=env,
                  creationflags=(0x08000000|0x00000008),stdin=subprocess.DEVNULL,stdout=fh,stderr=fh)
              print('FLAGGED_PID='+str(p.pid))
              time.sleep(7)
              print('FLAGGED_RETURN='+str(p.poll()))
              if p.poll() is None:
                  p.terminate()
                  try:p.wait(4)
                  except subprocess.TimeoutExpired:p.kill();p.wait()
          print('FLAGGED_LOG_BEGIN')
          print(log.read_text(encoding='utf-8',errors='replace')[-30000:])
          print('FLAGGED_LOG_END')
          '@ | & $py314 -
          if($LASTEXITCODE-ne0){throw 'flagged launch probe failed'}

          Write-Host '=== PLAIN LAUNCH + KEEPER MATCH ==='
          @'
          import os,pathlib,subprocess,time,sys
          root=pathlib.Path(r'C:\Users\AwesomeKai\mach')
          parent=r'C:\Users\AwesomeKai'
          pyw=r'C:\Users\AwesomeKai\AppData\Local\Programs\Python\Python312\pythonw.exe'
          env=os.environ.copy();env['PYTHONPATH']=parent;env.pop('RUNNER_TRACKING_ID',None)
          p=subprocess.Popen([pyw,str(root/'shell'/'run.py')],cwd=parent,env=env,
              stdin=subprocess.DEVNULL,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
          print('PLAIN_PID='+str(p.pid));time.sleep(5)
          print('PLAIN_RETURN='+str(p.poll()))
          os.chdir(parent);sys.path.insert(0,parent)
          from mach.core import keeper
          keeper.ORGANS.clear();keeper.house()
          table=keeper._running();surface=keeper.ORGANS['surface']
          print('SURFACE_ARGV='+repr(surface.argv));print('SURFACE_MARK='+surface.mark)
          for pid,cmd in sorted(table.items()):
              if 'run.py' in cmd.lower():print('RUNPY_ROW',pid,repr(cmd),'EXE',keeper._exe(cmd))
          print('MATCH_RESULT='+str(keeper._match(surface,table)))
          if p.poll() is None:
              p.terminate()
              try:p.wait(4)
              except subprocess.TimeoutExpired:p.kill();p.wait()
          '@ | & $py314 -
          if($LASTEXITCODE-ne0){throw 'plain/match probe failed'}

          Write-Host '=== RESTORE KEEPER ==='
          $all=@(Get-CimInstance Win32_Process)
          if(-not ($all|Where-Object{$_.CommandLine -match 'mach\.core\.keeper'})){Start-Process -FilePath $py312w -ArgumentList @('-m','mach.core.keeper') -WorkingDirectory $parent -WindowStyle Hidden}
          Start-Sleep -Seconds 5
          Write-Host 'SURFACE_LAUNCH_BOUNDARY_DONE=1'
