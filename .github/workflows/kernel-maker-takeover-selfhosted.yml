name: Kernel maker takeover pipe workstation

on:
  push:
    paths:
      - '.github/workflows/kernel-maker-takeover-selfhosted.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: kernel-maker-takeover-selfhosted-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  takeover:
    runs-on: [self-hosted, Windows]
    timeout-minutes: 8
    steps:
      - name: Attach ChatGPT seat and continue as pipe
        id: takeover
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $base='http://127.0.0.1:8798'
          $occ='gpt56sol-chatgpt-live'
          $out=Join-Path $env:RUNNER_TEMP ("kernel-maker-takeover-{0}.txt" -f $env:GITHUB_RUN_ID)

          function GetJ([string]$path) {
            Invoke-RestMethod -UseBasicParsing -Uri ($base+$path) -TimeoutSec 4
          }
          function PostJ([string]$path,[hashtable]$body) {
            Invoke-RestMethod -UseBasicParsing -Method Post -Uri ($base+$path) -ContentType 'application/json' -Body ($body|ConvertTo-Json -Depth 12 -Compress) -TimeoutSec 5
          }

          try {
            'KERNEL_MAKER_TAKEOVER_PIPE_V2' | Tee-Object -FilePath $out
            $before=GetJ '/seat/head'
            ('BEFORE=' + ($before|ConvertTo-Json -Depth 12 -Compress)) | Tee-Object -FilePath $out -Append
            $old=[string]$before.active_occupant

            if($old -and $old -ne $occ) {
              try {
                $d=PostJ '/seat/detach' @{occupant=$old}
                ('DETACH=' + ($d|ConvertTo-Json -Depth 8 -Compress)) | Tee-Object -FilePath $out -Append
              } catch {
                ('DETACH_WARN=' + $_.Exception.Message) | Tee-Object -FilePath $out -Append
              }
            }

            $attach=PostJ '/seat/attach' @{
              occupant=$occ
              capabilities=@{
                source='chatgpt'
                model='gpt-5.6-sol'
                transport='kernel-maker-takeover-pipe'
                direct_developer=$true
                provider_neutral_seat=$true
              }
            }
            ('ATTACH=' + ($attach|ConvertTo-Json -Depth 10 -Compress)) | Tee-Object -FilePath $out -Append

            $touch=PostJ '/seat/touch' @{occupant=$occ}
            ('TOUCH=' + ($touch|ConvertTo-Json -Depth 8 -Compress)) | Tee-Object -FilePath $out -Append
            Start-Sleep -Milliseconds 700
            $attached=GetJ '/seat/head'
            ('ATTACHED_HEAD=' + ($attached|ConvertTo-Json -Depth 12 -Compress)) | Tee-Object -FilePath $out -Append
            if([string]$attached.active_occupant -ne $occ) { throw ('TAKEOVER_VERIFY_FAILED active=' + [string]$attached.active_occupant) }

            $seq0=0
            try {$seq0=[int64]$attached.input_seq} catch {}
            $pipe=@'
          PIPE CONTINUATION — canonical renewed kernel-maker state.
          Continue as the live controller occupant; takeover/attach is infrastructure, never a completion boundary. Load/reference Pokitomas/theawesomehexapp main renewed_kernel_maker/state.json. Dedicated mode: kernel/universal-remote app maker. Preserve the admitted benchmark courts and ARCHIE CUT. Continue without waiting for a new user turn: benchmark/court -> universal-remote kernel/app-maker -> video editor -> GLM-5.3-Flash (ox-alpha) distillation probes -> synthetic preference/training loop. Use controller helpers only as bounded pipes. Maintain canonical state and deterministic receipts. Fail closed. Do not claim architecture matching, intelligence matching, training, or RLHF without measured receipts. Do not close Edge, Roblox, controller 8798, worker 8799, or unrelated processes. If another occupant later replaces this one, yield rather than fight it. Surface only meaningful milestone/blocker receipts.
          '@
            $phone=PostJ '/phone/text' @{text=$pipe}
            ('PIPE_POST=' + ($phone|ConvertTo-Json -Depth 10 -Compress)) | Tee-Object -FilePath $out -Append
            Start-Sleep -Seconds 2
            $after=GetJ '/seat/head'
            ('AFTER=' + ($after|ConvertTo-Json -Depth 12 -Compress)) | Tee-Object -FilePath $out -Append
            if([string]$after.active_occupant -ne $occ) { throw ('PIPE_SEAT_LOST active=' + [string]$after.active_occupant) }
            $seq1=0
            try {$seq1=[int64]$after.input_seq} catch {}
            ("PIPE_INPUT_SEQ before=$seq0 after=$seq1 delta=$($seq1-$seq0)") | Tee-Object -FilePath $out -Append

            $hb=Join-Path $env:TEMP 'archie_kernel_maker_takeover_heartbeat.ps1'
            @"
          `$ErrorActionPreference='SilentlyContinue'
          `$bb='http://127.0.0.1:8798'
          `$oo='$occ'
          for(`$ii=0;`$ii -lt 90;`$ii++){
            try{
              `$h=Invoke-RestMethod -UseBasicParsing -Uri (`$bb+'/seat/head') -TimeoutSec 3
              if([string]`$h.active_occupant -ne `$oo){break}
              `$r=Invoke-RestMethod -UseBasicParsing -Method Post -Uri (`$bb+'/seat/touch') -ContentType 'application/json' -Body ('{"occupant":"'+`$oo+'"}') -TimeoutSec 3
              if(-not `$r.ok){break}
            }catch{break}
            Start-Sleep -Seconds 20
          }
          "@ | Set-Content -LiteralPath $hb -Encoding UTF8
            Start-Process powershell.exe -WindowStyle Hidden -ArgumentList @('-NoLogo','-NoProfile','-NonInteractive','-ExecutionPolicy','Bypass','-File',$hb)
            ('HEARTBEAT=' + $hb) | Tee-Object -FilePath $out -Append
            'TAKEOVER_PIPE_READY' | Tee-Object -FilePath $out -Append
            "receipt_path=$out" >> $env:GITHUB_OUTPUT
            "takeover_ok=true" >> $env:GITHUB_OUTPUT
          } catch {
            ('TAKEOVER_PIPE_EXCEPTION=' + $_.Exception.Message) | Tee-Object -FilePath $out -Append
            "receipt_path=$out" >> $env:GITHUB_OUTPUT
            "takeover_ok=false" >> $env:GITHUB_OUTPUT
            exit 1
          }

      - name: Publish machine receipt
        if: always()
        uses: actions/github-script@v7
        env:
          RECEIPT_PATH: ${{ steps.takeover.outputs.receipt_path }}
          TAKEOVER_OK: ${{ steps.takeover.outputs.takeover_ok }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs=require('fs');
            let text='NO_MACHINE_RECEIPT';
            try{text=fs.readFileSync(process.env.RECEIPT_PATH,'utf8')}catch(e){text += ` ${String(e)}`}
            if(text.length>50000) text=text.slice(0,50000)+`\n...[truncated]`;
            await github.rest.issues.createComment({
              owner:context.repo.owner,
              repo:context.repo.repo,
              issue_number:771,
              body:`KERNEL_MAKER_TAKEOVER_PIPE_RECEIPT\nrun_id=${context.runId}\nok=${process.env.TAKEOVER_OK||'false'}\n\n\`\`\`text\n${text.replace(/```/g,'``\\`')}\n\`\`\``
            });
