name: PC nanny issue observer

on:
  issue_comment:
    types: [created]

permissions:
  actions: read
  issues: write

jobs:
  observe:
    if: >-
      github.event.issue.pull_request == null &&
      github.event.issue.number == 771 &&
      github.event.comment.user.login == 'Pokitomas' &&
      github.event.comment.body == '/pc-nanny-observe'
    runs-on: ubuntu-latest
    steps:
      - name: Report local workflow runs
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const runs = await github.rest.actions.listWorkflowRunsForRepo({owner:context.repo.owner,repo:context.repo.repo,per_page:50});
            const wanted = runs.data.workflow_runs.filter(r => ['PC nanny local command','PC nanny spring clean v1','PC nanny Windows v1','PC nanny issue observer'].includes(r.name)).slice(0,20);
            const lines=wanted.map(r=>`${r.id} | ${r.name} | ${r.status} | ${r.conclusion||'-'} | ${r.event} | ${r.created_at}`);
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:771,body:'PC_NANNY_RUN_STATUS\n```text\n'+lines.join('\n')+'\n```'});
