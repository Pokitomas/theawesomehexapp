name: ARCHIE hosted relay secret probe

on:
  push:
    paths:
      - '.github/workflows/archie-relay-secret-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ARCHIE_RELAY_TOKEN: ${{ secrets.ARCHIE_RELAY_TOKEN }}
      VERCEL_RELAY_TOKEN: ${{ secrets.VERCEL_RELAY_TOKEN }}
      ARCHIE_SHELL_TOKEN: ${{ secrets.ARCHIE_SHELL_TOKEN }}
      ARCHIE_SHELL_SECRET: ${{ secrets.ARCHIE_SHELL_SECRET }}
      TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
      TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Report secret presence only
        shell: python
        run: |
          import os
          names = [
              'ARCHIE_RELAY_TOKEN','VERCEL_RELAY_TOKEN','ARCHIE_SHELL_TOKEN',
              'ARCHIE_SHELL_SECRET','TAILSCALE_AUTHKEY','TAILSCALE_AUTH_KEY','VERCEL_TOKEN'
          ]
          for name in names:
              value = os.environ.get(name, '')
              print(f'{name}: present={bool(value)} length={len(value)}')
