name: ARCHIE presence + action court

on:
  push:
    branches:
      - gpt56sol/presence-action-core-20260811
  pull_request:
    paths:
      - 'scripts/archie-presence-brain-broker.mjs'
      - 'scripts/tests/archie-presence-brain-broker.test.mjs'
      - 'scripts/archie-local-semantic-broker.py'
      - 'scripts/archie-local-semantic-broker-v2.py'
      - 'scripts/archie-local-semantic-supervisor.py'
      - 'scripts/archie-semantic-trainer-coexistence-court.py'
      - 'scripts/tests/test_archie_local_semantic_broker.py'
      - 'scripts/tests/test_archie_local_semantic_broker_v2.py'
      - 'scripts/archie-capability-proof.py'
      - 'foundry/archie-action-latent/**'
      - 'foundry/archie-distill/packed_stream_train.py'
      - 'foundry/archie-distill/test_packed_stream_train.py'
      - '.github/workflows/archie-presence-action-court.yml'

permissions:
  contents: read

jobs:
  court:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install learned-court dependency
        run: python3 -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu torch
      - name: Presence broker unit court
        run: node --test scripts/tests/archie-presence-brain-broker.test.mjs
      - name: Local semantic broker preemption court
        run: python3 scripts/tests/test_archie_local_semantic_broker.py
      - name: Proof-grounded semantic boundary court
        run: python3 scripts/tests/test_archie_local_semantic_broker_v2.py
      - name: Python source syntax court
        run: |
          python3 -m py_compile scripts/archie-local-semantic-broker.py
          python3 -m py_compile scripts/archie-local-semantic-broker-v2.py
          python3 -m py_compile scripts/archie-local-semantic-supervisor.py
          python3 -m py_compile scripts/archie-semantic-trainer-coexistence-court.py
          python3 -m py_compile scripts/archie-capability-proof.py
          python3 -m py_compile foundry/archie-action-latent/motor_babble.py
          python3 -m py_compile foundry/archie-action-latent/action_groupoid_carrier.py
          python3 -m py_compile foundry/archie-action-latent/operator_predictive_core.py
          python3 -m py_compile foundry/archie-action-latent/homeostatic_surprise_memory.py
          python3 -m py_compile foundry/archie-action-latent/test_homeostatic_surprise_memory.py
          python3 -m py_compile foundry/archie-distill/packed_stream_train.py
          python3 -m py_compile foundry/archie-distill/test_packed_stream_train.py
      - name: Action-latent motor-babbling court
        run: python3 foundry/archie-action-latent/test_motor_babble.py
      - name: Learned consequence-operator court
        run: |
          set +e
          python3 foundry/archie-action-latent/operator_predictive_core.py \
            --steps 600 --codes 8 --epochs 120 --device cpu \
            --output /tmp/archie-operator-core-court.json
          rc=$?
          cat /tmp/archie-operator-core-court.json || true
          if [ "$rc" -ne 0 ]; then
            compact=$(python3 - <<'PY'
          import json
          p='/tmp/archie-operator-core-court.json'
          try:
              x=json.load(open(p))
              keys=['pass','loss_initial','loss_final','train_forward_mse','test_forward_mse','test_inverse_mse','used_codes','latent_code_capacity','latent_vs_hand_effect_purity','latent_vs_hand_effect_nmi','operator_orthogonality_max_abs_error']
              print(json.dumps({k:x.get(k) for k in keys}, separators=(',',':')))
          except Exception as e:
              print(json.dumps({'result_read_error':str(e)}))
          PY
          )
            echo "::error title=Learned consequence-operator court::$compact"
            exit "$rc"
          fi
      - name: Homeostatic surprise-memory court
        run: python3 foundry/archie-action-latent/test_homeostatic_surprise_memory.py
      - name: Packed-stream AMP overflow recovery court
        run: python3 foundry/archie-distill/test_packed_stream_train.py
      - name: Capability-proof fail-closed court
        run: |
          python3 scripts/archie-capability-proof.py --repo "$GITHUB_WORKSPACE" --output /tmp/archie-capability-proof.json
          python3 - <<'PY'
          import json
          p = json.load(open('/tmp/archie-capability-proof.json'))
          assert p['schema'] == 'archie/capability-proof-v1'
          assert p['receipt_sha256']
          assert 'shell_secret_file' in p and 'content' not in p['shell_secret_file']
          assert p['git']['is_git'] is True
          PY
