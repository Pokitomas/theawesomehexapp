name: ARCHIE cloud door check

on:
  push:
    paths:
      - '.github/workflows/archie-cloud-door-check.yml'

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect registered self-hosted runners
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o "$RUNNER_TEMP/runners.json" -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/Pokitomas/theawesomehexapp/actions/runners')
          echo "HTTP=$code"
          if [ "$code" = 200 ]; then
            jq '{total_count, runners:[.runners[]|{id,name,os,status,busy,labels:[.labels[].name]}]}' "$RUNNER_TEMP/runners.json" | tee "$RUNNER_TEMP/runner-registry.txt"
          else
            jq '{message,status}' "$RUNNER_TEMP/runners.json" 2>/dev/null | tee "$RUNNER_TEMP/runner-registry.txt" || cat "$RUNNER_TEMP/runners.json" | tee "$RUNNER_TEMP/runner-registry.txt"
          fi

      - name: Publish registry receipt
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs=require('fs'); const p=process.env.RUNNER_TEMP+'/runner-registry.txt';
            let text='NO_RECEIPT'; try{text=fs.readFileSync(p,'utf8')}catch(e){text+=' '+e}
            if(text.length>12000) text=text.slice(0,12000);
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:772,body:`Q0907_RUNNER_REGISTRY\nrun_id=${context.runId}\n\n\`\`\`json\n${text.replace(/```/g,'``\\`')}\n\`\`\``});
