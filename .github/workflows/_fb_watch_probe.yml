name: fb watch probe
on:
  push:
    paths:
      - '.github/workflows/_fb_watch_probe.yml'
permissions:
  contents: write
jobs:
  probe:
    runs-on: self-hosted
    timeout-minutes: 8
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Extract public Facebook council media metadata
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $py='C:\Users\AwesomeKai\AppData\Local\Programs\Python\Python312\python.exe'
          if(-not (Test-Path $py)){$py='C:\Python314\python.exe'}
          & $py -m pip install --disable-pip-version-check --quiet yt-dlp
          $url='https://www.facebook.com/cityofsantaclarita/videos/live-city-council-meeting-september-8-2026/1005635865869366'
          $out='C:\Users\AwesomeKai\mach\state\seen\fb-media.json'
          & $py -m yt_dlp --skip-download --dump-single-json --no-warnings $url | Set-Content -LiteralPath $out -Encoding utf8
          if(-not (Test-Path $out)){throw 'metadata output missing'}
          $obj=Get-Content -Raw -LiteralPath $out | ConvertFrom-Json
          $small=[ordered]@{
            id=$obj.id
            title=$obj.title
            duration=$obj.duration
            timestamp=$obj.timestamp
            uploader=$obj.uploader
            webpage_url=$obj.webpage_url
            subtitles=$obj.subtitles
            automatic_captions=$obj.automatic_captions
            formats=@($obj.formats | ForEach-Object {[ordered]@{format_id=$_.format_id;ext=$_.ext;protocol=$_.protocol;vcodec=$_.vcodec;acodec=$_.acodec;width=$_.width;height=$_.height;tbr=$_.tbr;abr=$_.abr;filesize=$_.filesize;url=$_.url}})
          }
          $json=$small|ConvertTo-Json -Depth 8
          $result='C:\Users\AwesomeKai\mach\state\seen\fb-probe-result.json'
          [IO.File]::WriteAllText($result,$json,[Text.UTF8Encoding]::new($false))
          function PutBus([string]$path,[byte[]]$bytes){$uri="https://api.github.com/repos/$env:GITHUB_REPOSITORY/contents/$path";$h=@{Authorization="Bearer $env:GITHUB_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28';'User-Agent'='q0907-fb'};$sha=$null;try{$cur=Invoke-RestMethod -Headers $h -Uri ($uri+'?ref=mach-live-bus') -Method Get -TimeoutSec 15;$sha=$cur.sha}catch{};$b=@{message='facebook media metadata';branch='mach-live-bus';content=[Convert]::ToBase64String($bytes)};if($sha){$b.sha=$sha};Invoke-RestMethod -Headers $h -Uri $uri -Method Put -ContentType 'application/json' -Body ($b|ConvertTo-Json -Compress) -TimeoutSec 30|Out-Null}
          PutBus 'fb-probe.json' ([IO.File]::ReadAllBytes($result))
