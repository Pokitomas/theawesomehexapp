name: fb watch probe
on:
  push:
    paths:
      - '.github/workflows/_fb_watch_probe.yml'
permissions:
  contents: write
jobs:
  probe:
    runs-on: self-hosted
    timeout-minutes: 5
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Unmute exact council video and prove loopback audio
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $py=Join-Path $env:RUNNER_TEMP 'fb_audio_proof.py'
          @'
          import json,sys,time,math
          from pathlib import Path
          sys.path.insert(0,r"C:\Users\AwesomeKai")
          from mach.core import computer as m
          import uiautomation as auto
          import numpy as np
          import soundcard as sc
          r={"started":time.time()}
          try:
              w=m._resolve("Facebook");m._focus_transition({"target":"Facebook"})
              m._key_transition({"target":"Facebook","vk":27,"physical":True})
              m._key_transition({"target":"Facebook","vk":36,"physical":True})
              time.sleep(2)
              r["document_before"]=m._document_ingress({"target":"Facebook"})
              root=auto.ControlFromHandle(int(w["hwnd"]));docs=[]
              def walk(c,d=0):
                  if d>16:return
                  try:
                      if c.ControlTypeName=="DocumentControl":docs.append(c)
                      for ch in c.GetChildren():walk(ch,d+1)
                  except Exception:pass
              walk(root)
              target=None
              for wanted in ("Unmute","Mute"):
                  for dc in docs:
                      try:
                          p=dc.GetTextPattern()
                          if p is None:continue
                          rg=p.DocumentRange.FindText(wanted,True,False)
                          if rg is not None:
                              target=(wanted,rg);break
                      except Exception:pass
                  if target:break
              r["audio_control"]=target[0] if target else None
              if target and target[0]=="Unmute":
                  rg=target[1];rects=list(rg.GetBoundingRectangles() or []);r["audio_rects"]=[str(x) for x in rects]
                  if rects:
                      q=rects[0];wx1,wy1,_,_=w["box"]
                      x=int((float(q.left)+float(q.right))/2-wx1);y=int((float(q.top)+float(q.bottom))/2-wy1)
                      r["unmute_click"]=m._click_transition({"target":"Facebook","x":x,"y":y})
                      time.sleep(1)
              speaker=sc.default_speaker()
              mic=sc.get_microphone(speaker.name,include_loopback=True)
              rate=16000;seconds=6
              with mic.recorder(samplerate=rate,channels=1) as rec:
                  data=rec.record(numframes=rate*seconds)
              a=np.asarray(data,dtype=np.float32).reshape(-1)
              r["audio"]={"samples":int(a.size),"rate":rate,"seconds":seconds,"rms":float(np.sqrt(np.mean(a*a))) if a.size else 0.0,"peak":float(np.max(np.abs(a))) if a.size else 0.0}
              np.save(r"C:\Users\AwesomeKai\mach\state\seen\fb_loopback.npy",a)
              r["document_after"]=m._document_ingress({"target":"Facebook"})
          except Exception as e:r["error"]=f"{type(e).__name__}: {e}"
          r["finished"]=time.time()
          Path(r"C:\Users\AwesomeKai\mach\state\seen\fb-probe-result.json").write_text(json.dumps(r,ensure_ascii=False,indent=2,default=str),encoding="utf-8")
          '@ | Set-Content -LiteralPath $py -Encoding utf8
          & python.exe $py
          function PutBus([string]$path,[byte[]]$bytes){$uri="https://api.github.com/repos/$env:GITHUB_REPOSITORY/contents/$path";$h=@{Authorization="Bearer $env:GITHUB_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28';'User-Agent'='q0907-fb'};$sha=$null;try{$cur=Invoke-RestMethod -Headers $h -Uri ($uri+'?ref=mach-live-bus') -Method Get -TimeoutSec 15;$sha=$cur.sha}catch{};$b=@{message='council video loopback proof';branch='mach-live-bus';content=[Convert]::ToBase64String($bytes)};if($sha){$b.sha=$sha};Invoke-RestMethod -Headers $h -Uri $uri -Method Put -ContentType 'application/json' -Body ($b|ConvertTo-Json -Compress) -TimeoutSec 30|Out-Null}
          PutBus 'fb-probe.json' ([IO.File]::ReadAllBytes('C:\Users\AwesomeKai\mach\state\seen\fb-probe-result.json'))
