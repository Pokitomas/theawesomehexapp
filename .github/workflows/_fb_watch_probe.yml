name: fb watch probe
on:
  push:
    paths:
      - '.github/workflows/_fb_watch_probe.yml'
permissions:
  contents: write
jobs:
  probe:
    runs-on: self-hosted
    timeout-minutes: 5
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Read exact council video control metadata
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $py=Join-Path $env:RUNNER_TEMP 'fb_read_meeting.py'
          @'
          import json,sys,time
          from pathlib import Path
          sys.path.insert(0,r"C:\Users\AwesomeKai")
          from mach.core import computer as m
          import uiautomation as auto
          wanted="LIVE: City Council Meeting - September 8, 2026"
          r={"started":time.time(),"matches":[]}
          try:
              w=m._resolve("Facebook"); root=auto.ControlFromHandle(int(w["hwnd"]))
              def info(c):
                  d={"name":str(getattr(c,"Name","") or ""),"type":str(getattr(c,"ControlTypeName","") or ""),"class":str(getattr(c,"ClassName","") or ""),"automation_id":str(getattr(c,"AutomationId","") or ""),"help":str(getattr(c,"HelpText","") or "")}
                  try:
                      p=c.GetValuePattern(); d["value"]=str(p.Value or "") if p is not None else ""
                  except Exception:d["value"]=""
                  try:
                      p=c.GetLegacyIAccessiblePattern(); d["legacy_value"]=str(p.Value or "") if p is not None else ""; d["legacy_action"]=str(p.DefaultAction or "") if p is not None else ""
                  except Exception:pass
                  return d
              def walk(c,d=0):
                  if d>18 or len(r["matches"])>=12:return
                  try:
                      if wanted.lower() in str(c.Name or "").lower():
                          row={"self":info(c),"parents":[]}; p=c
                          for _ in range(5):
                              try:p=p.GetParentControl(); row["parents"].append(info(p))
                              except Exception:break
                          r["matches"].append(row)
                      for ch in c.GetChildren():walk(ch,d+1)
                  except Exception:pass
              walk(root)
              r["document"]=m._document_ingress({"target":"Facebook"})
          except Exception as e:r["error"]=f"{type(e).__name__}: {e}"
          r["finished"]=time.time()
          Path(r"C:\Users\AwesomeKai\mach\state\seen\fb-probe-result.json").write_text(json.dumps(r,ensure_ascii=False,indent=2,default=str),encoding="utf-8")
          '@ | Set-Content -LiteralPath $py -Encoding utf8
          & python.exe $py
          function PutBus([string]$path,[byte[]]$bytes){$uri="https://api.github.com/repos/$env:GITHUB_REPOSITORY/contents/$path";$h=@{Authorization="Bearer $env:GITHUB_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28';'User-Agent'='q0907-fb'};$sha=$null;try{$cur=Invoke-RestMethod -Headers $h -Uri ($uri+'?ref=mach-live-bus') -Method Get -TimeoutSec 15;$sha=$cur.sha}catch{};$b=@{message='read council video metadata';branch='mach-live-bus';content=[Convert]::ToBase64String($bytes)};if($sha){$b.sha=$sha};Invoke-RestMethod -Headers $h -Uri $uri -Method Put -ContentType 'application/json' -Body ($b|ConvertTo-Json -Compress) -TimeoutSec 30|Out-Null}
          PutBus 'fb-probe.json' ([IO.File]::ReadAllBytes('C:\Users\AwesomeKai\mach\state\seen\fb-probe-result.json'))
