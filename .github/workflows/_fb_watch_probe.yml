name: fb watch probe
on:
  push:
    paths:
      - '.github/workflows/_fb_watch_probe.yml'
permissions:
  contents: write
jobs:
  probe:
    runs-on: self-hosted
    timeout-minutes: 5
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Probe local loopback and speech stack
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $py=Join-Path $env:RUNNER_TEMP 'audio_stack.py'
          @'
          import json,sys,time,subprocess,importlib.util,os
          from pathlib import Path
          r={"started":time.time(),"py314":sys.executable,"imports":{},"whisper_cache":[]}
          for n in ("soundcard","numpy","scipy"):
              try:
                  __import__(n);r["imports"][n]=True
              except Exception as e:r["imports"][n]=f"{type(e).__name__}: {e}"
          py312=Path(r"C:\Users\AwesomeKai\AppData\Local\Programs\Python\Python312\python.exe")
          if py312.exists():
              q=subprocess.run([str(py312),"-c","import json; import whisper; print(json.dumps({'whisper':True,'module':whisper.__file__}))"],capture_output=True,text=True,encoding="utf-8",errors="replace",timeout=20)
              r["py312_whisper"]={"rc":q.returncode,"out":q.stdout,"err":q.stderr}
          for d in (Path.home()/".cache"/"whisper",Path.home()/"AppData"/"Local"/"whisper"):
              if d.exists():r["whisper_cache"].extend([{"path":str(p),"bytes":p.stat().st_size} for p in d.glob("*") if p.is_file()])
          try:
              import soundcard as sc
              r["speakers"]=[str(x) for x in sc.all_speakers()]
              r["mics"]=[str(x) for x in sc.all_microphones(include_loopback=True)]
              r["default_speaker"]=str(sc.default_speaker())
          except Exception as e:r["soundcard_error"]=f"{type(e).__name__}: {e}"
          r["finished"]=time.time()
          Path(r"C:\Users\AwesomeKai\mach\state\seen\fb-probe-result.json").write_text(json.dumps(r,ensure_ascii=False,indent=2,default=str),encoding="utf-8")
          '@ | Set-Content -LiteralPath $py -Encoding utf8
          & python.exe $py
          function PutBus([string]$path,[byte[]]$bytes){$uri="https://api.github.com/repos/$env:GITHUB_REPOSITORY/contents/$path";$h=@{Authorization="Bearer $env:GITHUB_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28';'User-Agent'='q0907-fb'};$sha=$null;try{$cur=Invoke-RestMethod -Headers $h -Uri ($uri+'?ref=mach-live-bus') -Method Get -TimeoutSec 15;$sha=$cur.sha}catch{};$b=@{message='audio stack probe';branch='mach-live-bus';content=[Convert]::ToBase64String($bytes)};if($sha){$b.sha=$sha};Invoke-RestMethod -Headers $h -Uri $uri -Method Put -ContentType 'application/json' -Body ($b|ConvertTo-Json -Compress) -TimeoutSec 30|Out-Null}
          PutBus 'fb-probe.json' ([IO.File]::ReadAllBytes('C:\Users\AwesomeKai\mach\state\seen\fb-probe-result.json'))
