name: fb watch probe
on:
  push:
    paths:
      - '.github/workflows/_fb_watch_probe.yml'
permissions:
  contents: write
jobs:
  probe:
    runs-on: self-hosted
    timeout-minutes: 5
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Resolve Facebook controls at council title
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $py=Join-Path $env:RUNNER_TEMP 'fb_control_probe.py'
          @'
          import json,sys,time
          from pathlib import Path
          sys.path.insert(0,r"C:\Users\AwesomeKai")
          import uiautomation as auto
          r={"started":time.time(),"points":[]}
          def info(c):
              d={}
              for k in ("Name","ControlTypeName","ClassName","AutomationId","HelpText"):
                  try:d[k]=str(getattr(c,k) or "")
                  except Exception:d[k]=""
              try:d["rect"]=str(c.BoundingRectangle)
              except Exception:d["rect"]=""
              try:
                  p=c.GetLegacyIAccessiblePattern()
                  if p is not None:d["legacy"]={"value":str(p.Value or ""),"action":str(p.DefaultAction or ""),"role":str(p.Role)}
              except Exception:pass
              try:
                  p=c.GetValuePattern()
                  if p is not None:d["value"]=str(p.Value or "")
              except Exception:pass
              return d
          for x,y in ((900,910),(968,910),(1030,910),(1100,910),(968,932)):
              row={"xy":[x,y],"chain":[]}
              try:
                  c=auto.ControlFromPoint(x,y)
                  for _ in range(9):
                      row["chain"].append(info(c))
                      c=c.GetParentControl()
              except Exception as e:row["error"]=f"{type(e).__name__}: {e}"
              r["points"].append(row)
          r["finished"]=time.time()
          Path(r"C:\Users\AwesomeKai\mach\state\seen\fb-probe-result.json").write_text(json.dumps(r,ensure_ascii=False,indent=2,default=str),encoding="utf-8")
          '@ | Set-Content -LiteralPath $py -Encoding utf8
          & python.exe $py
          function PutBus([string]$path,[byte[]]$bytes){$uri="https://api.github.com/repos/$env:GITHUB_REPOSITORY/contents/$path";$h=@{Authorization="Bearer $env:GITHUB_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28';'User-Agent'='q0907-fb'};$sha=$null;try{$cur=Invoke-RestMethod -Headers $h -Uri ($uri+'?ref=mach-live-bus') -Method Get -TimeoutSec 15;$sha=$cur.sha}catch{};$b=@{message='council title control metadata';branch='mach-live-bus';content=[Convert]::ToBase64String($bytes)};if($sha){$b.sha=$sha};Invoke-RestMethod -Headers $h -Uri $uri -Method Put -ContentType 'application/json' -Body ($b|ConvertTo-Json -Compress) -TimeoutSec 30|Out-Null}
          PutBus 'fb-probe.json' ([IO.File]::ReadAllBytes('C:\Users\AwesomeKai\mach\state\seen\fb-probe-result.json'))
