name: fb watch probe
on:
  push:
    paths:
      - '.github/workflows/_fb_watch_probe.yml'
permissions:
  contents: write
jobs:
  probe:
    runs-on: self-hosted
    timeout-minutes: 5
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Open Facebook through live Mach computer and capture
        shell: pwsh
        run: |
          $ErrorActionPreference='Continue'
          $mach='C:\Users\AwesomeKai\mach'
          $say=Join-Path $mach 'say.py'
          function PC($o) {
            $j=$o | ConvertTo-Json -Compress -Depth 8
            try { return ((& python.exe $say '--computer' $j 2>&1) | Out-String) } catch { return "ERR: $($_.Exception.Message)" }
          }
          $r=[ordered]@{}
          $r.started=(Get-Date).ToString('o')
          $r.before=PC @{op='windows'}
          $r.launch=PC @{op='launch';target='https://www.facebook.com/cityofsantaclarita/videos/'}
          Start-Sleep -Seconds 9
          $r.after=PC @{op='windows'}
          $picked=$null
          foreach($t in @('Facebook','Santa Clarita','Edge','Chrome')) {
            if($picked){break}
            $x=PC @{op='capture';target=$t;name='fb_probe'}
            $r["capture_$t"]=$x
            if(Test-Path (Join-Path $mach 'state\seen\fb_probe.png')) {$picked=$t}
          }
          if($picked) {
            $r.picked=$picked
            $r.document=PC @{op='document';target=$picked}
            try {
              & python.exe -c "from PIL import Image; p=r'C:\Users\AwesomeKai\mach\state\seen\fb_probe.png'; q=r'C:\Users\AwesomeKai\mach\state\seen\fb_probe.jpg'; im=Image.open(p).convert('RGB'); im.thumbnail((1280,720)); im.save(q,'JPEG',quality=72,optimize=True)"
            } catch {}
          }
          $r.finished=(Get-Date).ToString('o')
          $json=$r | ConvertTo-Json -Depth 12
          $tmp=Join-Path $env:RUNNER_TEMP 'fb-probe.json'
          [IO.File]::WriteAllText($tmp,$json,[Text.UTF8Encoding]::new($false))

          function PutBus([string]$path,[byte[]]$bytes) {
            $uri="https://api.github.com/repos/$env:GITHUB_REPOSITORY/contents/$path"
            $h=@{Authorization="Bearer $env:GITHUB_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28';'User-Agent'='q0907-fb-probe'}
            $sha=$null
            try { $cur=Invoke-RestMethod -Headers $h -Uri ($uri+'?ref=mach-live-bus') -Method Get -TimeoutSec 15; $sha=$cur.sha } catch {}
            $b=@{message='fb probe result';branch='mach-live-bus';content=[Convert]::ToBase64String($bytes)}
            if($sha){$b.sha=$sha}
            Invoke-RestMethod -Headers $h -Uri $uri -Method Put -ContentType 'application/json' -Body ($b|ConvertTo-Json -Compress) -TimeoutSec 30 | Out-Null
          }
          PutBus 'fb-probe.json' ([IO.File]::ReadAllBytes($tmp))
          $jpg=Join-Path $mach 'state\seen\fb_probe.jpg'
          if(Test-Path $jpg){ PutBus 'fb-probe.jpg' ([IO.File]::ReadAllBytes($jpg)) }
