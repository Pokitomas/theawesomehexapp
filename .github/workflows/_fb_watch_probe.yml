name: fb watch probe
on:
  push:
    paths:
      - '.github/workflows/_fb_watch_probe.yml'
permissions:
  contents: write
jobs:
  probe:
    runs-on: self-hosted
    timeout-minutes: 8
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Finalize existing Facebook speech packet
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $py='C:\Users\AwesomeKai\AppData\Local\Programs\Python\Python312\python.exe'
          if(-not (Test-Path $py)){$py='C:\Python314\python.exe'}
          & $py -m pip install --disable-pip-version-check --quiet imageio-ffmpeg
          $dir='C:\Users\AwesomeKai\mach\state\seen\fb-review'
          $packet=Join-Path $dir 'packet.json'
          $clip=Join-Path $dir 'speech.mp4'
          $sheet=Join-Path $dir 'sheet.jpg'
          if(-not (Test-Path $packet)){throw 'packet checkpoint missing'}
          if(-not (Test-Path $clip)){throw 'clip checkpoint missing'}
          $final=Join-Path $dir 'finalize.py'
          @'
          import base64,json,re,subprocess,sys
          from pathlib import Path
          import imageio_ffmpeg
          d=Path(sys.argv[1]); packet=d/'packet.json'; clip=d/'speech.mp4'; sheet=d/'sheet.jpg'
          ff=imageio_ffmpeg.get_ffmpeg_exe()
          if not sheet.exists():
              subprocess.run([ff,'-hide_banner','-loglevel','error','-y','-i',str(clip),'-vf','fps=1/12,scale=360:-2,tile=5x5:padding=4:margin=4','-frames:v','1',str(sheet)],check=True)
          pkt=json.loads(packet.read_text(encoding='utf-8'))
          vol=subprocess.run([ff,'-hide_banner','-i',str(clip),'-af','volumedetect','-f','null','NUL'],capture_output=True,text=True)
          sil=subprocess.run([ff,'-hide_banner','-i',str(clip),'-af','silencedetect=noise=-35dB:d=0.35','-f','null','NUL'],capture_output=True,text=True)
          vt=(vol.stdout or '')+(vol.stderr or '')
          st=(sil.stdout or '')+(sil.stderr or '')
          starts=[float(x) for x in re.findall(r'silence_start:\s*([0-9.]+)',st)]
          ends=[float(x) for x in re.findall(r'silence_end:\s*([0-9.]+)',st)]
          sd=sum(max(0,b-a) for a,b in zip(starts,ends))
          mm=re.search(r'mean_volume:\s*([^\r\n]+)',vt); mx=re.search(r'max_volume:\s*([^\r\n]+)',vt)
          pkt.update({
            'media_file':clip.name,'mean_volume':mm.group(1).strip() if mm else '',
            'max_volume':mx.group(1).strip() if mx else '',
            'silence_events':len(starts),'silence_seconds':round(sd,2),
            'silence_fraction':round(sd/max(1,float(pkt.get('duration',1))),3),
            'sheet_frames':25
          })
          packet.write_text(json.dumps(pkt,ensure_ascii=False,indent=2),encoding='utf-8')
          (d/'sheet.b64.txt').write_text(base64.b64encode(sheet.read_bytes()).decode('ascii'),encoding='ascii')
          '@ | Set-Content -LiteralPath $final -Encoding utf8
          & $py $final $dir

          function PutBus([string]$path,[byte[]]$bytes){
            $uri="https://api.github.com/repos/$env:GITHUB_REPOSITORY/contents/$path"
            $h=@{Authorization="Bearer $env:GITHUB_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28';'User-Agent'='q0907-fb'}
            $sha=$null; try{$cur=Invoke-RestMethod -Headers $h -Uri ($uri+'?ref=mach-live-bus') -Method Get -TimeoutSec 15;$sha=$cur.sha}catch{}
            $b=@{message='facebook speech review packet';branch='mach-live-bus';content=[Convert]::ToBase64String($bytes)};if($sha){$b.sha=$sha}
            Invoke-RestMethod -Headers $h -Uri $uri -Method Put -ContentType 'application/json' -Body ($b|ConvertTo-Json -Compress) -TimeoutSec 30|Out-Null
          }
          PutBus 'fb-review.json' ([IO.File]::ReadAllBytes($packet))
          PutBus 'fb-sheet.b64.txt' ([IO.File]::ReadAllBytes((Join-Path $dir 'sheet.b64.txt')))
