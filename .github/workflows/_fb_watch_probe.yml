name: fb watch probe
on:
  push:
    paths:
      - '.github/workflows/_fb_watch_probe.yml'
permissions:
  contents: write
jobs:
  probe:
    runs-on: self-hosted
    timeout-minutes: 5
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Map current Facebook frame
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $py=Join-Path $env:RUNNER_TEMP 'fb_frame_map.py'
          @'
          import json,sys,time
          from pathlib import Path
          from PIL import Image
          sys.path.insert(0,r"C:\Users\AwesomeKai")
          from mach.core import computer as m
          r={"started":time.time()}
          try:
              m._focus_transition({"target":"Facebook"})
              m._key_transition({"target":"Facebook","vk":27,"physical":True})
              m._key_transition({"target":"Facebook","vk":36,"physical":True})
              time.sleep(2)
              cap=m._capture({"target":"Facebook","name":"fb_frame_map"})
              im=Image.open(cap["path"]).convert("L").resize((96,64))
              chars="@%#*+=-:. "
              rows=[]
              for y in range(im.height):
                  row=""
                  for x in range(im.width):
                      v=im.getpixel((x,y));row+=chars[min(len(chars)-1,int(v/256*len(chars)))]
                  rows.append(row)
              r["ascii"]="\n".join(rows)
              r["capture"]=cap
              r["document"]=m._document_ingress({"target":"Facebook"})
          except Exception as e:r["error"]=f"{type(e).__name__}: {e}"
          r["finished"]=time.time()
          Path(r"C:\Users\AwesomeKai\mach\state\seen\fb-probe-result.json").write_text(json.dumps(r,ensure_ascii=False,indent=2,default=str),encoding="utf-8")
          '@ | Set-Content -LiteralPath $py -Encoding utf8
          & python.exe $py
          function PutBus([string]$path,[byte[]]$bytes){$uri="https://api.github.com/repos/$env:GITHUB_REPOSITORY/contents/$path";$h=@{Authorization="Bearer $env:GITHUB_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28';'User-Agent'='q0907-fb'};$sha=$null;try{$cur=Invoke-RestMethod -Headers $h -Uri ($uri+'?ref=mach-live-bus') -Method Get -TimeoutSec 15;$sha=$cur.sha}catch{};$b=@{message='facebook frame map';branch='mach-live-bus';content=[Convert]::ToBase64String($bytes)};if($sha){$b.sha=$sha};Invoke-RestMethod -Headers $h -Uri $uri -Method Put -ContentType 'application/json' -Body ($b|ConvertTo-Json -Compress) -TimeoutSec 30|Out-Null}
          PutBus 'fb-probe.json' ([IO.File]::ReadAllBytes('C:\Users\AwesomeKai\mach\state\seen\fb-probe-result.json'))
