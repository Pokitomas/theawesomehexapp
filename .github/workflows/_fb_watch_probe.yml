name: fb watch probe
on:
  push:
    paths:
      - '.github/workflows/_fb_watch_probe.yml'
permissions:
  contents: write
jobs:
  probe:
    runs-on: self-hosted
    timeout-minutes: 5
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Resolve council title screen rectangle
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $py=Join-Path $env:RUNNER_TEMP 'fb_rect.py'
          @'
          import json,sys,time
          from pathlib import Path
          sys.path.insert(0,r"C:\Users\AwesomeKai")
          from mach.core import computer as m
          import uiautomation as auto
          wanted="LIVE: City Council Meeting - September 8, 2026"
          r={"started":time.time(),"wanted":wanted,"rects":[]}
          try:
              w=m._resolve("Facebook"); r["window"]=w
              root=auto.ControlFromHandle(int(w["hwnd"])); docs=[]
              def walk(c,d=0):
                  if d>16:return
                  try:
                      if c.ControlTypeName=="DocumentControl":docs.append(c)
                      for ch in c.GetChildren():walk(ch,d+1)
                  except Exception:pass
              walk(root)
              r["docs"]=len(docs)
              for dc in docs:
                  try:
                      p=dc.GetTextPattern(); rg=p.DocumentRange.FindText(wanted,False,True)
                      if rg is not None:
                          r["found_text"]=rg.GetText(-1)
                          try:r["rects"]=list(rg.GetBoundingRectangles())
                          except Exception as e:r["rect_error"]=f"{type(e).__name__}: {e}"
                          r["doc_name"]=str(dc.Name or "")
                          break
                  except Exception as e:r.setdefault("find_errors",[]).append(f"{type(e).__name__}: {e}")
          except Exception as e:r["error"]=f"{type(e).__name__}: {e}"
          r["finished"]=time.time()
          Path(r"C:\Users\AwesomeKai\mach\state\seen\fb-probe-result.json").write_text(json.dumps(r,ensure_ascii=False,indent=2,default=str),encoding="utf-8")
          '@ | Set-Content -LiteralPath $py -Encoding utf8
          & python.exe $py
          function PutBus([string]$path,[byte[]]$bytes){$uri="https://api.github.com/repos/$env:GITHUB_REPOSITORY/contents/$path";$h=@{Authorization="Bearer $env:GITHUB_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28';'User-Agent'='q0907-fb'};$sha=$null;try{$cur=Invoke-RestMethod -Headers $h -Uri ($uri+'?ref=mach-live-bus') -Method Get -TimeoutSec 15;$sha=$cur.sha}catch{};$b=@{message='council title rectangle';branch='mach-live-bus';content=[Convert]::ToBase64String($bytes)};if($sha){$b.sha=$sha};Invoke-RestMethod -Headers $h -Uri $uri -Method Put -ContentType 'application/json' -Body ($b|ConvertTo-Json -Compress) -TimeoutSec 30|Out-Null}
          PutBus 'fb-probe.json' ([IO.File]::ReadAllBytes('C:\Users\AwesomeKai\mach\state\seen\fb-probe-result.json'))
