name: fb watch probe
on:
  push:
    paths:
      - '.github/workflows/_fb_watch_probe.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Verify exact Kai review checkpoint
        shell: pwsh
        run: |
          $dir='C:\Users\AwesomeKai\mach\state\seen\fb-kai-review'
          foreach($name in @('packet.json','sheet.jpg','kai.mp4')){
            $p=Join-Path $dir $name
            if(-not (Test-Path $p)){throw "missing $name"}
          }
      - name: Upload exact Kai council review
        uses: actions/upload-artifact@v4
        with:
          name: kai-council-review
          path: |
            C:\Users\AwesomeKai\mach\state\seen\fb-kai-review\packet.json
            C:\Users\AwesomeKai\mach\state\seen\fb-kai-review\sheet.jpg
            C:\Users\AwesomeKai\mach\state\seen\fb-kai-review\kai.mp4
          compression-level: 0
          retention-days: 1
