name: fb watch probe
on:
  push:
    paths:
      - '.github/workflows/_fb_watch_probe.yml'
permissions:
  contents: write
jobs:
  probe:
    runs-on: self-hosted
    timeout-minutes: 5
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Open Facebook through live Mach computer and capture
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $mach='C:\Users\AwesomeKai\mach'
          $py=Join-Path $env:RUNNER_TEMP 'fb_probe.py'
          @'
          import json, sys, time
          from pathlib import Path
          sys.path.insert(0, r"C:\Users\AwesomeKai")
          from mach.core.computer import connect
          c = connect()
          r = {"started": time.time()}
          def call(cap, **kw):
              try:
                  return {"ok": True, "value": c.invoke(cap, **kw)}
              except Exception as e:
                  return {"ok": False, "error": f"{type(e).__name__}: {e}"}
          r["before"] = call("windows")
          r["launch"] = call("launch", target="https://www.facebook.com/cityofsantaclarita/videos/")
          time.sleep(8)
          r["after"] = call("windows")
          picked = None
          for t in ("Facebook", "Santa Clarita", "Edge", "Chrome"):
              x = call("capture", target=t, name="fb_probe")
              r["capture_" + t] = x
              if x.get("ok"):
                  picked = t
                  break
          if picked:
              r["picked"] = picked
              r["focus"] = call("focus", target=picked)
              r["document"] = call("document", target=picked)
              r["capture_final"] = call("capture", target=picked, name="fb_probe")
          r["finished"] = time.time()
          Path(r"C:\Users\AwesomeKai\mach\state\seen\fb-probe-result.json").write_text(json.dumps(r, ensure_ascii=False, indent=2, default=str), encoding="utf-8")
          try:
              from PIL import Image
              p=Path(r"C:\Users\AwesomeKai\mach\state\seen\fb_probe.png")
              q=Path(r"C:\Users\AwesomeKai\mach\state\seen\fb_probe.jpg")
              if p.exists():
                  im=Image.open(p).convert("RGB")
                  im.thumbnail((1400,900))
                  im.save(q,"JPEG",quality=78,optimize=True)
          except Exception as e:
              r["jpg_error"] = f"{type(e).__name__}: {e}"
              Path(r"C:\Users\AwesomeKai\mach\state\seen\fb-probe-result.json").write_text(json.dumps(r, ensure_ascii=False, indent=2, default=str), encoding="utf-8")
          '@ | Set-Content -LiteralPath $py -Encoding utf8
          & python.exe $py

          function PutBus([string]$path,[byte[]]$bytes) {
            $uri="https://api.github.com/repos/$env:GITHUB_REPOSITORY/contents/$path"
            $h=@{Authorization="Bearer $env:GITHUB_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28';'User-Agent'='q0907-fb-probe'}
            $sha=$null
            try { $cur=Invoke-RestMethod -Headers $h -Uri ($uri+'?ref=mach-live-bus') -Method Get -TimeoutSec 15; $sha=$cur.sha } catch {}
            $b=@{message='fb probe result';branch='mach-live-bus';content=[Convert]::ToBase64String($bytes)}
            if($sha){$b.sha=$sha}
            Invoke-RestMethod -Headers $h -Uri $uri -Method Put -ContentType 'application/json' -Body ($b|ConvertTo-Json -Compress) -TimeoutSec 30 | Out-Null
          }
          PutBus 'fb-probe.json' ([IO.File]::ReadAllBytes('C:\Users\AwesomeKai\mach\state\seen\fb-probe-result.json'))
          $jpg='C:\Users\AwesomeKai\mach\state\seen\fb_probe.jpg'
          if(Test-Path $jpg){ PutBus 'fb-probe.jpg' ([IO.File]::ReadAllBytes($jpg)) }
