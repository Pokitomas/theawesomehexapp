name: ARCHIE ChatGPT direct repair

on:
  push:
    paths:
      - '.github/workflows/archie-chatgpt-direct-repair.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: [self-hosted, sideways-maker]
    timeout-minutes: 5
    steps:
      - name: Prove workstation runner
        shell: bash
        run: |
          set -euo pipefail
          REMOTE=/home/awesomekai/archie-remote
          mkdir -p "$REMOTE"
          printf '[%s] chatgpt: SELF-HOSTED RUNNER LANDED. Direct local execution path is alive.\n' "$(date +%T)" | tee -a "$REMOTE/CHATGPT_VISIBLE_STREAM.txt"
          echo "host=$(hostname)"
          echo "runner=${RUNNER_NAME:-unknown}"
          systemctl --user show archie-shell-sidecar.service -p ActiveState -p SubState -p MainPID --no-pager
