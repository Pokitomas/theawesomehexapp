name: ARCHIE ChatGPT Resolve audit

on:
  push:
    paths:
      - '.github/workflows/archie-chatgpt-direct-repair.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: self-hosted
    timeout-minutes: 8
    steps:
      - name: Quiet ARCHIE and inspect Resolve
        shell: bash
        run: |
          set -u
          echo '=== HOST ==='
          hostname
          date --iso-8601=seconds
          echo '=== QUIET HEAVY ARCHIE ==='
          systemctl --user stop archie-gpt56-packed-stream-resident-v1.service 2>/dev/null || true
          systemctl --user stop archie-gpt56-packed-stream-v1.service 2>/dev/null || true
          systemctl --user show archie-gpt56-packed-stream-resident-v1.service archie-gpt56-packed-stream-v1.service -p Id -p ActiveState -p SubState -p Result --no-pager 2>/dev/null || true
          nvidia-smi --query-gpu=timestamp,temperature.gpu,utilization.gpu,memory.used,memory.total --format=csv,noheader || true
          echo '=== RESOLVE PROCESS ==='
          /mnt/c/Windows/System32/WindowsPowerShell/v1.0/powershell.exe -NoLogo -NoProfile -NonInteractive -Command '$p=Get-Process Resolve -ErrorAction SilentlyContinue; if($p){$p | Select-Object Id,ProcessName,MainWindowTitle,Path,StartTime | Format-List}else{"RESOLVE_NOT_RUNNING"}' || true
          echo '=== RESOLVE UIA MATCHES ==='
          /mnt/c/Windows/System32/WindowsPowerShell/v1.0/powershell.exe -NoLogo -NoProfile -NonInteractive -Command 'Add-Type -AssemblyName UIAutomationClient; $p=Get-Process Resolve -ErrorAction SilentlyContinue | Select-Object -First 1; if(!$p -or !$p.MainWindowHandle){"NO_RESOLVE_WINDOW"; exit 0}; $root=[System.Windows.Automation.AutomationElement]::FromHandle($p.MainWindowHandle); "ROOT="+$root.Current.Name; $all=$root.FindAll([System.Windows.Automation.TreeScope]::Descendants,[System.Windows.Automation.Condition]::TrueCondition); $i=0; foreach($e in $all){try{$n=$e.Current.Name; if($n -and $n -match "Lonnie|Lonee|Ryan|Chad|Timeline|Media|Multicam|Edit|Audio|Video|Offline"){($e.Current.ControlType.ProgrammaticName+" | "+$n); $i++; if($i -ge 120){break}}}catch{}}' || true
          echo '=== KNOWN MEDIA ==='
          for p in '/mnt/c/Users/AwesomeKai/Downloads/Chad x  Ryan Samsung-002.mp4' '/mnt/c/Users/AwesomeKai/Downloads/Chad x Ryan iPhone-001.MOV' '/mnt/c/Users/AwesomeKai/Downloads/RyanXChad/Ryan x Chad/Audio/Chad.WAV' '/mnt/c/Users/AwesomeKai/Downloads/RyanXChad/Ryan x Chad/Audio/Lonnie_ChadxRyan.WAV' '/mnt/c/Users/AwesomeKai/Downloads/ARCHIE_REVIEW_20260806/RyanXChad_CAMS_only.fcpxml' '/mnt/c/Users/AwesomeKai/Downloads/ARCHIE_REVIEW_20260806/RyanXChad_VIDEO_sync.fcpxml'; do if [[ -e "$p" ]]; then stat -c '%s bytes | %y | %n' "$p"; else echo "MISSING | $p"; fi; done
          echo '=== RESOLVE PROJECT LIBRARY RECENT ==='
          BASE='/mnt/c/Users/AwesomeKai/AppData/Roaming/Blackmagic Design/DaVinci Resolve/Support/Resolve Project Library'
          if [[ -d "$BASE" ]]; then find "$BASE" -maxdepth 8 -type d -printf '%T@ %TY-%Tm-%Td %TH:%TM:%TS %p\n' 2>/dev/null | sort -nr | head -50 || true; fi
          echo '=== NAMED PROJECT PATHS ==='
          if [[ -d "$BASE" ]]; then find "$BASE" -maxdepth 10 \( -iname '*lonnie*' -o -iname '*lonee*' -o -iname '*ryan*' -o -iname '*chad*' \) -print 2>/dev/null | head -100 || true; fi
          echo '=== RESOLVE SCRIPTING ==='
          find '/mnt/c/ProgramData/Blackmagic Design/DaVinci Resolve/Support/Developer/Scripting' '/mnt/c/Program Files/Blackmagic Design/DaVinci Resolve' -maxdepth 5 \( -iname 'DaVinciResolveScript.py' -o -iname 'fuscript.exe' \) -print 2>/dev/null | head -50 || true
          /mnt/c/Windows/System32/cmd.exe /c 'where py 2>nul & where python 2>nul' 2>/dev/null | tr -d '\r' || true
          echo '=== RESOLVE LOG HINTS ==='
          LOGROOT='/mnt/c/Users/AwesomeKai/AppData/Roaming/Blackmagic Design/DaVinci Resolve/Support/logs'
          if [[ -d "$LOGROOT" ]]; then find "$LOGROOT" -type f -printf '%T@ %p\n' 2>/dev/null | sort -nr | head -6 | cut -d' ' -f2- | while IFS= read -r f; do echo "--- $f"; tail -n 300 "$f" 2>/dev/null | grep -Eai 'Lonnie|Lonee|Ryan|Chad|project|timeline|media offline|decode|error' | tail -50 || true; done; fi
          echo '=== SCREENSHOT ==='
          /mnt/c/Windows/System32/WindowsPowerShell/v1.0/powershell.exe -NoLogo -NoProfile -NonInteractive -Command 'Add-Type -AssemblyName System.Windows.Forms; Add-Type -AssemblyName System.Drawing; $r=[System.Windows.Forms.SystemInformation]::VirtualScreen; $bmp=New-Object System.Drawing.Bitmap $r.Width,$r.Height; $g=[System.Drawing.Graphics]::FromImage($bmp); $g.CopyFromScreen($r.Left,$r.Top,0,0,$bmp.Size); $path="C:\Users\AwesomeKai\AppData\Local\Temp\chatgpt_resolve_audit.png"; $bmp.Save($path,[System.Drawing.Imaging.ImageFormat]::Png); $g.Dispose(); $bmp.Dispose(); "SHOT="+$path' || true
          mkdir -p /tmp/chatgpt-resolve-audit
          cp '/mnt/c/Users/AwesomeKai/AppData/Local/Temp/chatgpt_resolve_audit.png' /tmp/chatgpt-resolve-audit/resolve.png 2>/dev/null || true
      - name: Upload Resolve screenshot
        uses: actions/upload-artifact@v4
        with:
          name: resolve-audit-screen
          path: /tmp/chatgpt-resolve-audit/resolve.png
          if-no-files-found: ignore
          retention-days: 1
