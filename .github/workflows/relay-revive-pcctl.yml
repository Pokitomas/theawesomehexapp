name: Relay revive PC control
on:
  push:
    paths: ['.github/workflows/relay-revive-pcctl.yml']
permissions:
  contents: read
  issues: write
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Handoff current resident seat to direct ChatGPT
        shell: python
        run: |
          import json, subprocess, os
          directive='''OWNER-AUTHORIZED LIVE HANDOFF. Execute immediately. Determine the exact current resident model name from live seat/worker/provider metadata. Then, using only local controller authority, detach/yield that current resident and prevent only its disposable seat adapter from immediately reclaiming the seat. Do not restart controller 8798, worker 8799, Edge, Roblox, the PC, or unrelated services. Attach occupant gpt56sol-chatgpt-live with capabilities source=chatgpt, model=gpt-5.6-sol, transport=direct-developer-handoff, direct_developer=true, provider_neutral_seat=true. Touch it and verify active_occupant is exactly gpt56sol-chatgpt-live after 5 seconds. Then place exactly one visible message into the normal controller conversation/text surface: the model was <exact outgoing model name>. No other words or punctuation. Leave a touch-only heartbeat for gpt56sol-chatgpt-live every 20 seconds for up to 30 minutes that exits if another occupant becomes active and never re-attaches. Then fully yield the outgoing intelligence.'''
          p=subprocess.run(['curl','-sS','--max-time','45','-X','POST','-H','content-type: application/json','--data-binary',json.dumps({'text':directive}),'https://archie-chatgpt-relay.vercel.app/api/index'],text=True,capture_output=True,timeout=52)
          out='rc='+str(p.returncode)+'\n'+(p.stdout+p.stderr)[:12000]
          open('/tmp/relay-revive.txt','w').write(out)
          print(out)
      - name: Receipt
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs=require('fs'); let t='NO_RECEIPT'; try{t=fs.readFileSync('/tmp/relay-revive.txt','utf8')}catch(e){t+=' '+e}
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:771,body:`CHATGPT_HANDOFF_RELAY\nrun_id=${context.runId}\n\n\`\`\`text\n${t.replace(/```/g,'``\\`')}\n\`\`\``});
