name: Relay revive PC control
on:
  push:
    paths: ['.github/workflows/relay-revive-pcctl.yml']
permissions:
  contents: read
  issues: write
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ask resident controller to revive direct owner control
        shell: python
        run: |
          import json, subprocess, os
          directive='''OWNER-AUTHORIZED BOOTSTRAP ONLY. Restore the existing GitHub Actions self-hosted Windows runner/direct owner control path on this workstation so issue 771 /pcctl jobs execute again. This is transport repair, not delegated project development. Do not modify ARCHIE project code, do not restart the main controller, do not reboot, do not create a duplicate runner, and do not disturb user applications. Inspect the existing runner service/task/process and revive that exact installation if needed. Verify http://127.0.0.1:8798/seat/head is reachable. When the existing runner is online and able to accept its queued PC persistent controller job, publish exactly PCCTL_BRIDGE_READY to issue 771 if local gh is already authenticated; otherwise just keep the runner alive.''' 
          p=subprocess.run(['curl','-sS','--max-time','45','-X','POST','-H','content-type: application/json','--data-binary',json.dumps({'text':directive}),'https://archie-chatgpt-relay.vercel.app/api/index'],text=True,capture_output=True,timeout=52)
          out='rc='+str(p.returncode)+'\n'+(p.stdout+p.stderr)[:12000]
          open('/tmp/relay-revive.txt','w').write(out)
          print(out)
      - name: Receipt
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs=require('fs'); let t='NO_RECEIPT'; try{t=fs.readFileSync('/tmp/relay-revive.txt','utf8')}catch(e){t+=' '+e}
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:771,body:`RELAY_REVIVE_PCCTL\nrun_id=${context.runId}\n\n\`\`\`text\n${t.replace(/```/g,'``\\`')}\n\`\`\``});
