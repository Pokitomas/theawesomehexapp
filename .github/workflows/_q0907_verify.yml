name: q0907 verify

on:
  push:
    paths:
      - '.github/workflows/_q0907_verify.yml'

jobs:
  verify:
    runs-on: self-hosted
    timeout-minutes: 5
    outputs:
      host: ${{ steps.identity.outputs.host }}
      runner: ${{ steps.identity.outputs.runner }}
    steps:
      - id: identity
        name: Verify Windows self-hosted runner
        shell: cmd
        run: |
          @echo off
          echo HOST=%COMPUTERNAME%
          echo USER=%USERNAME%
          echo RUNNER=%RUNNER_NAME%
          >>"%GITHUB_OUTPUT%" echo host=%COMPUTERNAME%
          >>"%GITHUB_OUTPUT%" echo runner=%RUNNER_NAME%
          if /I not "%COMPUTERNAME%"=="DESKTOP-6FN9B4M" exit /b 10
          if /I not "%USERNAME%"=="AwesomeKai" exit /b 13
          C:\Windows\System32\wsl.exe -e bash -lc "printf 'WSL_OK\n'; uname -a" > "%RUNNER_TEMP%\q0907-wsl.txt" 2>&1
          type "%RUNNER_TEMP%\q0907-wsl.txt"
          findstr /C:"WSL_OK" "%RUNNER_TEMP%\q0907-wsl.txt" >nul || exit /b 11
          where nvidia-smi.exe >nul 2>nul
          if errorlevel 1 (
            echo NVIDIA_SMI_NOT_FOUND
            exit /b 12
          ) else (
            nvidia-smi.exe --query-gpu=name,utilization.gpu,memory.used,memory.total,temperature.gpu --format=csv,noheader
            if errorlevel 1 exit /b 12
          )
          echo Q0907_VERIFY_OK

  survive:
    needs: verify
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Prove runner survived prior job completion
        shell: cmd
        run: |
          @echo off
          echo FIRST_HOST=${{ needs.verify.outputs.host }}
          echo FIRST_RUNNER=${{ needs.verify.outputs.runner }}
          echo SECOND_HOST=%COMPUTERNAME%
          echo SECOND_USER=%USERNAME%
          echo SECOND_RUNNER=%RUNNER_NAME%
          if /I not "%COMPUTERNAME%"=="${{ needs.verify.outputs.host }}" exit /b 20
          if /I not "%RUNNER_NAME%"=="${{ needs.verify.outputs.runner }}" exit /b 21
          if /I not "%COMPUTERNAME%"=="DESKTOP-6FN9B4M" exit /b 22
          if /I not "%USERNAME%"=="AwesomeKai" exit /b 23
          echo Q0907_PERSIST_OK
