name: q0907 verify

on:
  push:
    paths:
      - '.github/workflows/_q0907_verify.yml'

permissions:
  contents: read

jobs:
  apply:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply observed Mach redesign
        shell: cmd
        run: |
          @echo off
          echo HOST=%COMPUTERNAME% USER=%USERNAME% RUNNER=%RUNNER_NAME%
          if /I not "%COMPUTERNAME%"=="DESKTOP-6FN9B4M" exit /b 10
          if /I not "%USERNAME%"=="AwesomeKai" exit /b 13
          python "%GITHUB_WORKSPACE%\ops\mach-delight-rewrite.py" "C:\Users\AwesomeKai\mach"
          if errorlevel 1 exit /b 31
          echo MACH_LIVE_REWRITE_OK
      - name: Mach desktop court
        shell: cmd
        run: |
          @echo off
          python "C:\Users\AwesomeKai\mach\tests\desktop_ui.py" --render "%RUNNER_TEMP%\mach-live-redesign.png"
          if errorlevel 1 exit /b 32
          echo MACH_LIVE_DESKTOP_COURT_OK

  survive:
    needs: apply
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Prove listener and rewritten source survive
        shell: cmd
        run: |
          @echo off
          if /I not "%COMPUTERNAME%"=="DESKTOP-6FN9B4M" exit /b 40
          if /I not "%USERNAME%"=="AwesomeKai" exit /b 41
          findstr /C:"(rule gui/lens-open!" "C:\Users\AwesomeKai\mach\shell\desktop.mach" >nul || exit /b 42
          findstr /C:"(rule gui/lens-key!" "C:\Users\AwesomeKai\mach\shell\desktop-apps.mach" >nul || exit /b 43
          findstr /C:"\"id\" \"halo\"" "C:\Users\AwesomeKai\mach\shell\enchiridion.mach" >nul || exit /b 44
          echo MACH_LIVE_PERSIST_OK
