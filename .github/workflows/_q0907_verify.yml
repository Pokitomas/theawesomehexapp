name: q0907 seat

on:
  push:
    paths:
      - '.github/workflows/_q0907_verify.yml'
      - 'pc-seat/inbox.json'
      - 'ops/q0907-seat.py'
      - 'ops/q0907-live-install.py'
      - 'ops/q0907-live-server.py'

concurrency:
  group: q0907-seat
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  seat:
    runs-on: self-hosted
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Execute q0907 seat request
        shell: cmd
        run: |
          @echo off
          echo HOST=%COMPUTERNAME% USER=%USERNAME% RUNNER=%RUNNER_NAME%
          if /I not "%COMPUTERNAME%"=="DESKTOP-6FN9B4M" exit /b 90
          if /I not "%USERNAME%"=="AwesomeKai" exit /b 91
          python "%GITHUB_WORKSPACE%\ops\q0907-seat.py" "%GITHUB_WORKSPACE%\pc-seat\inbox.json"
          if errorlevel 1 exit /b %ERRORLEVEL%
          echo Q0907_DURABLE_SEAT_OK
      - name: Preserve private live-seat capability
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q0907-live-seat-${{ github.run_id }}
          path: ${{ runner.temp }}/q0907-live-seat.json
          if-no-files-found: ignore
          retention-days: 1
