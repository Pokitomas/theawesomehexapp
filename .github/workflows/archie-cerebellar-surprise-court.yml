name: ARCHIE cerebellar surprise falsification court

on:
  push:
    branches:
      - gpt56sol/cerebellar-surprise-court-20260811
    paths:
      - 'foundry/archie-cerebellar-surprise/**'
      - '.github/workflows/archie-cerebellar-surprise-court.yml'
  pull_request:
    paths:
      - 'foundry/archie-cerebellar-surprise/**'
      - '.github/workflows/archie-cerebellar-surprise-court.yml'

permissions:
  contents: read

jobs:
  court:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax court
        run: |
          python3 -m py_compile foundry/archie-cerebellar-surprise/cerebellar_surprise.py
          python3 -m py_compile foundry/archie-cerebellar-surprise/test_cerebellar_surprise.py
          python3 -m py_compile foundry/archie-cerebellar-surprise/resident_operator_continuity.py
          python3 -m py_compile foundry/archie-cerebellar-surprise/test_resident_operator_continuity.py
          python3 -m py_compile foundry/archie-cerebellar-surprise/nonlinear_history_court.py
          python3 -m py_compile foundry/archie-cerebellar-surprise/test_nonlinear_history_court.py
      - name: Falsification and continuity unit courts
        working-directory: foundry/archie-cerebellar-surprise
        run: python3 -m unittest -v test_cerebellar_surprise.py test_resident_operator_continuity.py test_nonlinear_history_court.py
      - name: Nonlinear history separation court
        run: |
          python3 foundry/archie-cerebellar-surprise/nonlinear_history_court.py --output /tmp/nonlinear-history.json >/tmp/nonlinear-history.stdout
          python3 - <<'PY'
          import json
          r = json.load(open('/tmp/nonlinear-history.json', encoding='utf-8'))
          assert r['schema'] == 'archie/cerebellar-nonlinear-history-court-v1'
          assert r['pass'] is True
          assert r['promotion'] is False
          assert r['checks']['linear_bank_aliases_histories_exactly'] is True
          assert r['checks']['null_witness_is_exact'] is True
          assert r['checks']['nonlinear_bank_separates_aliased_histories'] is True
          assert r['checks']['same_state_scalar_count'] is True
          assert r['linear_two_state_bank']['plus_state_exact'] == ['15/16', '175/128']
          assert r['linear_two_state_bank']['minus_state_exact'] == ['15/16', '175/128']
          assert r['nonlinear_two_state_bank']['linf_state_separation'] > 1e-4
          assert r['nonlinear_two_state_bank']['ei_differential_separation'] > 1e-4
          print(json.dumps({
              'pass': r['pass'],
              'promotion': r['promotion'],
              'linear_state': r['linear_two_state_bank']['plus_state_exact'],
              'nonlinear_linf': r['nonlinear_two_state_bank']['linf_state_separation'],
              'differential_separation': r['nonlinear_two_state_bank']['ei_differential_separation'],
          }, sort_keys=True))
          PY
      - name: Frozen strict surprise receipt court
        run: |
          python3 foundry/archie-cerebellar-surprise/cerebellar_surprise.py --output /tmp/cerebellar-surprise.json >/tmp/cerebellar-surprise.stdout
          python3 - <<'PY'
          import json, math
          actual = json.load(open('/tmp/cerebellar-surprise.json', encoding='utf-8'))
          frozen = json.load(open('foundry/archie-cerebellar-surprise/REFERENCE_RECEIPT.json', encoding='utf-8'))
          assert actual['schema'] == 'archie/cerebellar-surprise-court-v1'
          assert frozen['schema'] == 'archie/cerebellar-surprise-reference-receipt-v1'
          assert actual['pass'] is frozen['verdict']['pass'] is True
          assert actual['promotion'] is frozen['verdict']['promotion'] is False
          assert actual['checks']['affine_equivalence_falsifier'] is True
          assert actual['checks']['stagnant_action_loop_breaks'] is True
          assert actual['checks']['productive_repetition_preserved'] is True
          assert actual['baselines']['simple_unseen_event']['ei_dominated_by_one_trace_on_this_task'] is True
          assert actual['falsified_claims'] == frozen['falsified_claims']
          for name, expected in frozen['expected_metrics'].items():
              observed = actual['metrics'][name]
              assert math.isclose(observed, expected, rel_tol=0.0, abs_tol=1e-15), (name, observed, expected)
          print(json.dumps({'pass': actual['pass'], 'promotion': actual['promotion'], 'metrics': actual['metrics']}, sort_keys=True))
          PY
      - name: Frozen semantic-collapse continuity receipt court
        run: |
          python3 foundry/archie-cerebellar-surprise/resident_operator_continuity.py --output /tmp/resident-continuity.json >/tmp/resident-continuity.stdout
          python3 - <<'PY'
          import json, math
          actual = json.load(open('/tmp/resident-continuity.json', encoding='utf-8'))
          frozen = json.load(open('foundry/archie-cerebellar-surprise/CONTINUITY_RECEIPT.json', encoding='utf-8'))
          assert actual['schema'] == 'archie/resident-operator-continuity-court-v1'
          assert frozen['schema'] == 'archie/resident-operator-continuity-reference-receipt-v1'
          assert actual['pass'] is frozen['verdict']['pass'] is True
          assert actual['promotion'] == frozen['verdict']['promotion']
          assert actual['checks']['renderer_fallback_cannot_change_operator_trajectory'] is True
          assert actual['checks']['stagnant_repeat_breaks_by_second_repeat'] is True
          assert actual['checks']['productive_repetition_preserved'] is True
          assert actual['checks']['surprising_no_progress_is_inspected_not_randomized'] is True
          assert actual['checks']['restart_preserves_objective_and_memory'] is True
          assert actual['checks']['no_added_ei_dynamic_traces'] is True
          assert actual['renderer_collapse']['generic_operator_trajectory'] == frozen['renderer_collapse']['generic_operator_trajectory']
          assert actual['renderer_collapse']['durable_snapshots_equal'] == frozen['renderer_collapse']['durable_snapshots_equal'] is True
          assert actual['stagnation']['first_decision'] == frozen['stagnation']['first_decision']
          assert actual['stagnation']['second_decision'] == frozen['stagnation']['second_decision']
          assert math.isclose(actual['stagnation']['second_novelty_gate'], frozen['stagnation']['second_novelty_gate'], rel_tol=0.0, abs_tol=1e-15)
          assert actual['productive_repeat'] == frozen['productive_repeat']
          assert actual['unexpected_consequence']['decision'] == frozen['unexpected_consequence']['decision']
          assert math.isclose(actual['unexpected_consequence']['novelty_gate'], frozen['unexpected_consequence']['novelty_gate'], rel_tol=0.0, abs_tol=1e-15)
          assert actual['state_reuse'] == frozen['state_reuse']
          print(json.dumps({
              'pass': actual['pass'],
              'renderer_trajectory': actual['renderer_collapse']['generic_operator_trajectory'],
              'stagnation': actual['stagnation'],
              'productive_repeat': actual['productive_repeat'],
              'unexpected_consequence': actual['unexpected_consequence'],
              'state_reuse': actual['state_reuse'],
          }, sort_keys=True))
          PY
