name: Kai camping probe temporary

on:
  push:
    paths:
      - '.github/workflows/kai-camping-probe-temp.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: [self-hosted, Windows]
    timeout-minutes: 5
    steps:
      - name: Read-only machine inventory
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          Write-Host '=== IDENTITY ==='
          hostname
          whoami
          Write-Host '=== WINDOWS ==='
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption,Version,BuildNumber | Format-List
          Write-Host '=== GPU ==='
          Get-CimInstance Win32_VideoController | Select-Object Name,AdapterRAM,DriverVersion | Format-Table -AutoSize
          Write-Host '=== DISK ==='
          Get-PSDrive -PSProvider FileSystem | Select-Object Name,@{n='FreeGB';e={[math]::Round($_.Free/1GB,1)}},@{n='UsedGB';e={[math]::Round($_.Used/1GB,1)}} | Format-Table -AutoSize
          Write-Host '=== TAILSCALE ==='
          $ts = Get-Command tailscale.exe -ErrorAction SilentlyContinue
          if ($ts) { tailscale status } else { Write-Host 'TAILSCALE_NOT_IN_PATH' }
          Write-Host '=== DAVINCI ==='
          $paths = @(
            'C:\Program Files\Blackmagic Design\DaVinci Resolve\Resolve.exe',
            'C:\Program Files\Blackmagic Design\DaVinci Resolve Studio\Resolve.exe'
          )
          $found = $paths | Where-Object { Test-Path $_ }
          if ($found) { $found } else { Write-Host 'DAVINCI_NOT_FOUND_COMMON_PATHS' }
          Write-Host '=== DONE ==='
