name: Q0907 face parse fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/q0907-face-parse-fix.yml'

jobs:
  fix:
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - name: Remove the extra close, parse every studio source, and hold the real studio
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $root='C:\Users\AwesomeKai\mach'
          $parent='C:\Users\AwesomeKai'
          $py314='C:\Python314\python.exe'
          $py312w='C:\Users\AwesomeKai\AppData\Local\Programs\Python\Python312\pythonw.exe'
          $env:PYTHONPATH=$parent
          $env:PYTHONIOENCODING='utf-8'
          $env:RUNNER_TRACKING_ID=''
          Set-Location $parent

          Write-Host '=== PATCH EXACT FACE FORM ==='
          @'
          from pathlib import Path
          import shutil,time
          root=Path(r'C:\Users\AwesomeKai\mach')
          p=root/'shell'/'face.mach'
          s=p.read_text(encoding='utf-8')
          old=')))) (range (len face/source-lines))))'
          new=')))) (range (len face/source-lines)))'
          if old in s:
              stamp=time.strftime('%Y%m%d_%H%M%S')
              b=root/'state'/('face-before-parse-fix-'+stamp+'.mach')
              shutil.copy2(p,b)
              s=s.replace(old,new,1)
              p.write_text(s,encoding='utf-8')
              print('PATCHED='+str(p));print('BACKUP='+str(b))
          elif new in s:
              print('ALREADY_FIXED='+str(p))
          else:
              raise SystemExit('exact source-paint boundary not found')
          '@ | & $py314 -
          if($LASTEXITCODE-ne0){throw 'face patch failed'}

          Write-Host '=== PARSE EVERY LIVE SHELL FORM ==='
          @'
          import sys,pathlib
          root=pathlib.Path(r'C:\Users\AwesomeKai\mach');sys.path.insert(0,r'C:\Users\AwesomeKai')
          from mach.lang.read import read
          bad=[]
          for p in sorted((root/'shell').glob('*.mach')):
              try:
                  n=len(read(p.read_text(encoding='utf-8')))
                  print('PARSE_OK',p.name,n)
              except Exception as e:
                  bad.append((p.name,type(e).__name__,str(e)));print('PARSE_FAIL',*bad[-1])
          if bad: raise SystemExit('malformed live shell files: '+repr(bad))
          print('ALL_SHELL_MACH_PARSE_OK=1')
          '@ | & $py314 -
          if($LASTEXITCODE-ne0){throw 'live shell parse court failed'}

          Write-Host '=== RESTART EXACT KEEPER / STUDIO ==='
          $all=@(Get-CimInstance Win32_Process)
          foreach($p in @($all|Where-Object{$_.CommandLine -match 'mach\.core\.keeper'})){Stop-Process -Id $p.ProcessId -Force -ErrorAction SilentlyContinue}
          foreach($p in @($all|Where-Object{$_.CommandLine -match 'studio_run\.py'})){Stop-Process -Id $p.ProcessId -Force -ErrorAction SilentlyContinue}
          Start-Sleep -Seconds 1
          Start-Process -FilePath $py312w -ArgumentList @('-m','mach.core.keeper') -WorkingDirectory $parent -WindowStyle Hidden

          Write-Host '=== 30 SECOND RECURRENCE COURT ==='
          Start-Sleep -Seconds 9
          $s1=@(Get-CimInstance Win32_Process|Where-Object{$_.CommandLine -match 'studio_run\.py'})
          $r1=@(Get-CimInstance Win32_Process|Where-Object{$_.CommandLine -match 'mach\.core\.antigravity_seat'})
          if($s1.Count-ne1 -or $r1.Count-ne1){
            if(Test-Path (Join-Path $root 'state\warden.log')){Get-Content (Join-Path $root 'state\warden.log') -Tail 80}
            throw "9s organs studio=$($s1.Count) resident=$($r1.Count)"
          }
          $spid=$s1[0].ProcessId;$rpid=$r1[0].ProcessId
          Write-Host "PIDS_9S studio=$spid resident=$rpid"
          Start-Sleep -Seconds 21
          $s2=@(Get-CimInstance Win32_Process|Where-Object{$_.CommandLine -match 'studio_run\.py'})
          $r2=@(Get-CimInstance Win32_Process|Where-Object{$_.CommandLine -match 'mach\.core\.antigravity_seat'})
          if($s2.Count-ne1 -or $r2.Count-ne1){throw "30s organs studio=$($s2.Count) resident=$($r2.Count)"}
          Write-Host "PIDS_30S studio=$($s2[0].ProcessId) resident=$($r2[0].ProcessId)"
          if($s2[0].ProcessId-ne$spid){throw 'studio restarted during recurrence court'}
          if($r2[0].ProcessId-ne$rpid){throw 'resident restarted during recurrence court'}

          @'
          import os,sys
          os.chdir(r'C:\Users\AwesomeKai');sys.path.insert(0,r'C:\Users\AwesomeKai')
          import mach.core.computer as M
          c=M.connect(start=False,timeout=5);cat=c.do('catalog')
          print('CATALOG_OK='+str(cat.get('ok'))+' N='+str(len(cat.get('transitions',[]))))
          assert cat.get('ok') and len(cat.get('transitions',[]))>=13
          '@ | & $py314 -
          if($LASTEXITCODE-ne0){throw 'machine capability court failed'}
          Write-Host 'LIVE_STUDIO_RECURRENT_OK=1'
