name: kernel-maker takeover pipe

on:
  push:
    paths:
      - '.github/workflows/kernel-maker-takeover-pipe.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kernel-maker-takeover-pipe
  cancel-in-progress: true

jobs:
  pipe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Relay takeover into renewed maker state
        shell: python
        run: |
          import json, subprocess, time
          directive = '''OWNER-AUTHORIZED TAKEOVER PIPE. Execute locally now.

1. Read the live controller seat at http://127.0.0.1:8798/seat/head and current worker/provider metadata. Preserve controller 8798, worker 8799, Edge, Roblox, the PC, and unrelated processes.
2. If the current seat occupant is stale, yield/detach only that disposable occupant/adapter. If a live replaceable resident owns the seat, yield it cleanly. Attach gpt56sol-chatgpt-live with capabilities source=chatgpt, model=gpt-5.6-sol, transport=kernel-maker-takeover-pipe, direct_developer=true, provider_neutral_seat=true. Touch it and verify after 5 seconds that active_occupant is exactly gpt56sol-chatgpt-live. Never fight a later replacement.
3. Treat the verified takeover as a PIPE, not a completion boundary. Immediately continue with the canonical renewed state from Pokitomas/theawesomehexapp main at renewed_kernel_maker/state.json. Dedicated mode is kernel/universal-remote app maker. Preserve the admitted benchmark courts and ARCHIE CUT work. Continue order: benchmark court -> kernel app maker -> video editor -> GLM-5.3-Flash/ox-alpha distillation probes -> synthetic preference/training loop. No architecture/intelligence/training claim without receipts.
4. Maintain a neutral touch-only heartbeat for gpt56sol-chatgpt-live every 20 seconds for at most 30 minutes, exiting immediately if another occupant becomes active. The seat handoff and maker work are one continuous pipeline.
5. Surface only a concise local receipt/blocker after verification; do not return merely because attach succeeded.'''
          p = subprocess.run([
              'curl','-sS','--max-time','45','-X','POST',
              '-H','content-type: application/json','-H','accept: application/json',
              '--data-binary',json.dumps({'text': directive}),
              'https://archie-chatgpt-relay.vercel.app/api/index'
          ], text=True, capture_output=True, timeout=52)
          print('relay_rc='+str(p.returncode))
          print((p.stdout+p.stderr)[:12000])
          if p.returncode != 0:
              raise SystemExit(p.returncode)
          time.sleep(8)
