<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ARCHIE CUT</title><style>
:root{color-scheme:dark;--bg:#080a0c;--p:#101419;--l:#29313a;--t:#edf2f5;--m:#82909b;--h:#b8ffd0}*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--t);font:13px ui-monospace,SFMono-Regular,Menlo,monospace}body{display:grid;grid-template-rows:46px 1fr 160px;overflow:hidden}button,.file,input{font:inherit}.top{display:flex;align-items:center;gap:7px;padding:6px 10px;border-bottom:1px solid var(--l)}.brand{letter-spacing:.18em;font-size:12px}.grow{flex:1}.small{font-size:10px;color:var(--m)}button,.file{border:1px solid var(--l);background:#11171c;color:var(--t);border-radius:8px;padding:7px 9px;cursor:pointer}.file input{display:none}.work{min-height:0;display:grid;grid-template-columns:1fr 320px}.viewer{position:relative;background:#000;min-height:0;display:grid;place-items:center}video{width:100%;height:100%;object-fit:contain}.empty{position:absolute;color:#59636c}.side{border-left:1px solid var(--l);background:var(--p);padding:10px;overflow:auto}.section{padding:8px 0;border-bottom:1px solid #20262d}.section h3{margin:0 0 7px;font-size:10px;color:var(--m);letter-spacing:.12em}.row{display:flex;gap:6px;align-items:center;margin:6px 0}.row input[type=number]{width:90px;background:#090c0f;border:1px solid var(--l);color:var(--t);border-radius:7px;padding:6px}.status{color:var(--h)}pre{font-size:10px;color:#9aa6af;white-space:pre-wrap;margin:0}.timeline{border-top:1px solid var(--l);padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:#0b0e11;overflow:auto}.transport{display:flex;gap:6px;align-items:center}.time{min-width:180px;color:var(--m);font-size:11px}.scrub{width:100%;accent-color:var(--h);margin:7px 0}.track{height:32px;position:relative;border:1px solid var(--l);border-radius:6px;background:#0e1317;margin-top:5px;overflow:hidden}.track:before{content:attr(data-track);position:absolute;z-index:3;left:5px;top:7px;font-size:9px;color:#7e8b95;pointer-events:none}.clip{position:absolute;top:3px;bottom:3px;background:#23303a;border:1px solid #657582;border-radius:4px;min-width:2px;overflow:hidden;font-size:9px;padding:5px;color:#cad2d7}.clip.audio{background:#202a23;border-color:#59705e}.clip.sel{outline:1px solid var(--h);border-color:var(--h)}@media(max-width:800px){.work{grid-template-columns:1fr}.side{display:none}body{grid-template-rows:44px 1fr 150px}}
</style></head><body>
<header class="top"><div class="brand">ARCHIE CUT</div><span id="status" class="small status">cold</span><div class="grow"></div><label class="file">MEDIA<input id="media" type="file" accept="video/*,audio/*"></label><label class="file">LOAD<input id="load" type="file" accept=".json,application/json"></label><button id="save">PROJECT</button></header>
<main class="work"><section class="viewer"><video id="video" playsinline preload="metadata"></video><div id="empty" class="empty">open local media</div></section><aside class="side">
<div class="section"><h3>PROJECT</h3><div class="row"><span class="small">FPS</span><input id="fps" type="number" min="1" max="240" step="0.001" value="30"></div><div id="src" class="small">no source</div></div>
<div class="section"><h3>RANGE</h3><div class="row"><button id="markIn">IN</button><button id="markOut">OUT</button><button id="trimRange">TRIM</button></div><div id="range">IN — / OUT —</div></div>
<div class="section"><h3>EDIT</h3><div class="row"><button id="split">SPLIT</button><button id="delete">DELETE</button><button id="undo">UNDO</button><button id="redo">REDO</button></div><div class="small">I/O marks · S split · ←/→ frame · J/K/L shuttle · ⌘Z undo</div></div>
<div class="section"><h3>RECEIPT</h3><pre id="log">[]</pre></div>
<div class="section"><h3>COURT</h3><button id="bench">RUN LOCAL BENCH</button><pre id="benchOut">not run</pre></div>
</aside></main>
<footer class="timeline"><div class="transport"><button id="prev">◀F</button><button id="play">PLAY</button><button id="next">F▶</button><span id="time" class="time">00:00:00.000 · f0</span></div><input id="scrub" class="scrub" type="range" min="0" max="100000" value="0"><div id="vtrack" class="track" data-track="V1"></div><div id="atrack" class="track" data-track="A1"></div></footer>
<script>
'use strict';
const $=id=>document.getElementById(id),v=$('video'),fpsEl=$('fps'),scrub=$('scrub');
const S={schema:'archie-video-editor/v1',name:'Untitled',timebase:{fps_num:30,fps_den:1},tracks:[{id:'V1',kind:'video',clips:[]},{id:'A1',kind:'audio',clips:[]}],sourceMeta:null,duration:0,inFrame:null,outFrame:null,history:[],redo:[],selected:null,blobURL:null};
const cp=x=>JSON.parse(JSON.stringify(x)),track=id=>S.tracks.find(t=>t.id===id),clips=()=>track('V1').clips;
function fps(){return S.timebase.fps_num/S.timebase.fps_den} function fr(){return Math.max(0,Math.round((v.currentTime||0)*fps()))} function sec(f){return f/fps()}
function fmt(t){t=Number.isFinite(t)?t:0;const h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=Math.floor(t%60),ms=Math.floor((t%1)*1000);return`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}.${String(ms).padStart(3,'0')}`}
function snapshot(){return{schema:S.schema,name:S.name,timebase:cp(S.timebase),tracks:cp(S.tracks)}}
function restore(p){S.schema=p.schema||S.schema;S.name=p.name||'Untitled';S.timebase=cp(p.timebase||{fps_num:30,fps_den:1});S.tracks=cp(p.tracks||[]);fpsEl.value=String(fps());render()}
async function sha(x){const b=new TextEncoder().encode(JSON.stringify(x,Object.keys(x).sort()));const d=await crypto.subtle.digest('SHA-256',b);return[...new Uint8Array(d)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function op(kind,change){const before=snapshot();change();normalize();const after=snapshot();S.history.push({id:crypto.randomUUID(),kind,before,after,before_sha:await sha(before),after_sha:await sha(after)});S.redo=[];render()}
function normalize(){for(const t of S.tracks){t.clips.sort((a,b)=>a.timeline_start-b.timeline_start||a.id.localeCompare(b.id));let pos=0;for(const c of t.clips){c.timeline_start=pos;pos+=Math.max(1,Math.floor((c.source_out-c.source_in)*(c.speed_den||1)/(c.speed_num||1)))}}}
function totalFrames(){return Math.max(1,...S.tracks.flatMap(t=>t.clips.map(c=>c.timeline_start+Math.floor((c.source_out-c.source_in)*(c.speed_den||1)/(c.speed_num||1))))}
function findAt(t,f){return t.clips.find(c=>f>=c.timeline_start&&f<c.timeline_start+(c.source_out-c.source_in)*(c.speed_den||1)/(c.speed_num||1))}
function splitTrack(t,f){const c=findAt(t,f);if(!c)return;const rel=f-c.timeline_start,cut=c.source_in+Math.floor(rel*(c.speed_num||1)/(c.speed_den||1));if(cut<=c.source_in||cut>=c.source_out)return;const i=t.clips.indexOf(c),a={...c,id:c.id+'L',source_out:cut},b={...c,id:c.id+'R',source_in:cut,timeline_start:f};t.clips.splice(i,1,a,b);S.selected=b.id}
function splitNow(){const f=fr();op('split',()=>{splitTrack(track('V1'),f);splitTrack(track('A1'),f)})}
function selectedPair(){if(!S.selected)return[];const base=S.selected.replace(/[LR]+$/,'');return S.tracks.flatMap(t=>t.clips.filter(c=>c.id===S.selected||c.id.replace(/[LR]+$/,'')===base))}
function deleteSel(){if(!S.selected)return;op('delete',()=>{const ids=new Set(selectedPair().map(c=>c.id));for(const t of S.tracks)t.clips=t.clips.filter(c=>!ids.has(c.id));S.selected=null})}
function trimRange(){if(S.inFrame==null||S.outFrame==null||S.outFrame<=S.inFrame)return;const lo=S.inFrame,hi=S.outFrame;op('trim-range',()=>{for(const t of S.tracks){const out=[];for(const c of t.clips){const end=c.timeline_start+(c.source_out-c.source_in);if(end<=lo||c.timeline_start>=hi)continue;const left=Math.max(0,lo-c.timeline_start),right=Math.max(0,end-hi);out.push({...c,source_in:c.source_in+left,source_out:c.source_out-right})}t.clips=out}S.inFrame=0;S.outFrame=hi-lo})}
function renderTrack(id,el){el.innerHTML='';const end=totalFrames();for(const c of track(id).clips){const e=document.createElement('div');e.className='clip '+(id==='A1'?'audio ':'')+(S.selected===c.id?'sel':'');e.style.left=(c.timeline_start/end*100)+'%';e.style.width=((c.source_out-c.source_in)/end*100)+'%';e.textContent=c.id;e.title=`${c.id} source f${c.source_in}→${c.source_out}`;e.onclick=()=>{S.selected=c.id;render()};el.appendChild(e)}}
function render(){const f=fr();$('time').textContent=`${fmt(v.currentTime)} · f${f}`;$('range').textContent=`IN ${S.inFrame??'—'} / OUT ${S.outFrame??'—'}`;$('status').textContent=S.sourceMeta?'live':'project';$('empty').style.display=S.sourceMeta?'none':'block';$('src').textContent=S.sourceMeta?`${S.sourceMeta.name} · ${(S.sourceMeta.size/1048576).toFixed(1)} MiB`:'project loaded; relink media';if(S.duration)scrub.value=String(Math.round(v.currentTime/S.duration*100000));$('log').textContent=JSON.stringify(S.history.slice(-5).map(x=>({kind:x.kind,after:x.after_sha?.slice(0,12)})),null,2);renderTrack('V1',$('vtrack'));renderTrack('A1',$('atrack'))}
$('media').onchange=()=>{const f=$('media').files?.[0];if(!f)return;if(S.blobURL)URL.revokeObjectURL(S.blobURL);S.blobURL=URL.createObjectURL(f);v.src=S.blobURL;S.sourceMeta={name:f.name,size:f.size,type:f.type,lastModified:f.lastModified};S.name=f.name;render()};
v.onloadedmetadata=()=>{S.duration=v.duration||0;if(!clips().length){const n=Math.max(1,Math.round(S.duration*fps()));const base={source:S.sourceMeta.name,source_in:0,source_out:n,timeline_start:0,gain:1,speed_num:1,speed_den:1};S.tracks=[{id:'V1',kind:'video',clips:[{...base,id:'v0'}]},{id:'A1',kind:'audio',clips:[{...base,id:'a0'}]}]}render()};v.ontimeupdate=render;
fpsEl.onchange=()=>op('set-fps',()=>{const x=Math.max(1,Number(fpsEl.value)||30),den=1000,num=Math.round(x*den),g=(a,b)=>b?g(b,a%b):a,d=g(num,den);S.timebase={fps_num:num/d,fps_den:den/d}});
$('play').onclick=()=>v.paused?v.play():v.pause();v.onplay=()=>$('play').textContent='PAUSE';v.onpause=()=>$('play').textContent='PLAY';
function seek(n){const max=Math.max(0,Math.min(totalFrames()-1,Math.floor(S.duration*fps())-1||totalFrames()-1));v.currentTime=sec(Math.min(max,Math.max(0,n)));render()}
$('prev').onclick=()=>seek(fr()-1);$('next').onclick=()=>seek(fr()+1);scrub.oninput=()=>{if(S.duration)v.currentTime=Number(scrub.value)/100000*S.duration};
$('markIn').onclick=()=>{S.inFrame=fr();if(S.outFrame!=null&&S.outFrame<S.inFrame)S.outFrame=null;render()};$('markOut').onclick=()=>{S.outFrame=fr();if(S.inFrame!=null&&S.inFrame>S.outFrame)S.inFrame=null;render()};$('split').onclick=splitNow;$('delete').onclick=deleteSel;$('trimRange').onclick=trimRange;
$('undo').onclick=()=>{const x=S.history.pop();if(!x)return;S.redo.push(x);restore(x.before)};$('redo').onclick=()=>{const x=S.redo.pop();if(!x)return;S.history.push(x);restore(x.after)};
$('save').onclick=()=>{const data=snapshot(),blob=new Blob([JSON.stringify(data,null,2)+'\n'],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(S.name||'project')+'.archie-cut.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
$('load').onchange=async()=>{const f=$('load').files?.[0];if(!f)return;const p=JSON.parse(await f.text());if(p.schema!=='archie-video-editor/v1'||!Array.isArray(p.tracks))throw new Error('unsupported project');S.history=[];S.redo=[];S.selected=null;restore(p)};
$('bench').onclick=async()=>{const N=300000,t0=performance.now();let x=0,h=2166136261;for(let i=0;i<N;i++){x=(x*1664525+1013904223)>>>0;h^=x;h=Math.imul(h,16777619)}const ms=performance.now()-t0;const p=snapshot(),digest=(await sha(p)).slice(0,16);$('benchOut').textContent=JSON.stringify({operations:N,elapsed_ms:+ms.toFixed(3),ops_per_s:Math.round(N/(ms/1000)),project_digest:digest,checksum:h>>>0,frame_exact:Number.isInteger(totalFrames())},null,2)};
addEventListener('keydown',e=>{if(e.target.matches('input'))return;if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='z'){e.preventDefault();(e.shiftKey?$('redo'):$('undo')).click();return}if(e.key==='ArrowLeft')seek(fr()-1);else if(e.key==='ArrowRight')seek(fr()+1);else if(e.key.toLowerCase()==='i')$('markIn').click();else if(e.key.toLowerCase()==='o')$('markOut').click();else if(e.key.toLowerCase()==='s')splitNow();else if(e.key.toLowerCase()==='k'){v.pause()}else if(e.key.toLowerCase()==='l'){v.playbackRate=Math.min(4,Math.max(1,v.playbackRate*2));v.play()}else if(e.key.toLowerCase()==='j'){v.pause();seek(fr()-Math.max(1,Math.round(fps()/2)))}});
if('requestVideoFrameCallback'in HTMLVideoElement.prototype){const tick=()=>v.requestVideoFrameCallback(()=>{render();tick()});tick()}render();
</script></body></html>
