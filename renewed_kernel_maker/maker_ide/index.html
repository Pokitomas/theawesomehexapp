<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARCHIE MAKER</title><style>:root{color-scheme:dark;--bg:#080a0c;--panel:#0f1317;--line:#27313a;--fg:#eaf0f4;--muted:#83919c;--ok:#a9ffc1}*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:12px ui-monospace,SFMono-Regular,Menlo,monospace}body{display:grid;grid-template-rows:44px 1fr;overflow:hidden}.top{display:flex;align-items:center;gap:9px;padding:7px 10px;border-bottom:1px solid var(--line)}.brand{letter-spacing:.16em}.grow{flex:1}.status{color:var(--muted)}button,textarea{font:inherit;color:inherit;background:#12181d;border:1px solid var(--line);border-radius:8px}button{padding:7px 11px;cursor:pointer}button:disabled{opacity:.4}.grid{min-height:0;display:grid;grid-template-columns:380px minmax(0,1fr)}.left{min-height:0;padding:10px;border-right:1px solid var(--line);display:grid;grid-template-rows:auto 1fr;gap:10px}.brief{width:100%;height:150px;resize:vertical;padding:10px;line-height:1.45}.pane{min-height:0;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:9px}.right{min-height:0;display:grid;grid-template-rows:1fr 210px}.preview{min-height:0;background:#050607;position:relative}.preview iframe{border:0;width:100%;height:100%;background:white}.empty{position:absolute;inset:0;display:grid;place-items:center;color:#53616b;pointer-events:none}.bottom{min-height:0;border-top:1px solid var(--line);display:grid;grid-template-columns:280px 1fr}.files{overflow:auto;border-right:1px solid var(--line);padding:7px}.file{display:block;width:100%;text-align:left;border:0;background:transparent;border-radius:4px;padding:4px 5px;color:#cbd5da}.file:hover{background:#172028}.log{overflow:auto;margin:0;padding:8px;white-space:pre-wrap;color:#9eabb4}.row{display:flex;gap:7px;align-items:center;margin-top:8px}.metric{margin:5px 0;color:var(--muted)}.ok{color:var(--ok)}@media(max-width:850px){.grid{grid-template-columns:1fr}.left{position:absolute;z-index:5;width:min(90vw,390px);height:calc(100% - 44px);background:var(--bg)}.right{grid-column:1}.bottom{grid-template-columns:180px 1fr}}</style></head><body><header class="top"><span class="brand">ARCHIE MAKER</span><span id="model" class="status">model: probing</span><span class="grow"></span><button id="refresh">REFRESH</button></header><main class="grid"><section class="left"><div><textarea id="brief" class="brief">Build an offline first-person voxel exploration game with procedural seeded terrain, WASD + mouse look, gravity and jump, collision, remove/place blocks, four materials, persistent save/load, a HUD, and one original mechanic. Build and test it yourself before finishing.</textarea><div class="row"><button id="build">BUILD WITH LOCAL MODEL</button><span id="runStatus" class="status"></span></div></div><div class="pane"><div class="metric">PROJECT <span id="project">—</span></div><div class="metric">GRADE <span id="grade">—</span></div><div class="metric">STEPS <span id="steps">—</span></div><div class="metric">DIGEST <span id="digest">—</span></div><pre id="summary" class="log">No run yet.</pre></div></section><section class="right"><div class="preview"><iframe id="frame"></iframe><div id="empty" class="empty">generated app preview</div></div><div class="bottom"><div id="files" class="files"></div><pre id="log" class="log"></pre></div></section></main><script>'use strict';const $=x=>document.getElementById(x);let current=null;function text(x){return JSON.stringify(x,null,2)}async function api(url,opt){const r=await fetch(url,opt);let j=await r.json();if(!r.ok)throw new Error(j.error||r.status);return j}async function status(){try{let s=await api('/api/status');let p=s.model?.payload||{};$('model').textContent='model: '+(p.status==='READY'?'READY':'BLOCKED');$('model').className=p.status==='READY'?'status ok':'status'}catch(e){$('model').textContent='model: status error'}}async function loadProject(id){let p=await api('/api/project/'+encodeURIComponent(id));$('project').textContent=id;$('grade').textContent=p.grade?(Math.round(p.grade.score*100)+'% '+(p.grade.passes?'PASS':'INCOMPLETE')):'—';$('files').innerHTML='';for(const f of p.files){let b=document.createElement('button');b.className='file';b.textContent=f.path+' · '+f.bytes;b.onclick=()=>openFile(id,f.path);$('files').appendChild(b)}if(p.files.some(f=>f.path==='index.html')){$('frame').src='/preview/'+encodeURIComponent(id)+'/index.html?x='+Date.now();$('empty').style.display='none'}}async function openFile(id,path){try{let r=await fetch('/api/project/'+encodeURIComponent(id)+'/'+path);let type=r.headers.get('content-type')||'';if(type.includes('text')||/\.(js|ts|json|css|md|py|html)$/i.test(path)){$('log').textContent=await r.text()}else $('log').textContent=path+'\n(binary '+(r.headers.get('content-length')||'?')+' bytes)'}catch(e){$('log').textContent=String(e)}}$('build').onclick=async()=>{let brief=$('brief').value.trim();if(brief.length<12)return;$('build').disabled=true;$('runStatus').textContent='building…';$('log').textContent='local model is working through file/build/test tools…';try{let r=await api('/api/build',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({brief,max_steps:48})});let p=r.payload||{};current=p.project_id;$('runStatus').textContent=p.status||'done';let mr=p.result?.payload||{};$('steps').textContent=mr.steps??'—';$('digest').textContent=(mr.project?.sha256||'—').slice(0,20);$('summary').textContent=mr.summary||text(p.grade?.payload||{});$('log').textContent=text((mr.events||[]).slice(-20));await loadProject(current)}catch(e){$('runStatus').textContent='ERROR';$('log').textContent=String(e)}finally{$('build').disabled=false}};$('refresh').onclick=async()=>{await status();if(current)await loadProject(current)};status();</script></body></html>
