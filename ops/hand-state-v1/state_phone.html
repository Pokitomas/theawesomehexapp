<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090a0c"><title>HAND</title><style>
:root{color-scheme:dark;font-family:ui-rounded,system-ui,-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;background:#090a0c;color:#f7f7f8}*{box-sizing:border-box}body{margin:0;background:#090a0c}.w{max-width:780px;margin:auto;padding:calc(8px + env(safe-area-inset-top)) 10px 28px}.top{display:flex;align-items:center;gap:9px;padding:3px 2px 9px}.dot{width:10px;height:10px;border-radius:50%;background:#4ade8a;box-shadow:0 0 20px #4ade8a99}.name{font-weight:800;letter-spacing:.04em}.metric{margin-left:auto;font:12px ui-monospace,SFMono-Regular,Menlo,monospace;color:#a4a6ad}.screen{position:relative;overflow:hidden;border:1px solid #2b2d32;border-radius:17px;aspect-ratio:16/9;background:#15171b;touch-action:manipulation}.screen img{display:block;width:100%;height:100%;object-fit:cover}.badge{position:absolute;right:8px;bottom:8px;padding:5px 8px;border-radius:10px;background:#101216dd;font:11px ui-monospace,SFMono-Regular;color:#d6d7da}.state{margin:10px 0 8px;padding:12px 13px;border:1px solid #292b30;border-radius:15px;background:#14161a}.label{font:10px ui-monospace,SFMono-Regular;letter-spacing:.15em;color:#7f838c}.main{margin-top:6px;font-size:16px;line-height:1.3;overflow-wrap:anywhere}.sub{margin-top:6px;font:11px ui-monospace,SFMono-Regular;line-height:1.45;color:#989ca5}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}button{min-height:52px;border:1px solid #303238;border-radius:14px;background:#191b20;color:#f5f5f6;font-size:13px;font-weight:780;touch-action:manipulation}button:active{transform:scale(.97);background:#262930}.primary{background:#f5f5f6;color:#0b0c0e;border-color:#f5f5f6}.guard{margin-top:10px;font:10px ui-monospace,SFMono-Regular;color:#62666f}.bad{color:#ff7d88}.amber{color:#f3bd62}@media(max-width:470px){.grid{grid-template-columns:repeat(5,1fr);gap:6px}button{font-size:11px;min-height:50px}.w{padding-left:8px;padding-right:8px}}</style></head><body><main class="w"><div class="top"><span id="dot" class="dot"></span><span class="name">HAND</span><span id="metric" class="metric">direct…</span></div><div id="screenWrap" class="screen"><img id="screen" alt="desktop"><span id="screenAge" class="badge">SCREEN —</span></div><section class="state"><div class="label">STATE</div><div id="main" class="main">connecting…</div><div id="sub" class="sub">deterministic fast-path · ML asleep</div></section><div class="grid"><button data-a="take">TAKE</button><button class="primary" data-a="play">PLAY</button><button data-a="save">SAVE</button><button data-a="fit">FIT</button><button data-a="esc">ESC</button><button data-a="undo">UNDO</button><button data-a="redo">REDO</button><button data-a="edit">EDIT</button><button data-a="cut">CUT</button><button data-a="look">STATE</button></div><div class="guard">HARD GUARD · LOVING EDIT mutable · CUT / PERFECT SYNC locked</div></main><script>
const $=s=>document.querySelector(s),M=$('#metric'),MAIN=$('#main'),SUB=$('#sub'),DOT=$('#dot'),IMG=$('#screen'),SA=$('#screenAge');let S=null,frames=0,busy=false;
function ageMs(t){return t?Math.max(0,Date.now()-t*1000):Infinity}function render(s){S=s;const f=s.front||{},a=ageMs(s.at),sa=ageMs(s.screen?.mtime);MAIN.textContent=`${f.process||'desktop'} · ${f.title||'no foreground title'}`;SUB.textContent=`state ${Math.round(a)}ms · idle ${s.idle_ms==null?'—':Math.round(s.idle_ms)}ms · cursor ${(s.cursor||[]).join(',')} · screen ${Math.round(sa)}ms · seq ${s.seq} · ML asleep`;DOT.style.background=a<120?'#4ade8a':a<500?'#f3bd62':'#ff6574';SA.textContent=`SCREEN ${isFinite(sa)?Math.round(sa)+'ms':'—'}`;SA.className='badge '+(sa>800?'bad':sa>350?'amber':'')}
function connect(){const es=new EventSource('/events');es.onmessage=e=>{try{render(JSON.parse(e.data))}catch{}};es.onerror=()=>{es.close();setTimeout(connect,450)}}
async function ping(){const t=performance.now();try{await fetch('/ping?x='+Date.now(),{cache:'no-store'});M.textContent=Math.round(performance.now()-t)+'ms direct'}catch{M.textContent='offline'}setTimeout(ping,1200)}
function shot(){const i=new Image(),u='/screen?x='+Date.now();i.onload=()=>{IMG.src=u;frames++;setTimeout(shot,180)};i.onerror=()=>setTimeout(shot,600);i.src=u}
async function act(action,extra={}){if(busy)return;busy=true;try{const t=performance.now(),r=await fetch('/action',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action,...extra})}),j=await r.json();M.textContent=(j.roundtrip_ms??Math.round(performance.now()-t))+'ms act';if(!j.ok)M.textContent=j.error||'blocked'}catch(e){M.textContent='act offline'}finally{busy=false}}
document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>act(b.dataset.a));$('#screenWrap').addEventListener('pointerup',e=>{const r=IMG.getBoundingClientRect();if(r.width&&r.height)act('tap',{x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height})});connect();ping();shot();
</script></body></html>
